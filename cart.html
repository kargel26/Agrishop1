<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Shopping Cart — AgriMart</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300;500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/style.css"></head><body data-page="cart"><div id="site-header"></div><main><div class="container"><div class="breadcrumb"><a href="index.html">Home</a><span class="sep">/</span><span class="cur">Shopping Cart</span></div><h2 style="font-size:26px;margin-bottom:20px;" id="cartHeading">Shopping Cart</h2><div id="cartRoot"></div></div></main><div id="site-footer"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/data.js"></script><script src="assets/supabase-client.js"></script><script src="assets/catalog-v2.js"></script><script src="assets/common.js"></script><script>async function initPage(){await AgriCatalog.ready;renderCart();}function onCartChanged(){renderCart();}function renderCart(){const cart=state.cart,items=Object.keys(cart);document.getElementById('cartHeading').textContent='Shopping Cart'+(items.length?` (${items.length} items)`:'' );const t=cartTotals(),root=document.getElementById('cartRoot');if(!items.length){root.innerHTML='<div class="empty-state"><div class="ic">🛒</div><h3>Your cart is empty</h3><p>Looks like you have not added anything yet.</p><a href="shop.html" class="btn btn-primary" style="margin-top:16px;">Continue Shopping</a></div>';return;}root.innerHTML=`<div class="cart-layout"><div>${items.map(id=>{const p=byId(id);if(!p)return '';const qty=cart[id];return `<div class="cart-item"><img src="${p.img}" alt="${p.name}"><div class="ci-info"><div class="ci-name">${p.name}</div><div class="ci-seller">Sold by ${p.sellerName||sellerName(p.seller)}</div><div class="ci-row"><div class="qty-selector"><button onclick="setCartQty('${id}',${qty-1})">−</button><span>${qty}</span><button onclick="setCartQty('${id}',${qty+1})">+</button></div><div style="display:flex;gap:14px;align-items:center;"><span class="ci-price">${fmt(p.price*qty)}</span><button class="btn btn-ghost btn-sm" onclick="removeFromCart('${id}')">Remove</button></div></div></div></div>`;}).join('')}<a href="shop.html" class="link-more" style="margin-top:10px;display:inline-flex;">← Continue Shopping</a></div><div class="summary-box"><h3 style="font-size:16px;margin-bottom:14px;">Order Summary</h3><div class="summary-row"><span>Subtotal (MRP)</span><span>${fmt(t.mrpTotal)}</span></div><div class="summary-row"><span>Product Discount</span><span style="color:var(--success)">−${fmt(t.productDiscount)}</span></div><div class="coupon-row"><input type="text" id="couponInput" placeholder="Enter coupon code" value="${t.couponCode||''}"><button class="btn btn-outline btn-sm" onclick="applyCoupon()">Apply</button></div>${t.couponCode?`<div class="summary-row"><span>Coupon (${t.couponCode})</span><span style="color:var(--success)">−${fmt(t.couponDiscount)}</span></div>`:''}<div class="summary-row"><span>Delivery Charges</span><span>${t.delivery===0?'FREE':fmt(t.delivery)}</span></div><div class="summary-row"><span>Taxes (GST)</span><span>${fmt(t.tax)}</span></div><div class="summary-row total"><span>Total</span><span>${fmt(t.total)}</span></div><a href="checkout.html" class="btn btn-primary btn-block" style="margin-top:16px;">Proceed to Checkout</a></div></div>`;}function applyCoupon(){const code=document.getElementById('couponInput').value.trim().toUpperCase();if(!code){sessionStorage.removeItem('agrimart_coupon');renderCart();return;}if(!COUPONS[code]){toast('Invalid coupon code.','error');return;}const t0=cartTotals();if(t0.subtotal<COUPONS[code].min){toast(`Minimum order of ${fmt(COUPONS[code].min)} required for this coupon.`,'error');return;}sessionStorage.setItem('agrimart_coupon',code);toast('Coupon applied: '+COUPONS[code].label);renderCart();}</script></body></html>
