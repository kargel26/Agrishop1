<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller Login — AgriMart</title><link rel="stylesheet" href="assets/style.css"></head><body data-page="account"><div id="site-header"></div><main><div class="container"><div class="auth-wrap"><h2>Seller Login</h2><p class="muted" style="margin:8px 0 22px">Sign in to your seller account.</p><div class="form-field full"><label>Email</label><input id="email" type="email" autocomplete="email"></div><div class="form-field full" style="margin-top:12px"><label>Password</label><input id="pass" type="password" autocomplete="current-password"></div><button class="btn btn-primary btn-block" style="margin-top:18px" onclick="login()" id="btn">Seller Login</button><p id="msg" class="muted center" style="margin-top:14px"></p><p class="center" style="margin-top:18px;font-size:13px">Want to sell? <a href="seller-verification.html">Apply for Seller Verification</a></p></div></div></main><div id="site-footer"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/data.js"></script><script src="assets/common.js"></script><script src="assets/supabase-client.js"></script><script src="assets/auth.js"></script><script>async function initPage(){const u=await AgriAuth.getCurrentUser();if(u){const p=await AgriAuth.getProfile(u.id);if(p?.role==='seller')location.replace('seller.html');}}async function login(){const msg=document.getElementById('msg'),btn=document.getElementById('btn');btn.disabled=true;msg.textContent='';try{const r=await AgriAuth.signIn(document.getElementById('email').value,document.getElementById('pass').value);const p=await AgriAuth.getProfile(r.user.id);if(p?.role!=='seller'){await AgriAuth.signOut();throw new Error('This account is not a seller account. Use Customer Login or complete Seller Verification.');}const {data:seller}=await agriSupabase.from('sellers').select('id,status,verified').eq('user_id',r.user.id).maybeSingle();if(!seller)throw new Error('Seller profile not found.');if(seller.status!=='approved'||seller.verified!==true)throw new Error('Seller verification is pending.');location.replace('seller.html');}catch(e){msg.textContent=e.message||'Seller login failed.';btn.disabled=false;}}</script></body></html>
