<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller Sign In — AgriMart</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/style.css"><style>body.seller-auth{background:linear-gradient(135deg,#eef8f0,#f8fbf7 55%,#e6f3e8);font-family:'DM Sans',sans-serif}.seller-auth .auth-wrap{max-width:430px;margin:70px auto;padding:34px;border:1px solid #cfe3d2;border-radius:22px;background:#fff;box-shadow:0 18px 50px rgba(32,88,45,.1)}.seller-badge{display:inline-flex;padding:7px 12px;border-radius:999px;background:#e4f5e7;color:#236b32;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}.seller-auth h2{font-size:30px;margin:16px 0 7px}.seller-sub{color:#5f7062;font-size:13px;margin-bottom:24px}.seller-auth input{border-color:#cfe3d2}.seller-auth .btn-primary{background:#287a38;border-color:#287a38}.seller-links{display:flex;justify-content:space-between;gap:12px;margin-top:20px;font-size:12px}.seller-links a{color:#287a38;text-decoration:none;font-weight:600}.seller-mark{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:#287a38;color:#fff;font-size:23px;font-weight:700;margin-bottom:14px}</style></head><body class="seller-auth" data-page="account"><div id="site-header"></div><main><div class="container"><div class="auth-wrap"><div class="seller-mark">S</div><span class="seller-badge">Seller Portal</span><h2>Seller Sign In</h2><p class="seller-sub">Access your products, inventory, orders and seller dashboard.</p><div class="form-field full" style="margin-bottom:13px"><label>Email</label><input id="email" type="email" autocomplete="email" placeholder="seller@example.com"></div><div class="form-field full" style="margin-bottom:18px"><label>Password</label><input id="pass" type="password" autocomplete="current-password" placeholder="Your password"></div><button class="btn btn-primary btn-block" id="btn" onclick="login()">Sign In as Seller</button><p id="msg" class="muted center" style="font-size:12px;margin-top:14px"></p><div class="seller-links"><a href="login.html">Customer Sign In</a><a href="/admin">Admin Sign In</a></div></div></div></main><div id="site-footer"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/data.js"></script><script src="assets/common.js"></script><script src="assets/supabase-client.js"></script><script src="assets/auth.js"></script><script>async function initPage(){const u=await AgriAuth.getCurrentUser();if(u){const p=await AgriAuth.getProfile(u.id);if(p?.role==='seller')location.replace('/seller/dashboard');}}async function login(){const msg=document.getElementById('msg'),btn=document.getElementById('btn');const email=document.getElementById('email').value.trim(),pass=document.getElementById('pass').value;if(!email||!pass){msg.textContent='Please enter seller email and password.';return}btn.disabled=true;btn.textContent='Signing in…';msg.textContent='';try{const r=await AgriAuth.signIn(email,pass);const p=await AgriAuth.getProfile(r.user.id);if(p?.role!=='seller'){await AgriAuth.signOut();throw new Error('This account is not a seller account. Use Customer Sign In or complete Seller Verification.')}const {data:seller}=await agriSupabase.from('sellers').select('id,status,verified').eq('user_id',r.user.id).maybeSingle();if(!seller)throw new Error('Seller profile not found.');if(seller.status!=='approved'||seller.verified!==true)throw new Error('Seller verification is pending.');toast('Seller signed in successfully');location.replace('/seller/dashboard')}catch(e){msg.textContent=e.message||'Seller login failed.'}finally{btn.disabled=false;btn.textContent='Sign In as Seller'}}</script></body></html>
