<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Admin Dashboard — AgriMart</title>
  <link rel="stylesheet" href="/assets/style.css">
  <style>
    .admin-hero{background:linear-gradient(135deg,#173B2B,#2C5F45);color:#fff;border-radius:18px;padding:26px 28px;margin-bottom:22px;box-shadow:var(--shadow-lg)}
    .admin-hero h1{color:#fff;font-size:32px;margin-bottom:6px}.admin-hero p{color:#dce9df;font-size:14px}
    .dash-layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:22px;align-items:start}
    .dash-side{position:sticky;top:92px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:var(--shadow)}
    .dash-side a{display:flex;align-items:center;padding:11px 13px;border-radius:9px;color:var(--ink-soft);font-size:14px;font-weight:600;margin:2px 0}.dash-side a:hover{background:var(--bg-alt);color:var(--primary)}.dash-side a.active{background:var(--primary);color:#fff}
    .admin-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}.admin-toolbar h2{font-size:25px}.admin-toolbar .muted{font-size:13px}
    .stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:20px}.stat-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);min-height:112px}.stat-card .val{font-family:var(--font-display);font-size:27px;font-weight:700;color:var(--primary);margin-bottom:4px;overflow-wrap:anywhere}.stat-card .lbl{font-size:12.5px;color:var(--ink-soft);font-weight:600}
    .panel-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);overflow:auto}.panel-card h3{font-size:21px;margin-bottom:14px}
    .data-table{width:100%;border-collapse:collapse;font-size:13px;min-width:650px}.data-table th{background:var(--bg-alt);color:var(--primary);font-weight:700;text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap}.data-table td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}.data-table tr:last-child td{border-bottom:0}.data-table tr:hover td{background:#fbfcf9}.data-table select{border:1px solid var(--line);border-radius:7px;padding:7px 8px;background:#fff;font:inherit;color:var(--ink)}
    .status-chip{display:inline-flex;align-items:center;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;background:var(--bg-alt);color:var(--ink-soft);text-transform:capitalize;white-space:nowrap}.chip-approved,.chip-active,.chip-paid,.chip-delivered,.chip-confirmed{background:#e5f3e9;color:#21663c}.chip-pending,.chip-processing,.chip-shipped{background:#fff3d7;color:#805d13}.chip-rejected,.chip-cancelled,.chip-refunded,.chip-inactive{background:#fbe8e5;color:#96372e}
    .admin-loading{display:flex;align-items:center;gap:10px;padding:28px;color:var(--ink-soft)}.admin-loading:before{content:'';width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:adminspin .8s linear infinite}@keyframes adminspin{to{transform:rotate(360deg)}}.admin-error{background:#fff4f2;border:1px solid #efc7c2;color:#8e2e26;border-radius:12px;padding:16px}.admin-empty{padding:24px;text-align:center;color:var(--ink-soft)}
    .hero-editor{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);gap:22px}.hero-form{display:grid;gap:13px}.hero-field{display:grid;gap:6px}.hero-field label{font-size:12px;font-weight:700;color:var(--primary)}.hero-field input,.hero-field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 11px;background:#fff;font:inherit;color:var(--ink)}.hero-field textarea{min-height:86px;resize:vertical}.hero-field small{font-size:11px;color:var(--ink-soft)}.hero-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hero-check{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}.hero-check input{width:16px;height:16px}.stat-editor{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:9px;background:var(--bg-alt)}.stat-editor-row{display:grid;grid-template-columns:90px 1fr 1.5fr auto;gap:8px;align-items:center}.stat-editor-row input{min-width:0;border:1px solid var(--line);border-radius:7px;padding:8px;background:#fff;font:inherit}.hero-preview{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#123b2a;position:sticky;top:92px}.hero-preview-img{height:230px;background-size:cover;background-position:center}.hero-preview-body{padding:18px;color:#fff}.hero-preview .preview-eyebrow{display:inline-block;border:1px solid #9a8b3d;border-radius:999px;padding:5px 9px;font-size:10px;font-weight:700;text-transform:uppercase}.hero-preview h4{font-family:var(--font-display);font-size:28px;line-height:1.05;margin:14px 0 8px;color:#fff}.hero-preview h4 em{color:#ead79d;font-style:normal}.hero-preview p{font-size:12px;color:#e1eee6}.preview-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}.preview-stat b{display:block;font-family:var(--font-display);font-size:18px;color:#ead79d}.preview-stat span{font-size:10px;color:#c9d9cf}.save-row{display:flex;justify-content:flex-end;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}.save-status{font-size:12px;color:var(--ink-soft);margin-right:auto}
    @media(max-width:900px){.dash-layout{grid-template-columns:1fr}.dash-side{position:static;display:flex;gap:6px;overflow-x:auto}.dash-side a{flex-shrink:0}.stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero-editor{grid-template-columns:1fr}.hero-preview{position:static}}
    @media(max-width:560px){.stat-grid{grid-template-columns:1fr 1fr;gap:10px}.stat-card{padding:14px}.stat-card .val{font-size:22px}.panel-card{padding:14px}.admin-hero{padding:20px}.admin-hero h1{font-size:26px}.hero-grid-2{grid-template-columns:1fr}.stat-editor-row{grid-template-columns:1fr 1fr}.stat-editor-row input:nth-child(2){grid-column:1/2}.stat-editor-row input:nth-child(3){grid-column:2/3}.stat-editor-row button{grid-column:1/3}}
  </style>
</head>
<body data-page="admin">
  <div id="site-header"></div>
  <main><div class="container">
    <div class="breadcrumb"><a href="/index.html">Home</a><span class="sep">/</span><span class="cur">Admin Dashboard</span></div>
    <section class="admin-hero"><h1>Admin Control Center</h1><p>Manage users, sellers, products, homepage content, orders, payments and marketplace operations from one secure dashboard.</p></section>
    <div class="dash-layout"><aside class="dash-side" id="adminMenu" aria-label="Admin navigation"></aside><div id="adminContent"><div class="panel-card"><div class="admin-loading">Loading admin dashboard…</div></div></div></div>
  </div></main><div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/assets/data.js"></script><script src="/assets/supabase-client.js"></script><script src="/assets/auth.js"></script><script src="/assets/common.js"></script>
  <script>
    const ADMIN_MENU=['Dashboard','Homepage','Users','Sellers','Products','Categories','Orders','Payments','Refunds','Coupons','Reviews','Banners','Reports','Settings'];
    let adminTab='dashboard',db={profiles:[],sellers:[],products:[],categories:[],orders:[],payments:[],reviews:[],applications:[],homepage:null};
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const money=v=>'₹'+Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:2});
    const date=v=>v?new Date(v).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}):'—';
    const chip=v=>`<span class="status-chip chip-${String(v||'').toLowerCase().replace(/\s+/g,'-')}">${esc(v||'—')}</span>`;
    const DEFAULT_HERO={is_active:true,eyebrow:"🌾 INDIA'S TRUSTED AGRI MARKETPLACE",title_before:'Everything You Need for',title_emphasis:'Better Farming',description:'Buy quality seeds, fertilizers, tools and machinery from verified sellers at competitive prices — delivered straight to your farm gate.',primary_button_label:'Shop Now',primary_button_link:'shop.html',secondary_button_label:'🌱 Become a Seller',secondary_button_link:'seller-verification.html',secondary_button_visible:true,stats:[{value:'12,000+',label:'Products Listed'},{value:'40,000+',label:'Happy Farmers'},{value:'500+',label:'Verified Sellers'},{value:'4.7★',label:'Average Rating'}],hero_image_url:'https://images.unsplash.com/photo-1500937386664-56d1dfef3854?q=80&w=1200&auto=format&fit=crop',hero_image_alt:'Farmer in green field at sunrise',overlay_visible:true,overlay_title:'Order confirmed',overlay_text:'Rice Seeds • Delivering to Patna, Bihar'};
    async function initPage(){const access=await AgriAuth.requireRole(['admin']);if(!access)return;try{await loadAdminData();}catch(e){document.getElementById('adminContent').innerHTML=`<div class="admin-error">Unable to load admin data: ${esc(e.message||e)}</div>`;return;}renderAdminMenu();renderAdminContent();}
    function renderAdminMenu(){document.getElementById('adminMenu').innerHTML=ADMIN_MENU.map(m=>`<a href="#" data-tab="${m.toLowerCase()}" class="${adminTab===m.toLowerCase()?'active':''}" onclick="setAdminTab('${m.toLowerCase()}');return false;">${m}</a>`).join('');}
    async function loadAdminData(){const s=window.agriSupabase;const results=await Promise.all([
      s.from('profiles').select('id,full_name,phone,role,created_at').order('created_at',{ascending:false}),
      s.from('sellers').select('id,user_id,business_name,location,rating,verified,status,created_at').order('created_at',{ascending:false}),
      s.from('products').select('id,seller_id,category_id,name,brand,price,mrp,stock,rating,review_count,is_active,created_at').order('created_at',{ascending:false}),
      s.from('categories').select('id,slug,name,icon,product_count,is_active').order('name'),
      s.from('orders').select('id,order_number,user_id,address_id,status,subtotal,discount,delivery_fee,tax,total,created_at,updated_at').order('created_at',{ascending:false}),
      s.from('payments').select('id,order_id,user_id,provider,razorpay_order_id,razorpay_payment_id,amount,status,method,paid_at,created_at').order('created_at',{ascending:false}),
      s.from('reviews').select('id,product_id,user_id,order_id,rating,review_text,is_approved,created_at').order('created_at',{ascending:false}),
      s.from('seller_applications').select('id,user_id,business_name,phone,address,status,created_at,reviewed_at').order('created_at',{ascending:false}),
      s.from('homepage_hero_settings').select('*').eq('id',1).maybeSingle()
    ]);const names=['profiles','sellers','products','categories','orders','payments','reviews','applications','homepage'];results.forEach((r,i)=>{if(r.error)throw r.error;db[names[i]]=r.data||null;});if(!db.homepage)db.homepage={...DEFAULT_HERO};}
    function setAdminTab(t){adminTab=t;document.querySelectorAll('#adminMenu a').forEach(a=>a.classList.toggle('active',a.dataset.tab===t));renderAdminContent();}
    function renderAdminContent(){document.getElementById('adminContent').innerHTML=adminContent();}
    function panel(title,body){return `<div class="panel-card"><h3>${title}</h3>${body||'<div class="admin-empty">No records found.</div>'}</div>`;}
    function adminContent(){
      if(adminTab==='homepage')return homepagePanel();
      if(adminTab==='users')return panel('Users',`<table class="data-table"><tr><th>Name</th><th>Phone</th><th>Role</th><th>Joined</th></tr>${db.profiles.map(p=>`<tr><td>${esc(p.full_name||'—')}</td><td>${esc(p.phone||'—')}</td><td>${chip(p.role)}</td><td>${date(p.created_at)}</td></tr>`).join('')}</table>`);
      if(adminTab==='sellers')return sellerPanel();
      if(adminTab==='products')return panel('Products',`<table class="data-table"><tr><th>Product</th><th>Brand</th><th>Price</th><th>Stock</th><th>Status</th></tr>${db.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.brand||'—')}</td><td>${money(p.price)}</td><td>${p.stock}</td><td>${chip(p.is_active?'active':'inactive')}</td></tr>`).join('')}</table>`);
      if(adminTab==='categories')return panel('Categories',`<table class="data-table"><tr><th>Category</th><th>Products</th><th>Status</th></tr>${db.categories.map(c=>`<tr><td>${esc(c.icon||'')} ${esc(c.name)}</td><td>${c.product_count||0}</td><td>${chip(c.is_active?'active':'inactive')}</td></tr>`).join('')}</table>`);
      if(['orders','payments','refunds'].includes(adminTab))return orderPanel();
      if(adminTab==='reviews')return panel('Reviews',`<table class="data-table"><tr><th>Rating</th><th>Review</th><th>Approved</th><th>Date</th></tr>${db.reviews.map(r=>`<tr><td>${r.rating} ★</td><td>${esc(r.review_text||'')}</td><td>${chip(r.is_approved?'approved':'pending')}</td><td>${date(r.created_at)}</td></tr>`).join('')}</table>`);
      if(adminTab==='coupons')return panel('Coupons','<div class="admin-empty">Coupons are managed in Supabase. No placeholder data is shown.</div>');
      if(adminTab==='banners')return panel('Homepage Banners','<div class="admin-empty">Use the Homepage tab for the live hero shown in the homepage screenshot.</div>');
      if(adminTab==='reports')return panel('Reports','<div class="admin-empty">Reports use current database records only.</div>');
      if(adminTab==='settings')return panel('Settings','<div class="admin-empty">Admin authentication is enforced through the Supabase profile role.</div>');
      const revenue=db.orders.reduce((a,o)=>a+Number(o.total||0),0),pending=db.orders.filter(o=>!['delivered','cancelled','refunded'].includes(o.status)).length,paid=db.payments.filter(p=>p.status==='paid').length,low=db.products.filter(p=>p.is_active&&Number(p.stock)<15).length;
      return `<div class="stat-grid"><div class="stat-card"><div class="val">${db.profiles.length}</div><div class="lbl">Real Users</div></div><div class="stat-card"><div class="val">${db.sellers.length}</div><div class="lbl">Real Sellers</div></div><div class="stat-card"><div class="val">${db.products.length}</div><div class="lbl">Real Products</div></div><div class="stat-card"><div class="val">${db.orders.length}</div><div class="lbl">Real Orders</div></div><div class="stat-card"><div class="val">${paid}</div><div class="lbl">Paid Payments</div></div><div class="stat-card"><div class="val">${money(revenue)}</div><div class="lbl">Order Revenue</div></div><div class="stat-card"><div class="val">${pending}</div><div class="lbl">Pending Orders</div></div><div class="stat-card"><div class="val">${low}</div><div class="lbl">Low Stock (&lt;15)</div></div></div>${panel('Recent Orders',recentOrders())}`;
    }
    function homepagePanel(){const h={...DEFAULT_HERO,...(db.homepage||{})};const stats=Array.isArray(h.stats)&&h.stats.length?h.stats:DEFAULT_HERO.stats;return `<div class="panel-card"><div class="admin-toolbar"><div><h2>Homepage Hero Control</h2><div class="muted">This controls every visible element in the hero structure from the supplied homepage screenshot.</div></div>${chip(h.is_active?'published':'hidden')}</div><div class="hero-editor"><div><div class="hero-form">
      <div class="hero-field"><label>Publish hero</label><label class="hero-check"><input id="hero_active" type="checkbox" ${h.is_active!==false?'checked':''}> Show this hero section on homepage</label></div>
      <div class="hero-field"><label>Eyebrow / badge text</label><input id="hero_eyebrow" value="${esc(h.eyebrow)}"></div>
      <div class="hero-grid-2"><div class="hero-field"><label>Heading — first part</label><input id="hero_title_before" value="${esc(h.title_before)}"></div><div class="hero-field"><label>Heading — highlighted part</label><input id="hero_title_emphasis" value="${esc(h.title_emphasis)}"></div></div>
      <div class="hero-field"><label>Description</label><textarea id="hero_description">${esc(h.description)}</textarea></div>
      <div class="hero-grid-2"><div class="hero-field"><label>Primary button label</label><input id="hero_primary_label" value="${esc(h.primary_button_label)}"></div><div class="hero-field"><label>Primary button link</label><input id="hero_primary_link" value="${esc(h.primary_button_link)}"></div></div>
      <div class="hero-grid-2"><div class="hero-field"><label>Secondary button label</label><input id="hero_secondary_label" value="${esc(h.secondary_button_label)}"></div><div class="hero-field"><label>Secondary button link</label><input id="hero_secondary_link" value="${esc(h.secondary_button_link)}"></div></div>
      <label class="hero-check"><input id="hero_secondary_visible" type="checkbox" ${h.secondary_button_visible!==false?'checked':''}> Show “Become a Seller” button</label>
      <div class="hero-field"><label>Hero image URL</label><input id="hero_image_url" value="${esc(h.hero_image_url)}"><small>Paste a public HTTPS image URL. The homepage uses this image immediately after publishing.</small></div>
      <div class="hero-field"><label>Hero image alt text</label><input id="hero_image_alt" value="${esc(h.hero_image_alt)}"></div>
      <div class="hero-field"><label>Statistics (up to 6)</label><div class="stat-editor" id="hero_stats_editor">${stats.slice(0,6).map((x,i)=>`<div class="stat-editor-row"><strong>${i+1}</strong><input class="stat-value" value="${esc(x.value||'')}" placeholder="12,000+"><input class="stat-label" value="${esc(x.label||'')}" placeholder="Products Listed"><button type="button" class="btn" onclick="this.parentElement.remove()">Remove</button></div>`).join('')}</div><button type="button" class="btn" style="margin-top:8px" onclick="addHeroStat()">+ Add statistic</button></div>
      <div class="hero-field"><label>Floating order card</label><label class="hero-check"><input id="hero_overlay_visible" type="checkbox" ${h.overlay_visible!==false?'checked':''}> Show order-confirmed overlay card</label></div>
      <div class="hero-grid-2"><div class="hero-field"><label>Overlay title</label><input id="hero_overlay_title" value="${esc(h.overlay_title)}"></div><div class="hero-field"><label>Overlay text</label><input id="hero_overlay_text" value="${esc(h.overlay_text)}"></div></div>
    </div><div class="save-row"><span class="save-status" id="hero_save_status"></span><button type="button" class="btn" onclick="resetHeroForm()">Reset Defaults</button><button type="button" class="btn btn-primary" onclick="saveHomepageHero()">Save & Publish</button></div></div>
    <div class="hero-preview" id="heroPreview"><div class="hero-preview-img"></div><div class="hero-preview-body"><span class="preview-eyebrow">${esc(h.eyebrow)}</span><h4>${esc(h.title_before)} <em>${esc(h.title_emphasis)}</em></h4><p>${esc(h.description)}</p><div class="preview-stats">${stats.slice(0,4).map(x=>`<div class="preview-stat"><b>${esc(x.value)}</b><span>${esc(x.label)}</span></div>`).join('')}</div></div></div></div></div>`;}
    function addHeroStat(){const box=document.getElementById('hero_stats_editor');if(!box||box.children.length>=6)return;const i=box.children.length+1;box.insertAdjacentHTML('beforeend',`<div class="stat-editor-row"><strong>${i}</strong><input class="stat-value" placeholder="Value"><input class="stat-label" placeholder="Label"><button type="button" class="btn" onclick="this.parentElement.remove()">Remove</button></div>`);}
    function resetHeroForm(){const h=DEFAULT_HERO;document.getElementById('hero_active').checked=true;document.getElementById('hero_eyebrow').value=h.eyebrow;document.getElementById('hero_title_before').value=h.title_before;document.getElementById('hero_title_emphasis').value=h.title_emphasis;document.getElementById('hero_description').value=h.description;document.getElementById('hero_primary_label').value=h.primary_button_label;document.getElementById('hero_primary_link').value=h.primary_button_link;document.getElementById('hero_secondary_label').value=h.secondary_button_label;document.getElementById('hero_secondary_link').value=h.secondary_button_link;document.getElementById('hero_secondary_visible').checked=true;document.getElementById('hero_image_url').value=h.hero_image_url;document.getElementById('hero_image_alt').value=h.hero_image_alt;document.getElementById('hero_overlay_visible').checked=true;document.getElementById('hero_overlay_title').value=h.overlay_title;document.getElementById('hero_overlay_text').value=h.overlay_text;document.getElementById('hero_stats_editor').innerHTML=h.stats.map((x,i)=>`<div class="stat-editor-row"><strong>${i+1}</strong><input class="stat-value" value="${esc(x.value)}"><input class="stat-label" value="${esc(x.label)}"><button type="button" class="btn" onclick="this.parentElement.remove()">Remove</button></div>`).join('');document.getElementById('hero_save_status').textContent='Defaults loaded in form; click Save & Publish to apply.';}
    async function saveHomepageHero(){const status=document.getElementById('hero_save_status');const stats=[...document.querySelectorAll('#hero_stats_editor .stat-editor-row')].map(r=>({value:r.querySelector('.stat-value')?.value.trim()||'',label:r.querySelector('.stat-label')?.value.trim()||''})).filter(x=>x.value||x.label).slice(0,6);const payload={id:1,is_active:document.getElementById('hero_active').checked,eyebrow:document.getElementById('hero_eyebrow').value.trim(),title_before:document.getElementById('hero_title_before').value.trim(),title_emphasis:document.getElementById('hero_title_emphasis').value.trim(),description:document.getElementById('hero_description').value.trim(),primary_button_label:document.getElementById('hero_primary_label').value.trim(),primary_button_link:document.getElementById('hero_primary_link').value.trim(),secondary_button_label:document.getElementById('hero_secondary_label').value.trim(),secondary_button_link:document.getElementById('hero_secondary_link').value.trim(),secondary_button_visible:document.getElementById('hero_secondary_visible').checked,stats:stats.length?stats:DEFAULT_HERO.stats,hero_image_url:document.getElementById('hero_image_url').value.trim(),hero_image_alt:document.getElementById('hero_image_alt').value.trim(),overlay_visible:document.getElementById('hero_overlay_visible').checked,overlay_title:document.getElementById('hero_overlay_title').value.trim(),overlay_text:document.getElementById('hero_overlay_text').value.trim(),updated_at:new Date().toISOString()};if(!payload.eyebrow||!payload.title_before||!payload.title_emphasis||!payload.description||!payload.hero_image_url){status.textContent='Please fill all required hero fields.';return;}status.textContent='Saving…';try{const {error}=await window.agriSupabase.from('homepage_hero_settings').upsert(payload,{onConflict:'id'});if(error)throw error;db.homepage=payload;status.textContent='Saved and published. Open the homepage to see the changes.';setTimeout(()=>status.textContent='',5000);}catch(e){status.textContent='Save failed: '+(e.message||e);}}
    function sellerPanel(){const apps=db.applications;const sellers=db.sellers;return panel('Seller Verification',`<h4 style="margin:18px 0 10px">Applications (${apps.filter(a=>a.status==='pending').length} pending)</h4><table class="data-table"><tr><th>Business</th><th>Phone</th><th>Address</th><th>Status</th><th>Submitted</th><th>Action</th></tr>${apps.map(a=>`<tr><td>${esc(a.business_name)}</td><td>${esc(a.phone||'—')}</td><td>${esc(a.address||'—')}</td><td>${chip(a.status)}</td><td>${date(a.created_at)}</td><td>${a.status==='pending'?`<button class="btn btn-primary" onclick="approveSeller('${a.id}')">Approve</button> <button class="btn" onclick="rejectSeller('${a.id}')">Reject</button>`:'—'}</td></tr>`).join('')}</table><h4 style="margin:28px 0 10px">Approved / Existing Sellers</h4><table class="data-table"><tr><th>Business</th><th>Location</th><th>Rating</th><th>Status</th></tr>${sellers.map(s=>`<tr><td>${esc(s.business_name)}</td><td>${esc(s.location||'—')}</td><td>${esc(s.rating||0)} ★</td><td>${chip(s.status)}</td></tr>`).join('')}</table>`);}
    async function approveSeller(id){if(!confirm('Approve this seller application?'))return;try{const s=window.agriSupabase;const {data:app,error:e}=await s.from('seller_applications').select('id,user_id,business_name,phone,address,status').eq('id',id).maybeSingle();if(e)throw e;if(!app||app.status!=='pending')throw new Error('Application is no longer pending.');const {error:e1}=await s.from('seller_applications').update({status:'approved',reviewed_by:(await AgriAuth.getCurrentUser()).id,reviewed_at:new Date().toISOString()}).eq('id',id);if(e1)throw e1;const {error:e2}=await s.from('profiles').update({role:'seller',updated_at:new Date().toISOString()}).eq('id',app.user_id);if(e2)throw e2;const {data:existing}=await s.from('sellers').select('id').eq('user_id',app.user_id).maybeSingle();if(existing){const {error:e3}=await s.from('sellers').update({business_name:app.business_name,location:app.address,verified:true,status:'approved'}).eq('id',existing.id);if(e3)throw e3;}else{const {error:e4}=await s.from('sellers').insert({user_id:app.user_id,business_name:app.business_name,location:app.address,verified:true,status:'approved'});if(e4)throw e4;}alert('Seller approved successfully.');await loadAdminData();renderAdminContent();}catch(e){alert(e.message||'Unable to approve seller.');}}
    async function rejectSeller(id){if(!confirm('Reject this seller application?'))return;try{const {error}=await window.agriSupabase.from('seller_applications').update({status:'rejected',reviewed_by:(await AgriAuth.getCurrentUser()).id,reviewed_at:new Date().toISOString()}).eq('id',id);if(error)throw error;await loadAdminData();renderAdminContent();}catch(e){alert(e.message||'Unable to reject application.');}}
    function recentOrders(){return `<table class="data-table"><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th><th>Created</th></tr>${db.orders.slice(0,10).map(o=>`<tr><td>${esc(o.order_number||o.id.slice(0,8))}</td><td>${esc((db.profiles.find(p=>p.id===o.user_id)||{}).full_name||'Customer')}</td><td>${money(o.total)}</td><td>${chip(o.status)}</td><td>${date(o.created_at)}</td></tr>`).join('')}</table>`;}
    function orderPanel(){if(adminTab==='payments'||adminTab==='refunds'){const rows=adminTab==='refunds'?db.payments.filter(p=>p.status==='refunded'):db.payments;return panel(adminTab==='refunds'?'Refunded Payments':'Payments',`<table class="data-table"><tr><th>Order</th><th>Amount</th><th>Method</th><th>Razorpay</th><th>Status</th><th>Date</th></tr>${rows.map(p=>`<tr><td>${esc((db.orders.find(o=>o.id===p.order_id)||{}).order_number||'—')}</td><td>${money(p.amount)}</td><td>${esc(p.method||p.provider||'—')}</td><td>${esc(p.razorpay_payment_id||p.razorpay_order_id||'—')}</td><td>${chip(p.status)}</td><td>${date(p.paid_at||p.created_at)}</td></tr>`).join('')}</table>`);}return panel('Orders',`<table class="data-table"><tr><th>Order</th><th>Customer</th><th>Total</th><th>Payment</th><th>Status</th><th>Update</th></tr>${db.orders.map(o=>{const pay=db.payments.find(p=>p.order_id===o.id);return `<tr><td>${esc(o.order_number||o.id.slice(0,8))}<br><small>${date(o.created_at)}</small></td><td>${esc((db.profiles.find(p=>p.id===o.user_id)||{}).full_name||'Customer')}</td><td>${money(o.total)}</td><td>${chip(pay?.status||'—')}</td><td>${chip(o.status)}</td><td><select onchange="updateOrderStatus('${o.id}',this.value)"><option value="">Change…</option>${['pending','confirmed','processing','shipped','delivered','cancelled','refunded'].map(s=>`<option value="${s}">${s}</option>`).join('')}</select></td></tr>`}).join('')}</table>`);}
    async function updateOrderStatus(id,status){if(!status)return;try{const {error}=await window.agriSupabase.from('orders').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(error)throw error;alert('Order status updated.');await loadAdminData();renderAdminContent();}catch(e){alert(e.message||'Unable to update order.');}}
  </script>
</body>
</html>
