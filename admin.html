<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — AgriMart</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="admin">
<div id="site-header"></div>
<main><div class="container"><div class="breadcrumb"><a href="index.html">Home</a><span class="sep">/</span><span class="cur">Admin Dashboard</span></div><div class="dash-layout"><aside class="dash-side" id="adminMenu"></aside><div id="adminContent"><div class="panel-card"><p class="muted">Loading admin dashboard…</p></div></div></div></div></main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/data.js"></script><script src="assets/common.js"></script><script src="assets/supabase-client.js"></script><script src="assets/auth.js"></script>
<script>
const ADMIN_MENU=['Dashboard','Users','Sellers','Products','Categories','Orders','Payments','Refunds','Coupons','Reviews','Banners','Reports','Settings'];
let adminTab='dashboard', db={profiles:[],sellers:[],products:[],categories:[],orders:[],payments:[],reviews:[],applications:[]};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>'₹'+Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const date=v=>v?new Date(v).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}):'—';
const chip=v=>`<span class="status-chip chip-${String(v||'').toLowerCase().replace(/\s+/g,'-')}">${esc(v||'—')}</span>`;
async function initPage(){
  const access=await AgriAuth.requireRole(['admin']); if(!access)return;
  document.getElementById('adminMenu').innerHTML=ADMIN_MENU.map(m=>`<a href="#" data-tab="${m.toLowerCase()}" class="${adminTab===m.toLowerCase()?'active':''}" onclick="setAdminTab('${m.toLowerCase()}');return false;">${m}</a>`).join('');
  await loadAdminData(); renderAdminContent();
}
async function loadAdminData(){
  const s=window.agriSupabase;
  const results=await Promise.all([
    s.from('profiles').select('id,full_name,phone,role,created_at').order('created_at',{ascending:false}),
    s.from('sellers').select('id,user_id,business_name,location,rating,verified,status,created_at').order('created_at',{ascending:false}),
    s.from('products').select('id,seller_id,category_id,name,brand,price,mrp,stock,rating,review_count,is_active,created_at').order('created_at',{ascending:false}),
    s.from('categories').select('id,slug,name,icon,product_count,is_active').order('name'),
    s.from('orders').select('id,order_number,user_id,address_id,status,subtotal,discount,delivery_fee,tax,total,created_at,updated_at').order('created_at',{ascending:false}),
    s.from('payments').select('id,order_id,user_id,provider,razorpay_order_id,razorpay_payment_id,amount,status,method,paid_at,created_at').order('created_at',{ascending:false}),
    s.from('reviews').select('id,product_id,user_id,order_id,rating,review_text,is_approved,created_at').order('created_at',{ascending:false}),
    s.from('seller_applications').select('id,user_id,business_name,phone,address,status,created_at,reviewed_at').order('created_at',{ascending:false})
  ]);
  const names=['profiles','sellers','products','categories','orders','payments','reviews','applications'];
  results.forEach((r,i)=>{if(r.error)throw r.error;db[names[i]]=r.data||[];});
}
function setAdminTab(t){adminTab=t;document.querySelectorAll('#adminMenu a').forEach(a=>a.classList.toggle('active',a.dataset.tab===t));renderAdminContent();}
function renderAdminContent(){document.getElementById('adminContent').innerHTML=adminContent();}
function adminContent(){
  if(adminTab==='users')return panel('Users',`<table class="data-table"><tr><th>Name</th><th>Phone</th><th>Role</th><th>Joined</th></tr>${db.profiles.map(p=>`<tr><td>${esc(p.full_name||'—')}</td><td>${esc(p.phone||'—')}</td><td>${chip(p.role)}</td><td>${date(p.created_at)}</td></tr>`).join('')}</table>`);
  if(adminTab==='sellers')return panel('Sellers',`<table class="data-table"><tr><th>Business</th><th>Location</th><th>Rating</th><th>Status</th></tr>${db.sellers.map(s=>`<tr><td>${esc(s.business_name)}</td><td>${esc(s.location||'—')}</td><td>${esc(s.rating||'—')} ★</td><td>${chip(s.status|| (s.verified?'approved':'pending'))}</td></tr>`).join('')}</table>`);
  if(adminTab==='products')return panel('Products',`<table class="data-table"><tr><th>Product</th><th>Brand</th><th>Price</th><th>Stock</th><th>Status</th></tr>${db.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.brand||'—')}</td><td>${money(p.price)}</td><td>${p.stock}</td><td>${chip(p.is_active?'active':'inactive')}</td></tr>`).join('')}</table>`);
  if(adminTab==='categories')return panel('Categories',`<table class="data-table"><tr><th>Category</th><th>Products</th><th>Status</th></tr>${db.categories.map(c=>`<tr><td>${esc(c.icon||'')} ${esc(c.name)}</td><td>${c.product_count||0}</td><td>${chip(c.is_active?'active':'inactive')}</td></tr>`).join('')}</table>`);
  if(['orders','payments','refunds'].includes(adminTab))return orderPanel();
  if(adminTab==='reviews')return panel('Reviews',`<table class="data-table"><tr><th>Rating</th><th>Review</th><th>Approved</th><th>Date</th></tr>${db.reviews.map(r=>`<tr><td>${r.rating} ★</td><td>${esc(r.review_text||'')}</td><td>${chip(r.is_approved?'approved':'pending')}</td><td>${date(r.created_at)}</td></tr>`).join('')}</table>`);
  if(adminTab==='coupons')return panel('Coupons',`<p class="muted">Coupons are managed in Supabase. This dashboard keeps the coupon section available without duplicating catalog data.</p>`);
  if(adminTab==='banners')return panel('Homepage Banners',`<p class="muted">Banner management remains a presentation feature. No fake analytics are shown here.</p>`);
  if(adminTab==='reports')return panel('Reports',`<p class="muted">Current database totals and revenue are shown on the dashboard. Export functionality can be added without using placeholder figures.</p>`);
  if(adminTab==='settings')return panel('Settings',`<p class="muted">Admin authentication is enforced through the Supabase profile role. Website configuration is not stored as fake local settings.</p>`);
  const revenue=db.orders.reduce((a,o)=>a+Number(o.total||0),0),pending=db.orders.filter(o=>!['delivered','cancelled','refunded'].includes(o.status)).length,paid=db.payments.filter(p=>p.status==='paid').length,low=db.products.filter(p=>p.is_active&&Number(p.stock)<15).length;
  return `<div class="stat-grid"><div class="stat-card"><div class="val">${db.profiles.length}</div><div class="lbl">Real Users</div></div><div class="stat-card"><div class="val">${db.sellers.length}</div><div class="lbl">Real Sellers</div></div><div class="stat-card"><div class="val">${db.products.length}</div><div class="lbl">Real Products</div></div><div class="stat-card"><div class="val">${db.orders.length}</div><div class="lbl">Real Orders</div></div><div class="stat-card"><div class="val">${paid}</div><div class="lbl">Paid Payments</div></div><div class="stat-card"><div class="val">${money(revenue)}</div><div class="lbl">Order Revenue</div></div><div class="stat-card"><div class="val">${pending}</div><div class="lbl">Pending Orders</div></div><div class="stat-card"><div class="val">${low}</div><div class="lbl">Low Stock (&lt;15)</div></div></div>${panel('Recent Orders',recentOrders())}`;
}
function panel(title,body){return `<div class="panel-card"><h3>${title}</h3>${body||'<p class="muted">No records found.</p>'}</div>`}
function recentOrders(){return `<table class="data-table"><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th><th>Created</th></tr>${db.orders.slice(0,10).map(o=>`<tr><td>${esc(o.order_number||o.id.slice(0,8))}</td><td>${esc((db.profiles.find(p=>p.id===o.user_id)||{}).full_name||'Customer')}</td><td>${money(o.total)}</td><td>${chip(o.status)}</td><td>${date(o.created_at)}</td></tr>`).join('')}</table>`}
function orderPanel(){
  if(adminTab==='payments'||adminTab==='refunds'){
    const rows=adminTab==='refunds'?db.payments.filter(p=>p.status==='refunded'):db.payments;
    return panel(adminTab==='refunds'?'Refunded Payments':'Payments',`<table class="data-table"><tr><th>Order</th><th>Amount</th><th>Method</th><th>Razorpay</th><th>Status</th><th>Date</th></tr>${rows.map(p=>`<tr><td>${esc((db.orders.find(o=>o.id===p.order_id)||{}).order_number||'—')}</td><td>${money(p.amount)}</td><td>${esc(p.method||p.provider||'—')}</td><td>${esc(p.razorpay_payment_id||p.razorpay_order_id||'—')}</td><td>${chip(p.status)}</td><td>${date(p.paid_at||p.created_at)}</td></tr>`).join('')}</table>`);
  }
  return panel('Orders',`<table class="data-table"><tr><th>Order</th><th>Customer</th><th>Total</th><th>Payment</th><th>Status</th><th>Update</th></tr>${db.orders.map(o=>{const pay=db.payments.find(p=>p.order_id===o.id);return `<tr><td>${esc(o.order_number||o.id.slice(0,8))}<br><small>${date(o.created_at)}</small></td><td>${esc((db.profiles.find(p=>p.id===o.user_id)||{}).full_name||'Customer')}</td><td>${money(o.total)}</td><td>${chip(pay?.status||'—')}</td><td>${chip(o.status)}</td><td><select onchange="updateOrderStatus('${o.id}',this.value)"><option value="">Change…</option>${['pending','confirmed','processing','shipped','delivered','cancelled','refunded'].map(s=>`<option value="${s}">${s}</option>`).join('')}</select></td></tr>`}).join('')}</table>`);
}
async function updateOrderStatus(id,status){if(!status)return;try{const {error}=await window.agriSupabase.from('orders').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(error)throw error;toast('Order status updated.');await loadAdminData();renderAdminContent();}catch(e){console.error(e);toast(e.message||'Unable to update order.');}}
</script>
</body>
</html>
