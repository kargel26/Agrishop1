<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop All Products — AgriMart</title>
<meta name="description" content="Browse seeds, fertilizers, crop protection, tools, irrigation equipment and more from verified AgriMart sellers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script defer src="assets/speed-insights.js"></script>
</head>
<body data-page="shop">

<div id="site-header"></div>

<main>
  <div class="container">
    <div class="breadcrumb"><a href="index.html">Home</a><span class="sep">/</span><span class="cur">Shop</span></div>
    <div class="flex-between" style="margin-bottom:14px;">
      <h2 style="font-size:26px;">All Products <span class="muted" id="resultCount" style="font-size:14px;font-weight:400;"></span></h2>
      <button class="btn btn-outline btn-sm mobile-filter-btn" onclick="openMobileFilter()">Filters</button>
    </div>
    <div class="shop-layout">
      <div class="filter-overlay" id="filterOverlay" onclick="closeMobileFilter()"></div>
      <aside class="filter-panel" id="filterPanel">
        <h4>Filters <a href="#" class="muted" style="font-size:12px;font-weight:600" onclick="resetFilters();return false;">Clear all</a></h4>
        <div class="filter-group">
          <h4 style="font-size:12px;">Category</h4>
          <div id="catFilters"></div>
        </div>
        <div class="filter-group">
          <h4 style="font-size:12px;">Brand</h4>
          <div id="brandFilters"></div>
        </div>
        <div class="filter-group">
          <h4 style="font-size:12px;">Price Range (₹)</h4>
          <div class="range-inputs">
            <input type="number" id="minPrice" placeholder="Min">
            <span>–</span>
            <input type="number" id="maxPrice" placeholder="Max">
          </div>
        </div>
        <div class="filter-group">
          <h4 style="font-size:12px;">Rating</h4>
          <div id="ratingFilters"></div>
        </div>
        <div class="filter-group">
          <label class="filter-opt"><input type="checkbox" id="inStockOnly"> In stock only</label>
        </div>
      </aside>
      <div>
        <div class="shop-toolbar">
          <span class="muted" style="font-size:13px;" id="toolbarCount"></span>
          <select id="sortSelect">
            <option value="popularity">Sort: Popularity</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="rating">Rating</option>
            <option value="newest">Newest</option>
          </select>
        </div>
        <div class="product-grid" id="productGrid"></div>
        <div id="emptyState"></div>
        <div class="pagination" id="pagination"></div>
      </div>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="assets/data.js"></script>
<script src="assets/common.js"></script>
<script>
const filters = {category:new Set(), brand:new Set(), rating:0, minPrice:'', maxPrice:'', inStockOnly:false, sort:'popularity'};
let page = 1;
const PAGE_SIZE = 8;

function initPage(){
  const initialCat = qs('category');
  if(initialCat) filters.category.add(initialCat);
  const q = qs('q');
  document.getElementById('minPrice').addEventListener('input', e=>{ filters.minPrice = e.target.value; page=1; renderShop(); });
  document.getElementById('maxPrice').addEventListener('input', e=>{ filters.maxPrice = e.target.value; page=1; renderShop(); });
  document.getElementById('inStockOnly').addEventListener('change', e=>{ filters.inStockOnly = e.target.checked; page=1; renderShop(); });
  document.getElementById('sortSelect').addEventListener('change', e=>{ filters.sort = e.target.value; renderShop(); });
  buildFilterOptions();
  renderShop(q);
}

function buildFilterOptions(){
  document.getElementById('catFilters').innerHTML = CATEGORIES.map(c=>`
    <label class="filter-opt"><input type="checkbox" ${filters.category.has(c.id)?'checked':''} onchange="toggleFilter('category','${c.id}')"> ${c.name} <span class="muted">(${PRODUCTS.filter(p=>p.category===c.id).length})</span></label>
  `).join('');
  const brands = [...new Set(PRODUCTS.map(p=>p.brand))];
  document.getElementById('brandFilters').innerHTML = brands.map(b=>`
    <label class="filter-opt"><input type="checkbox" onchange="toggleFilter('brand','${b}')"> ${b}</label>
  `).join('');
  document.getElementById('ratingFilters').innerHTML = [4,3,2].map(r=>`<label class="filter-opt"><input type="radio" name="ratingf" onchange="setRating(${r})"> ${stars(r)} &amp; up</label>`).join('')
    + `<label class="filter-opt"><input type="radio" name="ratingf" checked onchange="setRating(0)"> All ratings</label>`;
}
function toggleFilter(kind, val){ const s = filters[kind]; if(s.has(val)) s.delete(val); else s.add(val); page=1; renderShop(); }
function setRating(r){ filters.rating = r; page=1; renderShop(); }
function resetFilters(){
  filters.category.clear(); filters.brand.clear(); filters.rating=0; filters.minPrice=''; filters.maxPrice=''; filters.inStockOnly=false; filters.sort='popularity';
  page=1;
  document.getElementById('minPrice').value=''; document.getElementById('maxPrice').value=''; document.getElementById('inStockOnly').checked=false;
  document.getElementById('sortSelect').value='popularity';
  buildFilterOptions();
  renderShop('');
}
function filteredProducts(searchQuery){
  let list = [...PRODUCTS];
  if(searchQuery && searchQuery.trim()){
    const q = searchQuery.toLowerCase();
    list = list.filter(p=> p.name.toLowerCase().includes(q) || p.brand.toLowerCase().includes(q) || p.category.toLowerCase().includes(q) || sellerName(p.seller).toLowerCase().includes(q));
  }
  if(filters.category.size) list = list.filter(p=>filters.category.has(p.category));
  if(filters.brand.size) list = list.filter(p=>filters.brand.has(p.brand));
  if(filters.rating) list = list.filter(p=>p.rating >= filters.rating);
  if(filters.minPrice) list = list.filter(p=>p.price >= Number(filters.minPrice));
  if(filters.maxPrice) list = list.filter(p=>p.price <= Number(filters.maxPrice));
  if(filters.inStockOnly) list = list.filter(p=>p.stock>0);
  switch(filters.sort){
    case 'price-asc': list.sort((a,b)=>a.price-b.price); break;
    case 'price-desc': list.sort((a,b)=>b.price-a.price); break;
    case 'rating': list.sort((a,b)=>b.rating-a.rating); break;
    case 'newest': list.sort((a,b)=> PRODUCTS.indexOf(b)-PRODUCTS.indexOf(a)); break;
    default: list.sort((a,b)=>b.reviews-a.reviews);
  }
  return list;
}
function renderShop(searchQuery){
  if(searchQuery===undefined) searchQuery = qs('q') || '';
  const all = filteredProducts(searchQuery);
  const totalPages = Math.max(1, Math.ceil(all.length/PAGE_SIZE));
  if(page>totalPages) page = 1;
  const items = all.slice((page-1)*PAGE_SIZE, page*PAGE_SIZE);
  document.getElementById('resultCount').textContent = `(${all.length} results)`;
  document.getElementById('toolbarCount').textContent = `Showing ${items.length} of ${all.length} products`;
  document.getElementById('productGrid').innerHTML = items.map(productCard).join('');
  document.getElementById('emptyState').innerHTML = items.length ? '' : `
    <div class="empty-state"><div class="ic">🔎</div><h3>No products found</h3><p>Try adjusting your filters or search terms.</p><button class="btn btn-outline" style="margin-top:14px" onclick="resetFilters()">Clear Filters</button></div>`;
  document.getElementById('pagination').innerHTML = totalPages>1 ? Array.from({length:totalPages},(_,i)=>i+1).map(n=>`<button class="${n===page?'active':''}" onclick="page=${n}; renderShop('${searchQuery.replace(/'/g,"\\'")}'); window.scrollTo(0,0);">${n}</button>`).join('') : '';
}
function openMobileFilter(){ document.getElementById('filterPanel').classList.add('open'); document.getElementById('filterOverlay').classList.add('open'); }
function closeMobileFilter(){ document.getElementById('filterPanel').classList.remove('open'); document.getElementById('filterOverlay').classList.remove('open'); }
</script>
</body>
</html>
