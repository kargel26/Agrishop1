<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title id="pageTitle">Product — AgriMart</title><meta name="description" id="pageDesc" content="Product details on AgriMart."><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/style.css"></head>
<body data-page="product"><div id="site-header"></div><main><div class="container" id="productRoot"></div></main><div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/data.js"></script><script src="assets/supabase-client.js"></script><script src="assets/catalog-v2.js"></script><script src="assets/common.js"></script>
<script>
let pdState={qty:1,current:null};
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function reviewStars(n){return '★'.repeat(Number(n)||0)+'☆'.repeat(5-(Number(n)||0));}
function relatedProducts(p){
  const all=(typeof PRODUCTS!=='undefined'?PRODUCTS:[]).filter(x=>x.id!==p.id);
  return all.map(x=>{let score=0;if(x.category&&p.category&&x.category===p.category)score+=100;if(x.brand&&p.brand&&x.brand===p.brand)score+=35;if(x.seller&&p.seller&&x.seller===p.seller)score+=10;const d=Math.abs(Number(x.price||0)-Number(p.price||0));score+=Math.max(0,20-Math.round(d/Math.max(1,Number(p.price||1))*20));if(Number(x.stock)>0)score+=5;return {x,score};}).sort((a,b)=>b.score-a.score).slice(0,4).map(v=>v.x);
}
async function loadLiveReviews(productId){
  const {data,error}=await sb.from('reviews').select('id,rating,review_text,created_at,user_id').eq('product_id',productId).eq('is_approved',true).order('created_at',{ascending:false});
  if(error)return [];
  const ids=[...new Set((data||[]).map(r=>r.user_id).filter(Boolean))];let names={};
  if(ids.length){const {data:profiles}=await sb.from('profiles').select('id,full_name').in('id',ids);(profiles||[]).forEach(x=>names[x.id]=x.full_name||'Verified customer');}
  return (data||[]).map(r=>({...r,name:names[r.user_id]||'Verified customer'}));
}
async function reviewFormHtml(productId){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return '<div class="panel-card" style="margin-top:16px"><b>Want to review this product?</b><p class="muted">Please sign in. Reviews are accepted only from customers who received this product.</p><a class="btn btn-primary" href="login.html?next=product.html%3Fid%3D'+encodeURIComponent(productId)+'">Sign In</a></div>';
  const {data:orders,error}=await sb.from('orders').select('id,order_number,status,created_at,order_items(product_id,product_name)').eq('user_id',session.user.id).eq('status','delivered').order('created_at',{ascending:false});
  if(error)return '<div class="panel-card" style="margin-top:16px"><p class="muted">Unable to load review eligibility right now.</p></div>';
  const eligible=[];(orders||[]).forEach(o=>(o.order_items||[]).filter(i=>i.product_id===productId).forEach(i=>eligible.push({orderId:o.id,orderNumber:o.order_number||o.id,productName:i.product_name})));
  if(!eligible.length)return '<div class="panel-card" style="margin-top:16px"><b>Review after delivery</b><p class="muted">Only customers who have a delivered order containing this product can submit a review.</p></div>';
  const {data:mine}=await sb.from('reviews').select('order_id').eq('product_id',productId).eq('user_id',session.user.id);const used=new Set((mine||[]).map(x=>x.order_id));
  const fresh=eligible.find(x=>!used.has(x.orderId));
  if(!fresh)return '<div class="panel-card" style="margin-top:16px"><b>Review submitted</b><p class="muted">You have already reviewed this product for your delivered orders.</p></div>';
  return `<div class="panel-card" style="margin-top:16px"><h3 style="margin-bottom:8px">Write a Review</h3><p class="muted" style="font-size:12px">Verified purchase · Order ${esc(fresh.orderNumber)}</p><form id="reviewForm"><input type="hidden" name="order_id" value="${esc(fresh.orderId)}"><label style="display:block;font-weight:700;font-size:13px;margin:12px 0 6px">Rating</label><select name="rating" required style="padding:10px;border:1px solid var(--line);border-radius:8px;width:100%"><option value="5">★★★★★ — Excellent</option><option value="4">★★★★☆ — Good</option><option value="3">★★★☆☆ — Average</option><option value="2">★★☆☆☆ — Poor</option><option value="1">★☆☆☆☆ — Very poor</option></select><label style="display:block;font-weight:700;font-size:13px;margin:12px 0 6px">Your review</label><textarea name="review_text" required minlength="5" maxlength="1000" rows="4" placeholder="Share your experience with this product..."></textarea><button class="btn btn-primary" type="submit" style="margin-top:12px">Submit Review</button><span id="reviewMsg" class="muted" style="margin-left:10px"></span></form></div>`;
}
async function renderReviews(productId){
  const panel=document.querySelector('[data-panel="reviews"]');if(!panel)return;
  const reviews=await loadLiveReviews(productId);const form=await reviewFormHtml(productId);
  panel.innerHTML=`<div style="display:grid;gap:14px">${form}<div><h3 style="margin-bottom:12px">Customer Reviews ${reviews.length?`(${reviews.length})`:''}</h3>${reviews.length?`<div class="review-grid">${reviews.map(r=>`<div class="review-card"><div class="stars">${reviewStars(r.rating)}</div><p class="txt">"${esc(r.review_text)}"</p><div class="who"><div class="av">${esc((r.name||'V').charAt(0).toUpperCase())}</div><div><b>${esc(r.name)}</b><span>Verified purchase · ${new Date(r.created_at).toLocaleDateString('en-IN')}</span></div></div></div>`).join('')}</div>`:'<div class="empty-state"><div class="ic">⭐</div><h3>No approved reviews yet</h3><p>Be the first verified customer to review this product.</p></div>'}</div></div>`;
  const f=document.getElementById('reviewForm');if(f)f.addEventListener('submit',async e=>{e.preventDefault();const btn=f.querySelector('button');const msg=document.getElementById('reviewMsg');btn.disabled=true;msg.textContent='Submitting…';const {data:{session}}=await sb.auth.getSession();if(!session){msg.textContent='Please sign in again.';btn.disabled=false;return;}const fd=new FormData(f);const {error}=await sb.from('reviews').insert({product_id:productId,user_id:session.user.id,order_id:fd.get('order_id'),rating:Number(fd.get('rating')),review_text:String(fd.get('review_text')).trim(),is_approved:false});if(error){msg.textContent=error.code==='23505'?'You already reviewed this order.':(error.message||'Could not submit review.');btn.disabled=false;return;}msg.textContent='Submitted for approval.';f.outerHTML='<div class="panel-card" style="margin-top:16px"><b>Review submitted successfully.</b><p class="muted">Your review is pending approval and will appear here once approved.</p></div>';});
}
async function initPage(){await AgriCatalog.ready;const id=qs('id');const p=byId(id);const root=document.getElementById('productRoot');if(!p){root.innerHTML='<div class="empty-state"><div class="ic">🌾</div><h3>Product not found</h3><p>The product you are looking for does not exist.</p><a href="shop.html" class="btn btn-primary" style="margin-top:16px;">Back to Shop</a></div>';return;}pdState.current=p;document.getElementById('pageTitle').textContent=p.name+' — AgriMart';document.getElementById('pageDesc').setAttribute('content',p.desc);const discount=p.mrp>p.price?Math.round((1-p.price/p.mrp)*100):0;const related=relatedProducts(p);root.innerHTML=`<div class="breadcrumb"><a href="index.html">Home</a><span class="sep">/</span><a href="shop.html">Shop</a><span class="sep">/</span><span class="cur">${esc(p.name)}</span></div><div class="pd-layout"><div><div class="pd-gallery-main"><img id="pdMainImg" src="${esc(p.img)}" alt="${esc(p.name)}"></div><div class="pd-thumbs">${[p.img,p.img,p.img].map((im,i)=>`<button class="${i===0?'active':''}" onclick="pdSetImg(this,'${String(im).replace(/'/g,"\\'")}')"><img src="${esc(im)}" alt=""></button>`).join('')}</div></div><div><span class="pd-brand">${esc(p.brand)} · ${esc((p.category||'').replace('-',' '))}</span><h1 class="pd-title">${esc(p.name)}</h1><div class="pd-meta-row"><span class="stars">${stars(p.rating)}</span> <b>${p.rating}</b> (${p.reviews} reviews) · Sold by ${esc(p.sellerName||sellerName(p.seller))}</div><div class="pd-price-row"><span class="now">${fmt(p.price)}</span>${p.mrp>p.price?`<span class="was">${fmt(p.mrp)}</span><span class="disc">${discount}% off</span>`:''}</div><div class="pd-tax">Inclusive of all taxes · Free delivery on orders above ₹999</div><div class="pd-stockline"><span class="dot" style="background:${p.stock>0?'var(--success)':'var(--danger)'}"></span>${p.stock>0?(p.stock<15?`Only ${p.stock} left in stock`:'In Stock'):'Out of Stock'}</div><label style="font-size:12.5px;font-weight:700;color:var(--ink-soft);display:block;margin-bottom:8px;">Quantity</label><div class="qty-selector"><button onclick="pdChangeQty(-1)">−</button><span id="pdQty">1</span><button onclick="pdChangeQty(1)">+</button></div><div class="pd-actions"><button class="btn btn-outline" ${p.stock<=0?'disabled':''} onclick="addToCart('${p.id}',pdState.qty)">Add to Cart</button><button class="btn btn-primary" ${p.stock<=0?'disabled':''} onclick="addToCart('${p.id}',pdState.qty);window.location.href='checkout.html';">Buy Now</button><button class="btn btn-ghost" id="wishToggleBtn" onclick="toggleWishlist('${p.id}');syncWishBtn();">${isWishlisted(p.id)?'♥ Wishlisted':'♡ Wishlist'}</button></div><div class="pd-info-box">🚚 <div><b>Estimated delivery:</b> 3–5 business days to most pin codes.</div></div><div class="pd-info-box">🔒 <div><b>Secure checkout:</b> Payment integration will use the server-side Razorpay flow in the production phase.</div></div></div></div><div class="tabs-nav" id="pdTabs">${['description','specifications','usage','seller','reviews'].map(t=>`<button class="${t==='description'?'active':''}" onclick="pdSetTab(this,'${t}')">${t.charAt(0).toUpperCase()+t.slice(1)}</button>`).join('')}</div><div id="pdTabPanels"><div class="tab-panel active" data-panel="description"><p>${esc(p.desc)}</p></div><div class="tab-panel" data-panel="specifications"><table class="spec-table">${Object.entries(p.specs||{}).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('')}</table></div><div class="tab-panel" data-panel="usage"><p>${esc(p.usage||'')}</p></div><div class="tab-panel" data-panel="seller"><div class="seller-card" style="max-width:320px;"><div class="avatar">${esc((p.sellerName||sellerName(p.seller)).charAt(0))}</div><h4>${esc(p.sellerName||sellerName(p.seller))}</h4><span class="muted" style="font-size:12px">${esc(p.sellerLocation||'')}</span></div></div><div class="tab-panel" data-panel="reviews"><div class="muted">Loading reviews…</div></div></div>${related.length?`<section class="pad"><div class="section-head"><div><h2 style="font-size:22px;">You May Also Like</h2><p class="muted">Related by category, brand and product similarity.</p></div></div><div class="product-grid">${related.map(productCard).join('')}</div></section>`:''}`;await renderReviews(p.id);}
function pdSetImg(btn,src){document.getElementById('pdMainImg').src=src;document.querySelectorAll('.pd-thumbs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}function pdChangeQty(delta){pdState.qty=Math.max(1,pdState.qty+delta);document.getElementById('pdQty').textContent=pdState.qty;}function pdSetTab(btn,t){document.querySelectorAll('#pdTabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.querySelectorAll('#pdTabPanels .tab-panel').forEach(p=>p.classList.toggle('active',p.dataset.panel===t));if(t==='reviews')renderReviews(pdState.current.id);}function syncWishBtn(){const id=qs('id'),btn=document.getElementById('wishToggleBtn');if(btn)btn.textContent=isWishlisted(id)?'♥ Wishlisted':'♡ Wishlist';}
</script></body></html>
