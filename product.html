<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Product — AgriMart</title>
<meta name="description" id="pageDesc" content="Product details on AgriMart.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="product">

<div id="site-header"></div>

<main>
  <div class="container" id="productRoot"></div>
</main>

<div id="site-footer"></div>

<script src="assets/data.js"></script>
<script src="assets/common.js"></script>
<script>
let pdState = {qty:1};
function initPage(){
  const id = qs('id');
  const p = byId(id);
  const root = document.getElementById('productRoot');
  if(!p){
    root.innerHTML = `<div class="empty-state"><div class="ic">🌾</div><h3>Product not found</h3><p>The product you're looking for doesn't exist.</p><a href="shop.html" class="btn btn-primary" style="margin-top:16px;">Back to Shop</a></div>`;
    return;
  }
  document.getElementById('pageTitle').textContent = p.name + ' — AgriMart';
  document.getElementById('pageDesc').setAttribute('content', p.desc);
  const discount = Math.round((1-p.price/p.mrp)*100);
  const related = PRODUCTS.filter(x=>x.category===p.category && x.id!==p.id).slice(0,4);
  const seller = SELLERS.find(s=>s.id===p.seller);
  root.innerHTML = `
    <div class="breadcrumb">
      <a href="index.html">Home</a><span class="sep">/</span>
      <a href="shop.html">Shop</a><span class="sep">/</span>
      <span class="cur">${p.name}</span>
    </div>
    <div class="pd-layout">
      <div>
        <div class="pd-gallery-main"><img id="pdMainImg" src="${p.img}" alt="${p.name}"></div>
        <div class="pd-thumbs">
          ${[p.img,p.img,p.img].map((im,i)=>`<button class="${i===0?'active':''}" onclick="pdSetImg(this,'${im}')"><img src="${im}" alt=""></button>`).join('')}
        </div>
      </div>
      <div>
        <span class="pd-brand">${p.brand} · ${p.category.replace('-',' ')}</span>
        <h1 class="pd-title">${p.name}</h1>
        <div class="pd-meta-row">
          <span class="stars">${stars(p.rating)}</span> <b>${p.rating}</b> (${p.reviews} reviews)
          <span>·</span> Sold by <a href="seller.html" style="text-decoration:underline;">${sellerName(p.seller)}</a>
        </div>
        <div class="pd-price-row">
          <span class="now">${fmt(p.price)}</span>
          ${p.mrp>p.price?`<span class="was">${fmt(p.mrp)}</span><span class="disc">${discount}% off</span>`:''}
        </div>
        <div class="pd-tax">Inclusive of all taxes · Free delivery on orders above ₹999</div>
        <div class="pd-stockline">
          <span class="dot" style="background:${p.stock>0?'var(--success)':'var(--danger)'}"></span>
          ${p.stock>0 ? (p.stock<15?`Only ${p.stock} left in stock`:'In Stock') : 'Out of Stock'}
        </div>
        <div>
          <label style="font-size:12.5px;font-weight:700;color:var(--ink-soft);display:block;margin-bottom:8px;">Quantity</label>
          <div class="qty-selector">
            <button onclick="pdChangeQty(-1)">−</button><span id="pdQty">1</span><button onclick="pdChangeQty(1)">+</button>
          </div>
        </div>
        <div class="pd-actions">
          <button class="btn btn-outline" ${p.stock<=0?'disabled':''} onclick="addToCart('${p.id}', pdState.qty);"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1.4"/><circle cx="19" cy="21" r="1.4"/><path d="M2 3h2l2.6 12.6a2 2 0 002 1.6h8.7a2 2 0 002-1.6L21 8H6"/></svg> Add to Cart</button>
          <button class="btn btn-primary" ${p.stock<=0?'disabled':''} onclick="addToCart('${p.id}', pdState.qty); window.location.href='checkout.html';">Buy Now</button>
          <button class="btn btn-ghost" id="wishToggleBtn" onclick="toggleWishlist('${p.id}'); syncWishBtn();">${isWishlisted(p.id)?'♥ Wishlisted':'♡ Wishlist'}</button>
        </div>
        <div class="pd-info-box">🚚 <div><b>Estimated delivery:</b> 3–5 business days to most pin codes. Cash on delivery available in select areas.</div></div>
        <div class="pd-info-box">🔒 <div><b>Secure checkout:</b> Payments processed via Razorpay with UPI, cards, net banking and wallets.</div></div>
      </div>
    </div>

    <div class="tabs-nav" id="pdTabs">
      ${['description','specifications','usage','seller','reviews'].map(t=>`<button class="${t==='description'?'active':''}" onclick="pdSetTab(this,'${t}')">${t.charAt(0).toUpperCase()+t.slice(1)}</button>`).join('')}
    </div>
    <div id="pdTabPanels">
      <div class="tab-panel active" data-panel="description"><p>${p.desc}</p></div>
      <div class="tab-panel" data-panel="specifications"><table class="spec-table">${Object.entries(p.specs).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('')}</table></div>
      <div class="tab-panel" data-panel="usage"><p>${p.usage}</p></div>
      <div class="tab-panel" data-panel="seller">
        <div class="seller-card" style="max-width:320px;">
          <div class="avatar">${sellerName(p.seller).charAt(0)}</div>
          <h4>${sellerName(p.seller)}</h4>
          <span class="muted" style="font-size:12px">${seller?seller.location:''}</span>
          <div class="verified">✓ Verified Seller</div>
          <div style="margin-top:8px;font-size:12px" class="muted">${seller?stars(seller.rating)+' '+seller.rating+' · '+seller.products+' products':''}</div>
        </div>
      </div>
      <div class="tab-panel" data-panel="reviews">
        <div class="review-grid">${REVIEWS_HOME.map(r=>`<div class="review-card"><div class="stars">${stars(r.rating)}</div><p class="txt">"${r.text}"</p><div class="who"><div class="av">${r.name.charAt(0)}</div><div><b>${r.name}</b><span>${r.loc}</span></div></div></div>`).join('')}</div>
      </div>
    </div>

    ${related.length?`
    <section class="pad">
      <div class="section-head"><div><h2 style="font-size:22px;">You May Also Like</h2></div></div>
      <div class="product-grid">${related.map(productCard).join('')}</div>
    </section>`:''}
  `;
}
function pdSetImg(btn, src){ document.getElementById('pdMainImg').src = src; document.querySelectorAll('.pd-thumbs button').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); }
function pdChangeQty(delta){ pdState.qty = Math.max(1, pdState.qty+delta); document.getElementById('pdQty').textContent = pdState.qty; }
function pdSetTab(btn, t){ document.querySelectorAll('#pdTabs button').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); document.querySelectorAll('#pdTabPanels .tab-panel').forEach(p=>p.classList.toggle('active', p.dataset.panel===t)); }
function syncWishBtn(){ const id = qs('id'); const btn = document.getElementById('wishToggleBtn'); if(btn) btn.textContent = isWishlisted(id) ? '♥ Wishlisted' : '♡ Wishlist'; }
</script>
</body>
</html>
