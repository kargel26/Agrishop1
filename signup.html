<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Customer Sign Up — AgriMart</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/style.css"><style>body.customer-signup{background:#fbfaf6}.customer-signup .auth-wrap{max-width:470px;margin:52px auto;padding:34px;border-radius:20px;background:#fffdf8;border:1px solid #e8e1d3;box-shadow:0 16px 45px rgba(80,60,30,.08)}.signup-mark{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;margin:0 auto 16px;background:#f1eadb;color:#6b4d2e;font:700 22px 'Fraunces',serif}.customer-signup h2{font-family:'Fraunces',serif;text-align:center;font-size:30px;margin-bottom:6px}.customer-signup input{background:#fff;border-color:#ddd5c5}.customer-signup .btn-primary{background:#5d7b3f;border-color:#5d7b3f}.signup-role-links{display:flex;gap:8px;margin-top:20px}.signup-role-links a{flex:1;text-align:center;padding:9px 6px;border:1px solid #e1dacd;border-radius:10px;color:#5d7b3f;text-decoration:none;font-size:12px;font-weight:600}</style></head><body class="customer-signup" data-page="account"><div id="site-header"></div><main><div class="container"><div class="auth-wrap"><div class="signup-mark">C</div><h2>Create your customer account</h2><p class="muted center" style="font-size:13px;margin-bottom:22px">Create an account to shop AgriMart and manage your orders.</p><div class="form-field full" style="margin-bottom:12px"><label>Full Name</label><input id="signupName" autocomplete="name" placeholder="Your full name"></div><div class="form-field full" style="margin-bottom:12px"><label>Phone (optional)</label><input id="signupPhone" autocomplete="tel" placeholder="10-digit mobile number"></div><div class="form-field full" style="margin-bottom:12px"><label>Email</label><input id="signupEmail" type="email" autocomplete="email" placeholder="you@example.com"></div><div class="form-field full" style="margin-bottom:18px"><label>Password</label><input id="signupPass" type="password" autocomplete="new-password" placeholder="At least 6 characters"></div><button class="btn btn-primary btn-block" id="signupBtn" onclick="doSignup()">Create Customer Account</button><p id="signupMessage" class="muted center" style="font-size:12px;margin-top:14px"></p><p class="center" style="font-size:13px;margin-top:18px">Already have a customer account? <a href="login.html">Customer Sign In</a></p><div class="signup-role-links"><a href="seller-login.html">Seller Sign In</a><a href="admin-login.html">Admin Sign In</a></div></div></div></main><div id="site-footer"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/data.js"></script><script src="assets/common.js"></script><script src="assets/supabase-client.js"></script><script src="assets/auth.js"></script><script>async function initPage(){}async function doSignup(){const name=document.getElementById('signupName').value.trim(),phone=document.getElementById('signupPhone').value.trim(),email=document.getElementById('signupEmail').value.trim(),password=document.getElementById('signupPass').value,msg=document.getElementById('signupMessage'),btn=document.getElementById('signupBtn');if(!name||!email||!password){msg.textContent='Please fill name, email and password.';return}if(password.length<6){msg.textContent='Password must be at least 6 characters.';return}btn.disabled=true;btn.textContent='Creating account…';msg.textContent='';try{const data=await AgriAuth.signUp(email,password,name,phone);if(data.session){toast('Customer account created successfully');location.href='index.html'}else msg.textContent='Account created. Check your email to confirm your address, then sign in.'}catch(e){msg.textContent=e.message||'Unable to create account.'}finally{btn.disabled=false;btn.textContent='Create Customer Account'}}</script></body></html>
