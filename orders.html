<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>My Orders — AgriMart</title><link rel="stylesheet" href="assets/style.css"></head><body data-page="orders"><div id="site-header"></div><main><div class="container"><div class="breadcrumb"><a href="index.html">Home</a><span class="sep">/</span><span class="cur">My Orders</span></div><h2 style="font-size:26px;margin-bottom:20px">My Orders</h2><div id="ordersRoot"></div></div></main><div id="site-footer"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/data.js"></script><script src="assets/common.js"></script><script src="assets/supabase-client.js"></script><script src="assets/auth.js"></script><script src="assets/orders.js?v=20260902-5"></script><script>async function initPage(){const root=document.getElementById('ordersRoot');try{const user=await AgriAuth.getCurrentUser();if(!user){root.innerHTML='<div class="empty-state"><div class="ic">👤</div><h3>Please sign in</h3><a href="login.html?next=orders.html" class="btn btn-primary">Sign In</a></div>';return;}const orders=await AgriOrders.getOrders();if(!orders.length){root.innerHTML='<div class="empty-state"><div class="ic">📦</div><h3>No orders yet</h3><p>Your order history will appear here once you make a purchase.</p><a href="shop.html" class="btn btn-primary">Start Shopping</a></div>';return;}root.innerHTML=orders.map(o=>{const status=String(o.status||'pending').toLowerCase();const steps=['pending','confirmed','processing','shipped','delivered'];const idx=steps.indexOf(status);const label=status==='pending'?'Order placed':status==='confirmed'?'Order confirmed':status==='processing'?'Preparing your order':status==='shipped'?'Order shipped':status==='delivered'?'Order delivered':status==='cancelled'?'Order cancelled':status==='refunded'?'Order refunded':status;const orderKey=o.order_number||o.id;return '<div class="panel-card"><div class="flex-between" style="flex-wrap:wrap;gap:10px"><div><b>Order #'+esc(orderKey)+'</b><div class="muted" style="font-size:12px">Placed on '+new Date(o.created_at).toLocaleString()+' · '+(o.order_items||[]).length+' item(s)</div></div><div><span class="status-chip">'+esc(o.status)+'</span></div></div><div class="summary-row" style="margin-top:12px"><span>Total</span><b>'+fmt(o.total)+'</b></div><div class="summary-row"><span>Payment</span><span>'+((o.status==='confirmed'||o.status==='processing'||o.status==='shipped'||o.status==='delivered')?'Confirmed':'Pending')+'</span></div><div style="margin-top:14px;padding:12px;border:1px solid var(--border,#e5e7eb);border-radius:10px;background:#fafafa"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><b>🚚 Delivery Tracking</b><span class="muted" style="font-size:12px">'+esc(label)+'</span></div><div style="display:flex;gap:4px;margin-top:10px">'+steps.map((s,i)=>'<span title="'+s+'" style="height:5px;flex:1;border-radius:5px;background:'+(idx>=i?'#16a34a':'#e5e7eb')+'"></span>').join('')+'</div><div class="muted" style="font-size:12px;margin-top:8px">Live updates are controlled by Admin/Seller. You can view updates only.</div></div><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><a href="order.html?id='+encodeURIComponent(orderKey)+'" class="btn btn-primary btn-sm">🚚 Track Order</a><a href="order.html?id='+encodeURIComponent(orderKey)+'" class="btn btn-outline btn-sm">View Order</a>'+((o.status==='pending')?'<button class="btn btn-ghost btn-sm" onclick="cancelOrder(\''+o.id+'\')">Cancel Order</button>':'')+'</div></div>';}).join('');}catch(e){console.error(e);root.innerHTML='<div class="empty-state"><h3>Could not load orders</h3><p>'+esc(e.message)+'</p></div>';}}async function cancelOrder(id){if(!confirm('Cancel this pending order?'))return;try{await AgriOrders.cancelOrder(id);toast('Order cancelled successfully.');initPage();}catch(e){toast(e.message,'error');}}function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));}</script></body></html>
