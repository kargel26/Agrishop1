<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders — AgriMart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script defer src="assets/speed-insights.js"></script>
</head>
<body data-page="orders">

<div id="site-header"></div>

<main>
  <div class="container">
    <div class="breadcrumb"><a href="index.html">Home</a><span class="sep">/</span><span class="cur">My Orders</span></div>
    <h2 style="font-size:26px;margin-bottom:20px;">My Orders</h2>
    <div id="ordersRoot"></div>
  </div>
</main>

<div id="site-footer"></div>

<script src="assets/data.js"></script>
<script src="assets/common.js"></script>
<script>
function initPage(){
  const orders = state.orders;
  const root = document.getElementById('ordersRoot');
  if(orders.length===0){
    root.innerHTML = `<div class="empty-state"><div class="ic">📦</div><h3>No orders yet</h3><p>Your order history will appear here once you make a purchase.</p><a href="shop.html" class="btn btn-primary" style="margin-top:16px;">Start Shopping</a></div>`;
    return;
  }
  root.innerHTML = orders.map(o=>`
    <div class="panel-card">
      <div class="flex-between" style="flex-wrap:wrap;gap:10px;">
        <div>
          <b>Order #${o.id}</b>
          <div class="muted" style="font-size:12.5px;">Placed on ${new Date(o.date).toDateString()} · ${o.items.length} item(s)</div>
        </div>
        <div style="display:flex;gap:8px;align-items:center;">
          <span class="status-chip chip-${o.status.toLowerCase().replace(/ /g,'-')}">${o.status}</span>
          <a href="order.html?id=${o.id}" class="btn btn-outline btn-sm">Track Order</a>
        </div>
      </div>
      <div style="display:flex;gap:10px;margin-top:14px;overflow-x:auto;">
        ${o.items.map(it=>`<img src="${it.img}" style="width:56px;height:56px;border-radius:8px;object-fit:cover;flex-shrink:0;">`).join('')}
      </div>
      <div class="flex-between" style="margin-top:12px;">
        <span class="muted" style="font-size:13px;">Total: <b style="color:var(--ink)">${fmt(o.totals.total)}</b></span>
        <span class="muted" style="font-size:12px;">Payment: ${o.paymentStatus}</span>
      </div>
    </div>
  `).join('');
}
</script>
</body>
</html>
