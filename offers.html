<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Special Offers — AgriMart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
.offers-page{padding:24px 0 64px}.offers-intro{padding:16px 0 24px}.offers-intro .eyebrow{margin-bottom:10px;display:inline-block}.offers-intro h1{font-family:var(--font-display);font-size:clamp(34px,5vw,52px);line-height:1.08;color:#173b2b;margin:0 0 10px}.offers-intro p{max-width:780px;color:#667267;line-height:1.7;margin:0}.offer-grid{margin-top:8px}.offer-banner{min-height:245px;display:flex;flex-direction:column;justify-content:flex-end;padding:28px;border-radius:22px;overflow:hidden;position:relative;background-size:cover;background-position:center;box-shadow:var(--shadow-lg)}.offer-banner:before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.68))}.offer-banner>*{position:relative;z-index:1}.offer-banner h3{font-family:var(--font-display);font-size:30px;line-height:1.1;color:#fff;margin:0 0 8px}.offer-banner p{color:#f3f7f3;margin:0 0 16px;max-width:560px;line-height:1.55}.offer-banner .btn{width:max-content}.offer-1{background-image:linear-gradient(rgba(23,59,43,.15),rgba(23,59,43,.15)),url('https://images.unsplash.com/photo-1500937386664-56d1dfef3854?q=80&w=1200&auto=format&fit=crop')}.offer-2{background-image:linear-gradient(rgba(23,59,43,.15),rgba(23,59,43,.15)),url('https://images.unsplash.com/photo-1585314540083-4a2e6b0b6f6e?q=80&w=1200&auto=format&fit=crop')}.offer-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}.offer-empty{padding:30px;text-align:center;background:#f4f7f1;border:1px solid var(--line);border-radius:16px;color:var(--ink-soft)}.offers-section-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:34px 0 16px}.offers-section-head h2{font-family:var(--font-display);font-size:28px;color:#173b2b;margin:0 0 5px}.offers-section-head p{color:#667267;margin:0}.offer-loading{padding:30px;text-align:center;color:var(--ink-soft)}
@media(max-width:760px){.offer-grid{grid-template-columns:1fr}.offer-banner{min-height:220px;padding:22px}.offer-banner h3{font-size:25px}}
</style>
</head>
<body data-page="offers">
<div id="site-header"></div>
<main class="offers-page"><div class="container">
<div class="breadcrumb"><a href="index.html">Home</a><span class="sep">/</span><span class="cur">Offers</span></div>
<section class="offers-intro"><span class="eyebrow" id="offersEyebrow">Best Deals for Farmers</span><h1 id="offersTitle">Special Offers</h1><p id="offersDescription">Save more on quality seeds, fertilizers, tools and essential farming supplies.</p></section>
<section class="offer-grid" id="offerBanners"></section>
<section class="offers-section-head"><div><h2 id="discountedTitle">Discounted Products</h2><p id="discountedDescription">Hand-picked products with the best available discounts.</p></div></section>
<section id="discountGrid" class="product-grid"><div class="offer-loading">Loading offers…</div></section>
</div></main>
<div id="site-footer"></div>
<script src="assets/data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-client.js"></script>
<script src="assets/common.js"></script>
<script>
const DEFAULT_OFFERS={is_active:true,eyebrow:'Best Deals for Farmers',title:'Special Offers',description:'Save more on quality seeds, fertilizers, tools and essential farming supplies.',primary_banner_title:'Save Up to 30% on Farming Essentials',primary_banner_text:'Quality seeds, fertilizers and tools at unbeatable prices.',primary_banner_button:'Shop the Sale',primary_banner_link:'shop.html',primary_banner_image:'',secondary_banner_title:'Organic Farming Essentials',secondary_banner_text:'Certified organic inputs for sustainable farming.',secondary_banner_button:'Explore Organic',secondary_banner_link:'shop.html?category=organic',secondary_banner_image:'',discounted_title:'Discounted Products',discounted_description:'Hand-picked products with the best available discounts.',product_limit:8,selected_product_ids:[]};
function offerEsc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function offerBanner(title,text,button,link,image,cls){const safeImage=image?`url('${String(image).replace(/'/g,"%27")}')`:'';return `<div class="offer-banner ${cls}" ${safeImage?`style="background-image:linear-gradient(rgba(23,59,43,.15),rgba(23,59,43,.15)),${safeImage}"`:''}><h3>${offerEsc(title)}</h3><p>${offerEsc(text)}</p><a href="${offerEsc(link||'shop.html')}" class="btn btn-accent">${offerEsc(button)}</a></div>`;}
async function initPage(){let p={...DEFAULT_OFFERS};try{if(window.agriSupabase){const {data,error}=await window.agriSupabase.from('offers_page_settings').select('*').eq('id',1).maybeSingle();if(!error&&data)p={...p,...data};}}catch(e){console.warn('Offers settings unavailable',e);}if(p.is_active===false){document.querySelector('main').innerHTML='<div class="container"><div class="offer-empty"><h2>Offers are currently unavailable</h2><p>Please check back soon for new offers.</p></div></div>';return;}
document.title=(p.title||'Special Offers')+' — AgriMart';document.getElementById('offersEyebrow').textContent=p.eyebrow||'';document.getElementById('offersTitle').textContent=p.title||'';document.getElementById('offersDescription').textContent=p.description||'';document.getElementById('discountedTitle').textContent=p.discounted_title||'Discounted Products';document.getElementById('discountedDescription').textContent=p.discounted_description||'';document.getElementById('offerBanners').innerHTML=offerBanner(p.primary_banner_title,p.primary_banner_text,p.primary_banner_button,p.primary_banner_link,p.primary_banner_image,'offer-1')+offerBanner(p.secondary_banner_title,p.secondary_banner_text,p.secondary_banner_button,p.secondary_banner_link,p.secondary_banner_image,'offer-2');
let products=[...(typeof PRODUCTS!=='undefined'?PRODUCTS:[])];const selected=Array.isArray(p.selected_product_ids)?p.selected_product_ids.filter(id=>products.some(x=>x.id===id)):[];if(selected.length)products=selected.map(id=>products.find(x=>x.id===id)).filter(Boolean);else products.sort((a,b)=>(b.mrp-b.price)/b.mrp-(a.mrp-a.price)/a.mrp);products=products.filter(x=>Number(x.stock??1)>0).slice(0,Math.max(1,Number(p.product_limit||8)));document.getElementById('discountGrid').innerHTML=products.length?products.map(productCard).join(''):'<div class="offer-empty">No discounted products are available right now.</div>';}
</script>
</body>
</html>
