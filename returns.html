<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Returns & Refunds — AgriMart</title><link rel="stylesheet" href="assets/style.css"><style>.return-card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;margin-bottom:14px}.return-row{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center}.return-row img{width:72px;height:72px;object-fit:cover;border-radius:10px;background:#f3f4f6}.status{padding:6px 10px;border-radius:999px;background:#eef7f0;color:#17643a;font-size:12px;font-weight:700;text-transform:capitalize}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:18px}.modal-card{background:#fff;border-radius:16px;padding:22px;max-width:520px;width:100%}.modal select,.modal textarea{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px;margin:6px 0 14px}.modal textarea{min-height:90px;resize:vertical}@media(max-width:650px){.return-row{grid-template-columns:60px 1fr}.return-row .action{grid-column:2}.return-row img{width:60px;height:60px}}</style></head><body data-page="returns"><div id="site-header"></div><main><div class="container"><div class="breadcrumb"><a href="index.html">Home</a><span class="sep">/</span><a href="profile.html">Account</a><span class="sep">/</span><span class="cur">Returns</span></div><h2>Returns & Refunds</h2><p class="muted">Request a return for eligible delivered items and follow the refund status.</p><div id="returnsRoot"><div class="empty-state"><h3>Loading…</h3></div></div></div></main><div id="site-footer"></div><div class="modal" id="returnModal"><div class="modal-card"><h3>Request Return</h3><p id="returnProduct" class="muted"></p><form onsubmit="submitReturn(event)"><input type="hidden" id="returnItem"><label>Reason</label><select id="reason" required><option value="">Select a reason</option><option>Damaged product</option><option>Wrong product received</option><option>Product not as described</option><option>Quality issue</option><option>Changed my mind</option><option>Other</option></select><label>Details</label><textarea id="details" placeholder="Tell us what happened (optional)"></textarea><div style="display:flex;gap:10px;justify-content:flex-end"><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary">Submit Return</button></div></form></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/data.js"></script><script src="assets/common.js"></script><script src="assets/supabase-client.js"></script><script src="assets/auth.js"></script><script src="assets/orders.js"></script><script>const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]));let USER,ORDERS=[],RETURNS=[];async function initPage(){USER=await AgriAuth.getCurrentUser();if(!USER){document.getElementById('returnsRoot').innerHTML='<div class="empty-state"><h3>Please sign in</h3><a class="btn btn-primary" href="login.html?next=returns.html">Sign In</a></div>';return}try{ORDERS=await AgriOrders.getOrders();const r=await window.agriSupabase.from('returns').select('id,order_id,order_item_id,reason,details,status,refund_amount,created_at,updated_at').eq('user_id',USER.id).order('created_at',{ascending:false});if(r.error)throw r.error;RETURNS=r.data||[];render()}catch(e){document.getElementById('returnsRoot').innerHTML='<div class="empty-state"><h3>Could not load returns</h3><p>'+esc(e.message)+'</p></div>'}}function render(){const root=document.getElementById('returnsRoot');let rows=[];for(const o of ORDERS){for(const i of (o.order_items||[])){const ret=RETURNS.find(r=>r.order_item_id===i.id);if(ret)rows.push({o,i,ret});else if(o.status==='delivered')rows.push({o,i,ret:null})}}root.innerHTML=rows.length?rows.map(({o,i,ret})=>`<div class="return-card"><div class="return-row"><img src="${esc((typeof byId==='function'&&i.product_id)?(byId(i.product_id)?.image||''): '')}" onerror="this.style.visibility='hidden'" alt=""><div><b>${esc(i.product_name)}</b><div class="muted">Order #${esc(o.order_number)} · Qty ${i.quantity} · ₹${Number(i.unit_price*i.quantity).toFixed(2)}</div>${ret?`<div style="margin-top:8px"><span class="status">${esc(ret.status)}</span> ${ret.refund_amount?`<span class="muted">Refund ₹${Number(ret.refund_amount).toFixed(2)}</span>`:''}</div>`:''}</div><div class="action">${ret?'<span class="muted">Return requested</span>':'<button class="btn btn-outline" onclick="openModal(\''+i.id+'\',\''+esc(i.product_name).replace(/'/g,'&#39;')+'\')">Return Item</button>'}</div></div></div>`).join(''):'<div class="empty-state"><div class="ic">🔄</div><h3>No returnable items</h3><p>Delivered products eligible for return will appear here.</p><a class="btn btn-primary" href="orders.html">View Orders</a></div>'}function openModal(id,name){document.getElementById('returnItem').value=id;document.getElementById('returnProduct').textContent=name;document.getElementById('returnModal').style.display='flex'}function closeModal(){document.getElementById('returnModal').style.display='none'}async function submitReturn(e){e.preventDefault();const itemId=document.getElementById('returnItem').value;const match=ORDERS.flatMap(o=>(o.order_items||[]).map(i=>({o,i}))).find(x=>x.i.id===itemId);if(!match||match.o.status!=='delivered'){alert('This item is not eligible for return.');return}const amount=Number(match.i.unit_price)*Number(match.i.quantity);const r=await window.agriSupabase.from('returns').insert({order_id:match.o.id,order_item_id:itemId,user_id:USER.id,reason:document.getElementById('reason').value,details:document.getElementById('details').value.trim(),refund_amount:amount});if(r.error){alert(r.error.message);return}closeModal();await initPage();alert('Return request submitted successfully.');}</script></body></html>
