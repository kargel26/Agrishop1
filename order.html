<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Order Details — AgriMart</title><link rel="stylesheet" href="assets/style.css?v=20260902-6"><style>.journey{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0 20px}.step{padding:9px 5px;text-align:center;border-radius:9px;background:#f3f4f6;font-size:11px;font-weight:700}.step.done,.step.current{background:#eaf5ed;color:#17643a}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.review{border-top:1px solid #eee;margin-top:15px;padding-top:15px}.review textarea{width:100%;min-height:80px;padding:10px;border:1px solid #d1d5db;border-radius:9px}.stars button{border:0;background:none;font-size:25px;cursor:pointer}.track{display:grid;gap:10px}.track div{padding:10px 12px;border-left:3px solid #d1d5db}.track .active{border-left-color:#17643a;background:#f5faf6;border-radius:0 8px 8px 0}.track-time{font-size:11px;color:#6b7280;margin-top:4px}.track-location{font-size:12px;color:#315d44;margin-top:3px}.error-box{padding:14px;border:1px solid #f0caca;background:#fff7f7;border-radius:10px;color:#8b1e1e;margin-top:15px}@media(max-width:620px){.journey{grid-template-columns:1fr 1fr}.step:last-child{grid-column:span 2}}</style></head><body data-page="orders"><div id="site-header"></div><main><div class="container" style="max-width:760px" id="orderRoot"></div></main><div id="site-footer"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/data.js?v=20260902-6"></script><script src="assets/common.js?v=20260902-6"></script><script src="assets/supabase-client.js?v=20260902-6"></script><script src="assets/auth.js?v=20260902-6"></script><script src="assets/orders.js?v=20260902-6"></script><script>let ORDER,USER,REVIEWS=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>'₹'+Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:2});const getOrderParam=()=>new URLSearchParams(window.location.search).get('id');const statuses=['pending','confirmed','processing','shipped','delivered'];async function initPage(){const root=document.getElementById('orderRoot');try{USER=await AgriAuth.getCurrentUser();if(!USER){root.innerHTML='<div class="empty-state"><h3>Please sign in</h3><a href="login.html?next='+encodeURIComponent(location.href)+'" class="btn btn-primary">Sign In</a></div>';return}const n=getOrderParam();if(!n){root.innerHTML='<div class="empty-state"><h3>Order not found</h3><a href="orders.html" class="btn btn-primary">Back to Orders</a></div>';return}ORDER=await AgriOrders.getOrderByNumber(n);if(!ORDER){root.innerHTML='<div class="empty-state"><h3>Order not found</h3><a href="orders.html" class="btn btn-primary">Back to Orders</a></div>';return}const rr=await window.agriSupabase.from('reviews').select('id,product_id,rating,comment').eq('user_id',USER.id);if(!rr.error)REVIEWS=rr.data||[];render()}catch(e){console.error('Order page error',e);root.innerHTML='<div class="empty-state"><h3>Could not load order</h3><div class="error-box">'+esc(e.message||'Unknown error')+'</div><div class="actions"><a href="orders.html" class="btn btn-primary">Back to Orders</a><button class="btn btn-outline" onclick="location.reload()">Retry</button></div></div>'}}function render(){const o=ORDER,idx=statuses.indexOf(String(o.status||'pending')),pay=(o.payments||[])[0],events=o.tracking_events||[];const journeyStatuses=statuses;document.getElementById('orderRoot').innerHTML='<div class="breadcrumb"><a href="orders.html">My Orders</a><span class="sep">/</span><span class="cur">'+esc(o.order_number)+'</span></div><div class="flex-between" style="flex-wrap:wrap;gap:10px"><h2>Order #'+esc(o.order_number)+'</h2><span class="status-chip">'+esc(o.status)+'</span></div><div class="journey">'+journeyStatuses.map((s,i)=>'<div class="step '+(idx>=0&&i<idx?'done ':'')+(i===idx?'current':'')+'">'+(idx>=0&&i<idx?'✓ ':'')+s+'</div>').join('')+'</div><div class="panel-card"><div class="flex-between" style="gap:10px;flex-wrap:wrap"><h3 style="margin:0">🚚 Delivery Tracking</h3><button class="btn btn-outline btn-sm" onclick="refreshTracking()">↻ Refresh</button></div><p class="muted" style="font-size:12px;margin:6px 0 12px">Live updates are controlled by AgriMart Admin/Seller. You can view updates only.</p><div class="track">'+(events.length?events.map(e=>'<div class="active"><b>'+esc(e.title||e.status)+'</b>'+(e.description?'<div>'+esc(e.description)+'</div>':'')+(e.location?'<div class="track-location">📍 '+esc(e.location)+'</div>':'')+'<div class="track-time">'+new Date(e.created_at).toLocaleString('en-IN')+'</div></div>').join(''):'<div class="muted">Tracking will appear here when the order is updated.</div>')+'</div></div><div class="panel-card"><h3>Items</h3>'+(o.order_items||[]).map(i=>'<div class="summary-row"><span>'+esc(i.product_name)+' × '+i.quantity+'</span><b>'+money(i.line_total||Number(i.unit_price)*i.quantity)+'</b></div>').join('')+'<div class="actions">'+(o.status==='pending'?'<button class="btn btn-ghost btn-sm" onclick="cancelIt()">Cancel Order</button>':'')+(o.status==='delivered'?'<a class="btn btn-outline btn-sm" href="returns.html">Return / Refund</a>':'')+'</div></div><div class="panel-card"><h3>Delivery Address</h3><p>'+esc(o.addresses?.name||'')+'<br>'+esc(o.addresses?.line||'')+', '+esc(o.addresses?.village||'')+', '+esc(o.addresses?.city||'')+', '+esc(o.addresses?.district||'')+', '+esc(o.addresses?.state||'')+' — '+esc(o.addresses?.pin||'')+'<br>📞 '+esc(o.addresses?.phone||'')+'</p></div><div class="panel-card"><h3>Payment</h3><div class="summary-row"><span>Amount</span><b>'+money(o.total)+'</b></div><div class="summary-row"><span>Status</span><b>'+esc(pay?.status||'pending')+'</b></div><div class="summary-row"><span>Transaction</span><span style="font-size:12px">'+esc(pay?.method==='cod'?'Cash on Delivery':(pay?.razorpay_payment_id||'Not paid yet'))+'</span></div></div>'+(o.status==='delivered'?'<div class="panel-card"><h3>Rate your purchase</h3>'+((o.order_items||[]).map(i=>{const r=REVIEWS.find(x=>x.product_id===i.product_id);return '<div class="review"><b>'+esc(i.product_name)+'</b>'+(r?'<p>⭐ '+r.rating+'/5 — '+esc(r.comment||'')+'</p>':'<div class="stars" data-product="'+esc(i.product_id)+'">'+[1,2,3,4,5].map(n=>'<button type="button" onclick="setRating(\''+esc(i.product_id)+'\','+n+')">☆</button>').join('')+'</div><textarea id="comment-'+esc(i.product_id)+'" placeholder="Share your experience"></textarea><button class="btn btn-primary btn-sm" onclick="review(\''+esc(i.product_id)+'\')">Submit Review</button>')+'</div>'}).join(''))+'</div>':'')}'}async function refreshTracking(){try{const t=await AgriOrders.getTracking(ORDER.id);if(!t)throw new Error('Tracking is not available for this order.');ORDER.status=t.status;ORDER.updated_at=t.updated_at;ORDER.tracking_events=t.events||[];render();toast('Tracking updated.')}catch(e){toast(e.message||'Unable to refresh tracking','error')}}async function cancelIt(){if(!confirm('Cancel this pending order?'))return;try{await AgriOrders.cancelOrder(ORDER.id);toast('Order cancelled successfully.');location.reload()}catch(e){toast(e.message,'error')}}let ratings={};function setRating(id,n){ratings[id]=n;document.querySelectorAll('.stars[data-product="'+CSS.escape(id)+'"] button').forEach((b,i)=>b.textContent=i<n?'★':'☆')}async function review(id){const rating=ratings[id];if(!rating){toast('Please select a rating','error');return}const comment=document.getElementById('comment-'+CSS.escape(id)).value.trim();const r=await window.agriSupabase.from('reviews').insert({user_id:USER.id,product_id:id,rating,comment});if(r.error){toast(r.error.message,'error');return}toast('Review submitted successfully.');initPage()}</script></body></html>
