<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Order Details — AgriMart</title><link rel="stylesheet" href="assets/style.css?v=20260902-2"></head><body data-page="orders"><div id="site-header"></div><main><div class="container" style="max-width:760px" id="orderRoot"></div></main><div id="site-footer"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/data.js?v=20260902-2"></script><script src="assets/common.js?v=20260902-2"></script><script src="assets/supabase-client.js?v=20260902-2"></script><script src="assets/auth.js?v=20260902-2"></script><script src="assets/orders.js?v=20260902-2"></script><script>async function initPage(){const root=document.getElementById('orderRoot');try{const user=await AgriAuth.getCurrentUser();if(!user){root.innerHTML='<div class="empty-state"><h3>Please sign in</h3><a href="login.html?next='+encodeURIComponent(location.href)+'" class="btn btn-primary">Sign In</a></div>';return;}const orderNumber=qs('id');if(!orderNumber){root.innerHTML='<div class="empty-state"><h3>Order not found</h3><p>Missing order number.</p><a href="orders.html" class="btn btn-primary">Back to My Orders</a></div>';return;}const o=await AgriOrders.getOrderByNumber(orderNumber);if(!o){root.innerHTML='<div class="empty-state"><div class="ic">📦</div><h3>Order not found</h3><p>This order does not belong to the signed-in account or no longer exists.</p><a href="orders.html" class="btn btn-primary">Back to My Orders</a></div>';return;}const p=(o.payments||[])[0];const paymentStatus=p?.status||'pending';root.innerHTML='<div class="breadcrumb"><a href="index.html">Home</a><span class="sep">/</span><a href="orders.html">My Orders</a><span class="sep">/</span><span class="cur">'+esc(o.order_number)+'</span></div><div class="flex-between" style="margin-bottom:20px"><h2>Order #'+esc(o.order_number)+'</h2><span class="status-chip">'+esc(o.status)+'</span></div><div class="panel-card"><h3>Order Status</h3><div class="summary-row"><span>Placed</span><span>'+new Date(o.created_at).toLocaleString()+'</span></div><div class="summary-row"><span>Current Status</span><b>'+esc(o.status)+'</b></div>'+(o.status==='pending'?'<button class="btn btn-ghost btn-sm" style="margin-top:12px" onclick="cancelIt(\''+o.id+'\')">Cancel Order</button>':'')+'</div><div class="panel-card"><h3>Items</h3>'+o.order_items.map(i=>'<div class="summary-row"><span>'+esc(i.product_name)+' × '+i.quantity+'</span><b>'+fmt(i.line_total||Number(i.unit_price)*i.quantity)+'</b></div>').join('')+'</div><div class="panel-card"><h3>Delivery Address</h3><p>'+esc(o.addresses?.name||'')+'<br>'+esc(o.addresses?.line||'')+', '+esc(o.addresses?.village||'')+', '+esc(o.addresses?.city||'')+', '+esc(o.addresses?.district||'')+', '+esc(o.addresses?.state||'')+' — '+esc(o.addresses?.pin||'')+'<br>📞 '+esc(o.addresses?.phone||'')+'</p></div><div class="panel-card"><h3>Payment / Transaction</h3><div class="summary-row"><span>Amount</span><b>'+fmt(o.total)+'</b></div><div class="summary-row"><span>Status</span><b>'+esc(paymentStatus)+'</b></div><div class="summary-row"><span>Razorpay Payment ID</span><span style="font-size:12px">'+esc(p?.razorpay_payment_id||'Not paid yet')+'</span></div></div>';}catch(e){console.error(e);root.innerHTML='<div class="empty-state"><h3>Could not load order</h3><p>'+esc(e.message)+'</p></div>';}}async function cancelIt(id){if(!confirm('Cancel this pending order?'))return;try{await AgriOrders.cancelOrder(id);toast('Order cancelled successfully.');window.location.reload();}catch(e){toast(e.message,'error');}}function esc(v){return String(v??'').replace(/[&<>\\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]));}initPage();</script></body></html>
