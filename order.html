<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Details — AgriMart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="orders">

<div id="site-header"></div>

<main>
  <div class="container" style="max-width:760px;" id="orderRoot"></div>
</main>

<div id="site-footer"></div>

<script src="assets/data.js"></script>
<script src="assets/common.js"></script>
<script>
const ORDER_STAGES = ['Confirmed','Processing','Shipped','Out for Delivery','Delivered'];
function initPage(){ renderOrder(); }
function currentOrder(){ const id = qs('id'); return state.orders.find(o=>o.id===id); }
function renderOrder(){
  const o = currentOrder();
  const root = document.getElementById('orderRoot');
  if(!o){
    root.innerHTML = `<div class="empty-state"><div class="ic">📦</div><h3>Order not found</h3><p>We couldn't find that order.</p><a href="orders.html" class="btn btn-primary" style="margin-top:16px;">Back to My Orders</a></div>`;
    return;
  }
  const stageIdx = ORDER_STAGES.indexOf(o.status);
  root.innerHTML = `
    <div class="breadcrumb"><a href="index.html">Home</a><span class="sep">/</span><a href="orders.html">My Orders</a><span class="sep">/</span><span class="cur">${o.id}</span></div>
    <div class="flex-between" style="flex-wrap:wrap;gap:10px;margin-bottom:20px;">
      <h2 style="font-size:24px;">Order #${o.id}</h2>
      <span class="status-chip chip-${o.status.toLowerCase().replace(/ /g,'-')}">${o.status}</span>
    </div>
    <div class="panel-card">
      <h3>Order Tracking</h3>
      <div class="track-timeline">
        ${['Order Placed','Payment Confirmed', ...ORDER_STAGES.slice(1)].map((label,i)=>{
          const done = i <= stageIdx+1;
          return `<div class="track-step ${done?'done':''}"><div class="tl-dot-wrap"><div class="tl-dot">${done?'✓':i+1}</div>${i<ORDER_STAGES.length?'<div class="tl-line"></div>':''}</div><div class="tl-body"><b>${label}</b><span>${done? new Date(o.date).toDateString() : 'Pending'}</span></div></div>`;
        }).join('')}
      </div>
      <div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;">
        <button class="btn btn-outline btn-sm" onclick="advanceOrder()">Simulate Next Status (Admin/Seller Demo)</button>
        ${['Confirmed','Processing'].includes(o.status)?`<button class="btn btn-ghost btn-sm" onclick="cancelOrder()">Cancel Order</button>`:''}
        ${o.status==='Delivered'?`<button class="btn btn-ghost btn-sm" onclick="requestReturn()">Request Return / Refund</button>`:''}
      </div>
    </div>
    <div class="panel-card">
      <h3>Items</h3>
      ${o.items.map(it=>`<div class="cart-item"><img src="${it.img}"><div class="ci-info"><div class="ci-name">${it.name}</div><div class="ci-seller">Sold by ${it.seller} · Qty ${it.qty}</div></div><div class="ci-price">${fmt(it.price*it.qty)}</div></div>`).join('')}
    </div>
    <div class="panel-card">
      <h3>Shipping Address</h3>
      <p style="font-size:13.5px;">${o.address.name}<br>${o.address.line}, ${o.address.village}, ${o.address.city}, ${o.address.district}, ${o.address.state} — ${o.address.pin}<br>📞 ${o.address.phone}</p>
    </div>
    <div class="panel-card">
      <h3>Payment &amp; Invoice</h3>
      <div class="summary-row"><span>Subtotal</span><span>${fmt(o.totals.subtotal)}</span></div>
      <div class="summary-row"><span>Delivery</span><span>${o.totals.delivery===0?'FREE':fmt(o.totals.delivery)}</span></div>
      <div class="summary-row"><span>Tax</span><span>${fmt(o.totals.tax)}</span></div>
      <div class="summary-row total"><span>Total Paid</span><span>${fmt(o.totals.total)}</span></div>
      <p class="muted" style="font-size:12px;margin-top:6px;">Payment Method: ${o.paymentMethod.toUpperCase()} · Payment ID: ${o.razorpayPaymentId}</p>
      <button class="btn btn-outline btn-sm" style="margin-top:12px;" onclick="toast('Invoice download would start here (PDF generation via server).')">⬇ Download Invoice</button>
    </div>`;
}
function updateOrder(mutator){
  const orders = state.orders;
  const idx = orders.findIndex(o=>o.id===qs('id'));
  if(idx<0) return;
  mutator(orders[idx]);
  state.orders = orders;
  renderOrder();
}
function advanceOrder(){
  updateOrder(o=>{
    const idx = ORDER_STAGES.indexOf(o.status);
    if(idx < ORDER_STAGES.length-1){ o.status = ORDER_STAGES[idx+1]; toast('Order status updated to: ' + o.status); }
    else toast('Order already delivered.');
  });
}
function cancelOrder(){ updateOrder(o=>{ o.status='Cancelled'; }); toast('Order cancelled.'); }
function requestReturn(){ updateOrder(o=>{ o.status='Return Requested'; }); toast('Return/refund request submitted.'); }
</script>
</body>
</html>
