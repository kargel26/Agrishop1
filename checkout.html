<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — AgriMart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="checkout">

<div id="site-header"></div>

<main>
  <div class="container" style="max-width:840px;">
    <div class="breadcrumb"><a href="index.html">Home</a><span class="sep">/</span><a href="cart.html">Cart</a><span class="sep">/</span><span class="cur">Checkout</span></div>
    <div id="checkoutRoot"></div>
  </div>
</main>

<div id="site-footer"></div>

<script src="assets/data.js"></script>
<script src="assets/common.js"></script>
<script>
let checkoutStep = 1;
let selectedPayMethod = 'upi';

function initPage(){
  if(Object.keys(state.cart).length===0){
    document.getElementById('checkoutRoot').innerHTML = `<div class="empty-state"><div class="ic">🛒</div><h3>Your cart is empty</h3><p>Add products before checking out.</p><a href="shop.html" class="btn btn-primary" style="margin-top:16px;">Shop Now</a></div>`;
    return;
  }
  renderCheckout();
}

function renderCheckout(){
  const t = cartTotals();
  const steps = ['Address','Delivery','Summary','Payment'];
  document.getElementById('checkoutRoot').innerHTML = `
    <div class="step-track">
      ${steps.map((s,i)=>{
        const n=i+1; const cls = n<checkoutStep?'done':(n===checkoutStep?'active':'');
        return `<div class="step ${cls}"><div class="num">${n<checkoutStep?'✓':n}</div><div class="lbl">${s}</div></div>${i<steps.length-1?'<div class="connector"></div>':''}`;
      }).join('')}
    </div>
    <div id="checkoutBody">${checkoutStepBody(t)}</div>`;
}

function checkoutStepBody(t){
  t = t || cartTotals();
  if(checkoutStep===1){
    const addresses = state.addresses;
    return `
    <div class="panel-card">
      <h3>Select Delivery Address</h3>
      ${addresses.map(a=>`
        <label class="address-card ${state.selectedAddress===a.id?'selected':''}">
          <input type="radio" name="addr" ${state.selectedAddress===a.id?'checked':''} onchange="state.selectedAddress='${a.id}'; renderCheckout();">
          <div>
            <b>${a.name} ${a.isDefault?'· <span style=\"color:var(--success)\">Default</span>':''}</b>
            <p>${a.line}, ${a.village}, ${a.city}, ${a.district}, ${a.state} — ${a.pin}</p>
            <p>📞 ${a.phone}</p>
          </div>
        </label>
      `).join('')}
      <button class="btn btn-outline btn-sm" onclick="toggleNewAddrForm()" style="margin-top:8px;">+ Add New Address</button>
      <div id="newAddrForm" style="display:none;margin-top:16px;">
        <div class="form-grid">
          <div class="form-field"><label>Full Name</label><input id="af_name" placeholder="e.g. Ramesh Yadav"></div>
          <div class="form-field"><label>Mobile Number</label><input id="af_phone" placeholder="10-digit mobile number"></div>
          <div class="form-field full"><label>Address</label><input id="af_line" placeholder="House no., street, landmark"></div>
          <div class="form-field"><label>Village / Town</label><input id="af_village" placeholder="Village or town"></div>
          <div class="form-field"><label>City</label><input id="af_city" placeholder="City"></div>
          <div class="form-field"><label>District</label><input id="af_district" placeholder="District"></div>
          <div class="form-field"><label>State</label><input id="af_state" placeholder="State"></div>
          <div class="form-field"><label>PIN Code</label><input id="af_pin" placeholder="6-digit PIN code"></div>
        </div>
        <button class="btn btn-primary btn-sm" style="margin-top:12px;" onclick="saveNewAddress()">Save Address</button>
      </div>
      <button class="btn btn-primary" style="margin-top:20px;" onclick="checkoutNext()">Continue to Delivery</button>
    </div>`;
  }
  if(checkoutStep===2){
    const addr = state.addresses.find(a=>a.id===state.selectedAddress) || state.addresses[0];
    const days = new Date(); days.setDate(days.getDate()+4);
    return `
    <div class="panel-card">
      <h3>Delivery Details</h3>
      <div class="pd-info-box">📍 <div><b>Delivering to:</b> ${addr.name}, ${addr.city}, ${addr.state} — ${addr.pin}</div></div>
      <div class="pd-info-box">📅 <div><b>Estimated delivery:</b> ${days.toDateString()} (3–5 business days)</div></div>
      <div class="pd-info-box">🚚 <div><b>Delivery charges:</b> ${t.delivery===0?'FREE (order above ₹999)':fmt(t.delivery)}</div></div>
      <div style="display:flex;gap:10px;margin-top:20px;">
        <button class="btn btn-ghost" onclick="checkoutBack()">Back</button>
        <button class="btn btn-primary" onclick="checkoutNext()">Continue to Summary</button>
      </div>
    </div>`;
  }
  if(checkoutStep===3){
    const cart = state.cart;
    return `
    <div class="panel-card">
      <h3>Order Summary</h3>
      ${Object.keys(cart).map(id=>{ const p=byId(id); if(!p) return ''; const qty=cart[id]; return `
        <div class="cart-item"><img src="${p.img}"><div class="ci-info"><div class="ci-name">${p.name}</div><div class="ci-seller">Qty: ${qty} × ${fmt(p.price)}</div></div><div class="ci-price">${fmt(p.price*qty)}</div></div>`;
      }).join('')}
      <div class="summary-row"><span>Subtotal</span><span>${fmt(t.subtotal)}</span></div>
      ${t.couponCode?`<div class="summary-row"><span>Coupon (${t.couponCode})</span><span style="color:var(--success)">−${fmt(t.couponDiscount)}</span></div>`:''}
      <div class="summary-row"><span>Delivery</span><span>${t.delivery===0?'FREE':fmt(t.delivery)}</span></div>
      <div class="summary-row"><span>Taxes (GST)</span><span>${fmt(t.tax)}</span></div>
      <div class="summary-row total"><span>Total Amount</span><span>${fmt(t.total)}</span></div>
      <div style="display:flex;gap:10px;margin-top:20px;">
        <button class="btn btn-ghost" onclick="checkoutBack()">Back</button>
        <button class="btn btn-primary" onclick="checkoutNext()">Continue to Payment</button>
      </div>
    </div>`;
  }
  return `
  <div class="panel-card">
    <h3>Select Payment Method</h3>
    ${paymentMethodHTML()}
    <div class="summary-row total" style="margin-top:10px;"><span>Amount Payable</span><span>${fmt(t.total)}</span></div>
    <div style="display:flex;gap:10px;margin-top:20px;">
      <button class="btn btn-ghost" onclick="checkoutBack()">Back</button>
      <button class="btn btn-primary btn-block" onclick="openRazorpayMock()">Pay ${fmt(t.total)}</button>
    </div>
    <p class="muted center" style="font-size:11.5px;margin-top:14px;">🔒 Payments are securely processed by Razorpay. AgriMart never stores your card, UPI PIN or bank details.</p>
  </div>`;
}
function paymentMethodHTML(){
  const methods = [
    {id:'upi', label:'UPI (Google Pay, PhonePe, Paytm)', ic:'📱'},
    {id:'card', label:'Credit / Debit Card', ic:'💳'},
    {id:'netbanking', label:'Net Banking', ic:'🏦'},
    {id:'wallet', label:'Wallets', ic:'👛'},
  ];
  return methods.map(m=>`
    <div class="pay-method ${selectedPayMethod===m.id?'selected':''}" onclick="selectedPayMethod='${m.id}'; renderCheckout();">
      <div class="ic">${m.ic}</div><div><b style="font-size:13.5px;">${m.label}</b></div>
    </div>`).join('');
}
function checkoutNext(){ checkoutStep = Math.min(4, checkoutStep+1); renderCheckout(); }
function checkoutBack(){ checkoutStep = Math.max(1, checkoutStep-1); renderCheckout(); }
function toggleNewAddrForm(){ const el=document.getElementById('newAddrForm'); el.style.display = el.style.display==='none'?'block':'none'; }
function saveNewAddress(){
  const g = id=>document.getElementById(id).value.trim();
  const name=g('af_name'), phone=g('af_phone'), line=g('af_line'), village=g('af_village'), city=g('af_city'), district=g('af_district'), st=g('af_state'), pin=g('af_pin');
  if(!name||!phone||!line||!city||!st||!pin){ toast('Please fill all required address fields.','error'); return; }
  if(!/^\d{10}$/.test(phone)){ toast('Please enter a valid 10-digit mobile number.','error'); return; }
  if(!/^\d{6}$/.test(pin)){ toast('Please enter a valid 6-digit PIN code.','error'); return; }
  const addresses = state.addresses;
  const id = 'a'+(addresses.length+1);
  addresses.push({id, name, phone, line, village, city, district, state:st, pin, isDefault:false});
  state.addresses = addresses;
  state.selectedAddress = id;
  toast('Address saved successfully');
  renderCheckout();
}

/* ---------- Razorpay mock ---------- */
function openRazorpayMock(){
  const t = cartTotals();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay'; overlay.id = 'rzpOverlay';
  overlay.innerHTML = `
    <div class="rzp-mock">
      <div class="rzp-head">
        <div class="brand">🔒 Razorpay Secure Checkout</div>
        <div class="amt">${fmt(t.total)}</div>
        <div style="font-size:11.5px;opacity:.8;margin-top:4px;">AgriMart Technologies Pvt. Ltd.</div>
      </div>
      <div class="rzp-body">
        <div class="rzp-opt"><span>📱 UPI</span><span class="chev">›</span></div>
        <div class="rzp-opt"><span>💳 Cards</span><span class="chev">›</span></div>
        <div class="rzp-opt"><span>🏦 Netbanking</span><span class="chev">›</span></div>
        <div class="rzp-opt"><span>👛 Wallets</span><span class="chev">›</span></div>
        <p class="muted" style="font-size:12px;margin-top:14px;">This is a simulated payment window for demo purposes. Choose an outcome below to continue.</p>
        <div style="display:flex;gap:8px;margin-top:14px;">
          <button class="btn btn-primary btn-block btn-sm" onclick="resolveMockPayment(true)">Simulate Success</button>
          <button class="btn btn-ghost btn-block btn-sm" onclick="resolveMockPayment(false)">Simulate Failure</button>
        </div>
      </div>
      <div class="rzp-foot">Secured by Razorpay · PCI DSS Compliant</div>
    </div>`;
  document.body.appendChild(overlay);
}
function resolveMockPayment(success){
  document.getElementById('rzpOverlay').remove();
  if(!success){
    showModal('❌','Payment Failed','Your payment could not be completed. Please try again.', [
      {label:'Retry Payment', action:'openRazorpayMock()'},
      {label:'Choose Another Method', action:"checkoutStep=4; renderCheckout();"}
    ]);
    return;
  }
  const t = cartTotals();
  const orderId = 'AGM' + Math.floor(100000+Math.random()*900000);
  const cart = state.cart;
  const order = {
    id: orderId,
    date: new Date().toISOString(),
    items: Object.keys(cart).map(id=>({id, qty:cart[id], price:byId(id).price, name:byId(id).name, img:byId(id).img, seller:sellerName(byId(id).seller)})),
    address: state.addresses.find(a=>a.id===state.selectedAddress) || state.addresses[0],
    totals: t,
    paymentStatus: 'Paid',
    paymentMethod: selectedPayMethod,
    status: 'Confirmed',
    razorpayPaymentId: 'pay_' + Math.random().toString(36).slice(2,12),
  };
  const orders = state.orders; orders.unshift(order); state.orders = orders;
  state.cart = {};
  sessionStorage.removeItem('agrimart_coupon');
  checkoutStep = 1;
  updateBadges();
  showModal('✅','Payment Successful!', `Your order ${orderId} has been confirmed. A confirmation has been sent to your registered email.`, [
    {label:'View Order', action:`window.location.href='order.html?id=${orderId}'`},
    {label:'Continue Shopping', action:"window.location.href='shop.html'"}
  ]);
}
function showModal(icon,title,text,actions){
  const overlay = document.createElement('div');
  overlay.className='modal-overlay'; overlay.id='genericModal';
  overlay.innerHTML = `
    <div class="modal-box">
      <div class="ic-circle">${icon}</div>
      <h3>${title}</h3>
      <p>${text}</p>
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${actions.map((a,i)=>`<button class="btn ${i===0?'btn-primary':'btn-outline'} btn-block" onclick="document.getElementById('genericModal').remove(); ${a.action}">${a.label}</button>`).join('')}
      </div>
    </div>`;
  document.body.appendChild(overlay);
}
</script>
</body>
</html>
