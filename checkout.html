<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — AgriMart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="checkout">
<div id="site-header"></div>
<main><div class="container" style="max-width:840px;"><div class="breadcrumb"><a href="index.html">Home</a><span class="sep">/</span><a href="cart.html">Cart</a><span class="sep">/</span><span class="cur">Checkout</span></div><div id="checkoutRoot"></div></div></main>
<div id="site-footer"></div>
<script src="assets/data.js"></script>
<script src="assets/supabase-client.js"></script>
<script src="assets/common.js"></script>
<script src="assets/catalog-v2.js"></script>
<script src="assets/orders.js"></script>
<script>
let checkoutStep=1, selectedPayMethod='upi';
async function initPage(){
  await (window.AgriCatalog?.ready || Promise.resolve());
  const user=window.agriSupabase ? (await window.agriSupabase.auth.getUser()).data.user : null;
  if(!user){ document.getElementById('checkoutRoot').innerHTML='<div class="empty-state"><div class="ic">👤</div><h3>Please sign in</h3><p>You need an account before placing an order.</p><a href="login.html?next=checkout.html" class="btn btn-primary" style="margin-top:16px">Sign In</a></div>'; return; }
  if(Object.keys(state.cart).length===0){ document.getElementById('checkoutRoot').innerHTML='<div class="empty-state"><div class="ic">🛒</div><h3>Your cart is empty</h3><p>Add products before checking out.</p><a href="shop.html" class="btn btn-primary" style="margin-top:16px">Shop Now</a></div>'; return; }
  renderCheckout();
}
function renderCheckout(){const t=cartTotals();const steps=['Address','Delivery','Summary','Payment'];document.getElementById('checkoutRoot').innerHTML=`<div class="step-track">${steps.map((s,i)=>{const n=i+1,cls=n<checkoutStep?'done':n===checkoutStep?'active':'';return `<div class="step ${cls}"><div class="num">${n<checkoutStep?'✓':n}</div><div class="lbl">${s}</div></div>${i<3?'<div class="connector"></div>':''}`}).join('')}</div><div id="checkoutBody">${checkoutStepBody(t)}</div>`;}
function checkoutStepBody(t){
 if(checkoutStep===1){const addresses=state.addresses;return `<div class="panel-card"><h3>Select Delivery Address</h3>${addresses.map(a=>`<label class="address-card ${state.selectedAddress===a.id?'selected':''}"><input type="radio" name="addr" ${state.selectedAddress===a.id?'checked':''} onchange="state.selectedAddress='${a.id}';renderCheckout()"><div><b>${a.name} ${a.isDefault?'· <span style="color:var(--success)">Default</span>':''}</b><p>${a.line}, ${a.village||''}, ${a.city}, ${a.district||''}, ${a.state} — ${a.pin}</p><p>📞 ${a.phone}</p></div></label>`).join('')}<button class="btn btn-outline btn-sm" onclick="toggleNewAddrForm()" style="margin-top:8px">+ Add New Address</button><div id="newAddrForm" style="display:none;margin-top:16px"><div class="form-grid"><div class="form-field"><label>Full Name</label><input id="af_name"></div><div class="form-field"><label>Mobile Number</label><input id="af_phone"></div><div class="form-field full"><label>Address</label><input id="af_line"></div><div class="form-field"><label>Village / Town</label><input id="af_village"></div><div class="form-field"><label>City</label><input id="af_city"></div><div class="form-field"><label>District</label><input id="af_district"></div><div class="form-field"><label>State</label><input id="af_state"></div><div class="form-field"><label>PIN Code</label><input id="af_pin"></div></div><button class="btn btn-primary btn-sm" style="margin-top:12px" onclick="saveNewAddress()">Save Address</button></div><button class="btn btn-primary" style="margin-top:20px" onclick="checkoutNext()">Continue to Delivery</button></div>`;}
 if(checkoutStep===2){const addr=state.addresses.find(a=>a.id===state.selectedAddress)||state.addresses[0],days=new Date();days.setDate(days.getDate()+4);return `<div class="panel-card"><h3>Delivery Details</h3><div class="pd-info-box">📍 <div><b>Delivering to:</b> ${addr.name}, ${addr.city}, ${addr.state} — ${addr.pin}</div></div><div class="pd-info-box">📅 <div><b>Estimated delivery:</b> ${days.toDateString()} (3–5 business days)</div></div><div class="pd-info-box">🚚 <div><b>Delivery charges:</b> ${t.delivery===0?'FREE (order above ₹999)':fmt(t.delivery)}</div></div><div style="display:flex;gap:10px;margin-top:20px"><button class="btn btn-ghost" onclick="checkoutBack()">Back</button><button class="btn btn-primary" onclick="checkoutNext()">Continue to Summary</button></div></div>`;}
 if(checkoutStep===3){return `<div class="panel-card"><h3>Order Summary</h3>${Object.keys(state.cart).map(id=>{const p=byId(id);if(!p)return '';const q=state.cart[id];return `<div class="cart-item"><img src="${p.img}"><div class="ci-info"><div class="ci-name">${p.name}</div><div class="ci-seller">Qty: ${q} × ${fmt(p.price)}</div></div><div class="ci-price">${fmt(p.price*q)}</div></div>`}).join('')}<div class="summary-row"><span>Subtotal</span><span>${fmt(t.subtotal)}</span></div>${t.couponCode?`<div class="summary-row"><span>Coupon (${t.couponCode})</span><span style="color:var(--success)">−${fmt(t.couponDiscount)}</span></div>`:''}<div class="summary-row"><span>Delivery</span><span>${t.delivery===0?'FREE':fmt(t.delivery)}</span></div><div class="summary-row"><span>Taxes (GST)</span><span>${fmt(t.tax)}</span></div><div class="summary-row total"><span>Total Amount</span><span>${fmt(t.total)}</span></div><div style="display:flex;gap:10px;margin-top:20px"><button class="btn btn-ghost" onclick="checkoutBack()">Back</button><button class="btn btn-primary" onclick="checkoutNext()">Continue to Payment</button></div></div>`;}
 return `<div class="panel-card"><h3>Select Payment Method</h3>${paymentMethodHTML()}<div class="summary-row total" style="margin-top:10px"><span>Amount Payable</span><span>${fmt(t.total)}</span></div><div style="display:flex;gap:10px;margin-top:20px"><button class="btn btn-ghost" onclick="checkoutBack()">Back</button><button class="btn btn-primary btn-block" onclick="placeOrder()">Continue to Payment</button></div><p class="muted center" style="font-size:11.5px;margin-top:14px">🔒 Payment will be connected to Razorpay in the next phase.</p></div>`;
}
function paymentMethodHTML(){return [{id:'upi',label:'UPI (Google Pay, PhonePe, Paytm)',ic:'📱'},{id:'card',label:'Credit / Debit Card',ic:'💳'},{id:'netbanking',label:'Net Banking',ic:'🏦'},{id:'wallet',label:'Wallets',ic:'👛'}].map(m=>`<div class="pay-method ${selectedPayMethod===m.id?'selected':''}" onclick="selectedPayMethod='${m.id}';renderCheckout()"><div class="ic">${m.ic}</div><div><b style="font-size:13.5px">${m.label}</b></div></div>`).join('');}
function checkoutNext(){if(checkoutStep===1&&!state.selectedAddress){toast('Please select an address.','error');return;}checkoutStep=Math.min(4,checkoutStep+1);renderCheckout();}
function checkoutBack(){checkoutStep=Math.max(1,checkoutStep-1);renderCheckout();}
function toggleNewAddrForm(){const el=document.getElementById('newAddrForm');el.style.display=el.style.display==='none'?'block':'none';}
async function saveNewAddress(){try{const g=id=>document.getElementById(id).value.trim(),name=g('af_name'),phone=g('af_phone'),line=g('af_line'),village=g('af_village'),city=g('af_city'),district=g('af_district'),st=g('af_state'),pin=g('af_pin');if(!name||!phone||!line||!city||!st||!pin){toast('Please fill all required address fields.','error');return;}if(!/^\d{10}$/.test(phone)||!/^\d{6}$/.test(pin)){toast('Please enter valid mobile and PIN.','error');return;}const user=(await window.agriSupabase.auth.getUser()).data.user;const saved=await AgriOrders.saveAddress(user.id,{name,phone,line,village,city,district,state:st,pin,isDefault:false});state.addresses=[...state.addresses,{id:saved.id,name,phone,line,village,city,district,state:st,pin,isDefault:false}];state.selectedAddress=saved.id;toast('Address saved successfully');renderCheckout();}catch(e){console.error(e);toast('Could not save address: '+e.message,'error');}}
async function placeOrder(){try{const result=await AgriOrders.createOrder();const local=state.orders;local.unshift({id:result.order.order_number,date:result.order.created_at,items:result.orderItems.map(x=>({id:x.product_id,qty:x.quantity,price:x.unit_price,name:x.product_name})),address:state.addresses.find(a=>a.id===state.selectedAddress),totals:cartTotals(),paymentStatus:'Pending',paymentMethod:selectedPayMethod,status:'Pending',supabaseOrderId:result.order.id});state.orders=local;state.cart={};updateBadges();showModal('✅','Order Created',`Your order ${result.order.order_number} has been created and is awaiting payment.`,[{label:'View Order',action:`window.location.href='order.html?id=${result.order.order_number}'`},{label:'Continue Shopping',action:"window.location.href='shop.html'"}]);}catch(e){console.error(e);toast(e.message||'Could not create order.','error');}}
function showModal(icon,title,text,actions){const o=document.createElement('div');o.className='modal-overlay';o.id='genericModal';o.innerHTML=`<div class="modal-box"><div class="ic-circle">${icon}</div><h3>${title}</h3><p>${text}</p><div style="display:flex;flex-direction:column;gap:8px">${actions.map((a,i)=>`<button class="btn ${i===0?'btn-primary':'btn-outline'} btn-block" onclick="document.getElementById('genericModal').remove();${a.action}">${a.label}</button>`).join('')}</div></div>`;document.body.appendChild(o);}
</script>
</body>
</html>
