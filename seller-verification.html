<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller Verification — AgriMart</title><link rel="stylesheet" href="assets/style.css"></head><body data-page="account"><div id="site-header"></div><main><div class="container"><div class="auth-wrap"><h2>Seller Verification</h2><p class="muted" style="margin:8px 0 22px">Submit your business details for admin approval.</p><div class="form-field full"><label>Business Name</label><input id="business" required></div><div class="form-field full" style="margin-top:12px"><label>Phone</label><input id="phone" type="tel"></div><div class="form-field full" style="margin-top:12px"><label>Business Address</label><textarea id="address" rows="3"></textarea></div><button class="btn btn-primary btn-block" style="margin-top:18px" onclick="apply()" id="btn">Submit for Verification</button><p id="msg" class="muted center" style="margin-top:14px"></p><p class="center" style="margin-top:18px;font-size:13px"><a href="seller-login.html">Seller Login</a></p></div></div></main><div id="site-footer"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/data.js"></script><script src="assets/common.js"></script><script src="assets/supabase-client.js"></script><script src="assets/auth.js"></script><script>async function initPage(){const u=await AgriAuth.getCurrentUser();if(!u)location.replace('login.html?next=seller-verification.html');else{const {data:a}=await agriSupabase.from('seller_applications').select('business_name,phone,address,status').eq('user_id',u.id).maybeSingle();if(a){document.getElementById('business').value=a.business_name||'';document.getElementById('phone').value=a.phone||'';document.getElementById('address').value=a.address||'';document.getElementById('msg').textContent='Application status: '+a.status+'.';if(a.status==='approved')document.getElementById('btn').disabled=true;}}}async function apply(){const msg=document.getElementById('msg'),btn=document.getElementById('btn');btn.disabled=true;try{const u=await AgriAuth.getCurrentUser();if(!u)throw new Error('Please sign in first.');const business=document.getElementById('business').value.trim(),phone=document.getElementById('phone').value.trim(),address=document.getElementById('address').value.trim();if(!business)throw new Error('Business name is required.');const {data:existing,error:findError}=await agriSupabase.from('seller_applications').select('id,status').eq('user_id',u.id).maybeSingle();if(findError)throw findError;if(existing){if(existing.status==='rejected'){const {error}=await agriSupabase.from('seller_applications').update({business_name:business,phone,address,status:'pending',reviewed_by:null,reviewed_at:null}).eq('id',existing.id);if(error)throw error;msg.textContent='Application resubmitted. Admin approval is required.';}else msg.textContent='Your seller application status: '+existing.status+'.';return;}const {error}=await agriSupabase.from('seller_applications').insert({user_id:u.id,business_name:business,phone,address,documents:[],status:'pending'});if(error)throw error;msg.textContent='Application submitted successfully. Admin verification is required before Seller Login.';}catch(e){msg.textContent=e.message||'Unable to submit application.';}finally{btn.disabled=false;}}</script></body></html>
