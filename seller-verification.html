<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller Verification — AgriMart</title><link rel="stylesheet" href="assets/style.css"></head><body data-page="account"><div id="site-header"></div><main><div class="container"><div class="auth-wrap"><h2>Seller Verification</h2><p class="muted" style="margin:8px 0 22px">Submit your business details for admin approval.</p><div class="form-field full"><label>Business Name</label><input id="business" required></div><div class="form-field full" style="margin-top:12px"><label>Location</label><input id="location" required></div><button class="btn btn-primary btn-block" style="margin-top:18px" onclick="apply()" id="btn">Submit for Verification</button><p id="msg" class="muted center" style="margin-top:14px"></p><p class="center" style="margin-top:18px;font-size:13px"><a href="seller-login.html">Seller Login</a></p></div></div></main><div id="site-footer"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/data.js"></script><script src="assets/common.js"></script><script src="assets/supabase-client.js"></script><script src="assets/auth.js"></script><script>async function initPage(){const u=await AgriAuth.getCurrentUser();if(!u)location.replace('login.html?next=seller-verification.html');}async function apply(){const msg=document.getElementById('msg'),btn=document.getElementById('btn');btn.disabled=true;try{const u=await AgriAuth.getCurrentUser();if(!u)throw new Error('Please sign in first.');const business=document.getElementById('business').value.trim(),locationName=document.getElementById('location').value.trim();if(!business||!locationName)throw new Error('Business name and location are required.');const {data:existing}=await agriSupabase.from('sellers').select('id,status').eq('user_id',u.id).maybeSingle();if(existing){msg.textContent='Your seller application already exists with status: '+existing.status+'.';return;}const {error}=await agriSupabase.from('sellers').insert({user_id:u.id,business_name:business,location:locationName,verified:false,status:'pending'});if(error)throw error;msg.textContent='Application submitted. Admin verification is required before Seller Login.';}catch(e){msg.textContent=e.message||'Unable to submit application.';}finally{btn.disabled=false;}}</script></body></html>
