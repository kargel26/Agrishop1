<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seller Dashboard — AgriMart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="seller">

<div id="site-header"></div>

<main>
  <div class="container">
    <div class="breadcrumb"><a href="index.html">Home</a><span class="sep">/</span><span class="cur">Seller Dashboard</span></div>
    <div class="dash-layout">
      <aside class="dash-side" id="sellerMenu"></aside>
      <div id="sellerContent"></div>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="assets/data.js"></script>
<script src="assets/common.js"></script>
<script>
const SELLER_MENU = ['Dashboard','Products','Add Product','Orders','Customers','Reviews','Sales Analytics','Earnings','Profile'];
let sellerTab = 'dashboard';
function slug(s){ return s.toLowerCase().replace(/ /g,'-'); }
function initPage(){
  document.getElementById('sellerMenu').innerHTML = SELLER_MENU.map(m=>
    `<a href="#" data-tab="${slug(m)}" class="${sellerTab===slug(m)?'active':''}" onclick="setSellerTab('${slug(m)}');return false;">${m}</a>`).join('');
  renderSellerContent();
}
function setSellerTab(t){
  sellerTab = t;
  document.querySelectorAll('#sellerMenu a').forEach(a=>a.classList.toggle('active', a.dataset.tab===t));
  renderSellerContent();
}
function renderSellerContent(){ document.getElementById('sellerContent').innerHTML = sellerContent(); }
function sellerContent(){
  const myProducts = PRODUCTS.filter(p=>p.seller==='s1');
  const orders = state.orders;
  if(sellerTab==='products'){
    return `<div class="panel-card"><h3>My Products</h3><table class="data-table"><tr><th>Product</th><th>Price</th><th>Stock</th><th>Rating</th><th>Actions</th></tr>
    ${myProducts.map(p=>`<tr><td>${p.name}</td><td>${fmt(p.price)}</td><td>${p.stock}</td><td>${p.rating} ★</td><td><button class="btn btn-outline btn-sm" onclick="toast('Edit form would open here.')">Edit</button></td></tr>`).join('')}
    </table></div>`;
  }
  if(sellerTab==='add-product'){
    return `<div class="panel-card"><h3>Add New Product</h3>
    <div class="form-grid">
      <div class="form-field full"><label>Product Name</label><input placeholder="e.g. Hybrid Maize Seeds 5kg"></div>
      <div class="form-field"><label>Category</label><select>${CATEGORIES.map(c=>`<option>${c.name}</option>`).join('')}</select></div>
      <div class="form-field"><label>Brand</label><input placeholder="Brand name"></div>
      <div class="form-field"><label>Price (₹)</label><input type="number" placeholder="0.00"></div>
      <div class="form-field"><label>MRP (₹)</label><input type="number" placeholder="0.00"></div>
      <div class="form-field"><label>Stock Quantity</label><input type="number" placeholder="0"></div>
      <div class="form-field"><label>Pack Size</label><input placeholder="e.g. 5kg"></div>
      <div class="form-field full"><label>Description</label><textarea rows="3" placeholder="Product description"></textarea></div>
      <div class="form-field full"><label>Product Images</label><input type="file" multiple></div>
    </div>
    <button class="btn btn-primary" style="margin-top:16px;" onclick="toast('Product submitted for review.')">Submit Product</button>
    </div>`;
  }
  if(sellerTab==='orders'){
    return `<div class="panel-card"><h3>Orders</h3>
    ${orders.length===0?`<p class="muted">No orders yet.</p>`:`
    <table class="data-table"><tr><th>Order ID</th><th>Customer</th><th>Items</th><th>Amount</th><th>Status</th></tr>
    ${orders.map(o=>`<tr><td>${o.id}</td><td>${o.address.name}</td><td>${o.items.length}</td><td>${fmt(o.totals.total)}</td><td><span class="status-chip chip-${o.status.toLowerCase().replace(/ /g,'-')}">${o.status}</span></td></tr>`).join('')}
    </table>`}
    </div>`;
  }
  if(sellerTab==='customers'){
    return `<div class="panel-card"><h3>Customers</h3><p class="muted">Customers who purchased your products will appear here.</p></div>`;
  }
  if(sellerTab==='reviews'){
    return `<div class="panel-card"><h3>Customer Reviews</h3>${REVIEWS_HOME.map(r=>`<div style="padding:10px 0;border-bottom:1px solid var(--line);"><b>${r.name}</b> — <span class="stars">${stars(r.rating)}</span><p class="muted" style="font-size:13px;">${r.text}</p></div>`).join('')}</div>`;
  }
  if(sellerTab==='sales-analytics'){
    return `<div class="panel-card"><h3>Sales Analytics</h3>${barsChart([4,7,5,9,12,8,14],['Mon','Tue','Wed','Thu','Fri','Sat','Sun'])}</div>`;
  }
  if(sellerTab==='earnings'){
    const gross = orders.reduce((a,o)=>a+o.totals.total,0);
    return `<div class="panel-card"><h3>Earnings</h3>
    <div class="summary-row"><span>Gross Sales</span><span>${fmt(gross)}</span></div>
    <div class="summary-row"><span>Platform Commission (8%)</span><span>−${fmt(Math.round(gross*0.08))}</span></div>
    <div class="summary-row total"><span>Net Payout</span><span>${fmt(Math.round(gross*0.92))}</span></div>
    </div>`;
  }
  if(sellerTab==='profile'){
    return `<div class="panel-card"><h3>Seller Profile</h3>
    <div class="form-grid">
      <div class="form-field"><label>Business Name</label><input value="Krishna AgroTraders"></div>
      <div class="form-field"><label>Phone</label><input value="${CONTACT.phone}"></div>
      <div class="form-field full"><label>Business Address</label><input value="${CONTACT.address}"></div>
      <div class="form-field full"><label>Description</label><textarea rows="3">Trusted supplier of seeds, tools and crop protection products since 2014.</textarea></div>
    </div>
    <button class="btn btn-primary btn-sm" style="margin-top:16px;" onclick="toast('Profile updated.')">Save Profile</button>
    </div>`;
  }
  const revenue = myProducts.reduce((a,p)=>a+p.price*3,0);
  return `
  <div class="stat-grid">
    <div class="stat-card"><div class="top"><div class="ic">📦</div></div><div class="val">${myProducts.length}</div><div class="lbl">Total Products</div></div>
    <div class="stat-card"><div class="top"><div class="ic">🧾</div></div><div class="val">${orders.length}</div><div class="lbl">Total Orders</div></div>
    <div class="stat-card"><div class="top"><div class="ic">💰</div></div><div class="val">${fmt(revenue)}</div><div class="lbl">Total Sales (est.)</div></div>
    <div class="stat-card"><div class="top"><div class="ic">⏳</div></div><div class="val">${orders.filter(o=>o.status!=='Delivered').length}</div><div class="lbl">Pending Orders</div></div>
  </div>
  <div class="panel-card mt24"><h3>Weekly Sales</h3>${barsChart([4,7,5,9,12,8,14],['Mon','Tue','Wed','Thu','Fri','Sat','Sun'])}</div>
  <div class="panel-card"><h3>My Products</h3>
  <table class="data-table"><tr><th>Product</th><th>Price</th><th>Stock</th></tr>
  ${myProducts.slice(0,5).map(p=>`<tr><td>${p.name}</td><td>${fmt(p.price)}</td><td>${p.stock<15?`<span style="color:var(--danger)">${p.stock} (Low)</span>`:p.stock}</td></tr>`).join('')}
  </table></div>`;
}
</script>
</body>
</html>
