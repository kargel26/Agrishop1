<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller Dashboard — AgriMart</title><link rel="stylesheet" href="assets/style.css"></head><body data-page="seller"><div id="site-header"></div><main><div class="container"><div class="breadcrumb"><a href="index.html">Home</a><span class="sep">/</span><span class="cur">Seller Dashboard</span></div><div class="dash-layout"><aside class="dash-side" id="menu"></aside><div id="content"><p class="muted">Loading seller dashboard…</p></div></div></div></main><div id="site-footer"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/data.js"></script><script src="assets/common.js"></script><script src="assets/supabase-client.js"></script><script src="assets/auth.js"></script><script>
let seller,profile,tab='dashboard',products=[],items=[],payments=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]));const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');
async function initPage(){try{const auth=await AgriAuth.requireRole(['seller']);if(!auth)return;profile=auth.profile;const {data:s,error}=await agriSupabase.from('sellers').select('*').eq('user_id',auth.user.id).maybeSingle();if(error)throw error;seller=s;if(!seller||seller.status!=='approved'||seller.verified!==true){location.replace('seller-verification.html');return;}await load();render();}catch(e){document.getElementById('content').innerHTML='<div class="panel-card"><h3>Seller dashboard unavailable</h3><p class="muted">'+esc(e.message)+'</p></div>';}}
async function load(){const sid=seller.id;let r=await agriSupabase.from('products').select('id,name,brand,price,mrp,stock,rating,review_count,is_active,created_at').eq('seller_id',sid).order('created_at',{ascending:false});if(r.error)throw r.error;products=r.data||[];r=await agriSupabase.from('order_items').select('id,order_id,product_id,product_name,unit_price,quantity,line_total,created_at').eq('seller_id',sid).order('created_at',{ascending:false});if(r.error)throw r.error;items=r.data||[];const orderIds=[...new Set(items.map(x=>x.order_id))];payments=[];if(orderIds.length){r=await agriSupabase.from('payments').select('id,order_id,amount,status,method,provider,razorpay_payment_id,created_at,paid_at').in('order_id',orderIds);if(!r.error)payments=r.data||[];}}
function nav(){return ['Dashboard','Products','Orders','Payments','Profile'].map(x=>`<a href="#" class="${tab===x.toLowerCase()?'active':''}" onclick="tab='${x.toLowerCase()}';render();return false">${x}</a>`).join('')}
function render(){document.getElementById('menu').innerHTML=nav();const c=document.getElementById('content');if(tab==='products')return c.innerHTML=productsView();if(tab==='orders')return c.innerHTML=ordersView();if(tab==='payments')return c.innerHTML=paymentsView();if(tab==='profile')return c.innerHTML=profileView();c.innerHTML=dashboardView();}
function dashboardView(){const sales=items.reduce((a,x)=>a+Number(x.line_total||0),0);return `<div class="stat-grid"><div class="stat-card"><div class="val">${products.length}</div><div class="lbl">My Products</div></div><div class="stat-card"><div class="val">${new Set(items.map(x=>x.order_id)).size}</div><div class="lbl">Orders</div></div><div class="stat-card"><div class="val">${money(sales)}</div><div class="lbl">Gross Sales</div></div><div class="stat-card"><div class="val">${products.filter(x=>Number(x.stock)<=10).length}</div><div class="lbl">Low Stock</div></div></div><div class="panel-card mt24"><h3>Seller Account</h3><p><b>${esc(seller.business_name)}</b></p><p class="muted">${esc(seller.location||'')} · Verification: Approved</p></div>`}
function productsView(){return `<div class="panel-card"><div style="display:flex;justify-content:space-between;align-items:center"><h3>My Products</h3><span class="muted">${products.length} products</span></div><div style="overflow:auto"><table class="data-table"><tr><th>Product</th><th>Price</th><th>Stock</th><th>Status</th></tr>${products.length?products.map(p=>`<tr><td>${esc(p.name)}</td><td>${money(p.price)}</td><td>${p.stock}</td><td>${p.is_active?'Active':'Inactive'}</td></tr>`).join(''):'<tr><td colspan="4">No products yet.</td></tr>'}</table></div></div>`}
function ordersView(){const grouped={};items.forEach(x=>{if(!grouped[x.order_id])grouped[x.order_id]=[];grouped[x.order_id].push(x)});const rows=Object.entries(grouped);return `<div class="panel-card"><h3>Orders</h3><div style="overflow:auto"><table class="data-table"><tr><th>Order ID</th><th>Items</th><th>Amount</th><th>Payment</th></tr>${rows.length?rows.map(([id,arr])=>{const total=arr.reduce((a,x)=>a+Number(x.line_total||0),0),pay=payments.find(p=>p.order_id===id);return `<tr><td>${esc(id)}</td><td>${arr.map(x=>esc(x.product_name)+' × '+x.quantity).join('<br>')}</td><td>${money(total)}</td><td>${esc(pay?.status||'Not recorded')}</td></tr>`}).join(''):'<tr><td colspan="4">No orders for your products.</td></tr>'}</table></div></div>`}
function paymentsView(){return `<div class="panel-card"><h3>Payments</h3><div style="overflow:auto"><table class="data-table"><tr><th>Order</th><th>Amount</th><th>Status</th><th>Method</th><th>Payment ID</th></tr>${payments.length?payments.map(p=>`<tr><td>${esc(p.order_id)}</td><td>${money(p.amount)}</td><td>${esc(p.status)}</td><td>${esc(p.method||p.provider||'—')}</td><td>${esc(p.razorpay_payment_id||'—')}</td></tr>`).join(''):'<tr><td colspan="5">No payments recorded for your orders.</td></tr>'}</table></div></div>`}
function profileView(){return `<div class="panel-card"><h3>Seller Profile</h3><div class="form-grid"><div class="form-field"><label>Business Name</label><input value="${esc(seller.business_name)}" disabled></div><div class="form-field"><label>Location</label><input value="${esc(seller.location||'')}" disabled></div><div class="form-field"><label>Verification</label><input value="Approved" disabled></div><div class="form-field"><label>Seller ID</label><input value="${esc(seller.id)}" disabled></div></div><p class="muted" style="margin-top:16px">Seller profile changes are controlled through the verification process.</p></div>`}
</script></body></html>
