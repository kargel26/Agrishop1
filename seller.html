<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller Dashboard — AgriMart</title><link rel="stylesheet" href="assets/style.css"><style>.seller-tools{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.data-table img{width:48px;height:48px;object-fit:cover;border-radius:8px}.status-select{padding:7px;border:1px solid #ddd;border-radius:8px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:99;padding:16px}.modal.open{display:flex}.modal-card{background:#fff;border-radius:16px;padding:22px;max-width:720px;width:100%;max-height:90vh;overflow:auto}.modal-card h3{margin-top:0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form-field.full{grid-column:1/-1}.form-field label{display:block;font-weight:600;margin-bottom:6px}.form-field input,.form-field textarea,.form-field select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d8ddd0;border-radius:9px}.form-field textarea{min-height:90px;resize:vertical}@media(max-width:700px){.form-grid{grid-template-columns:1fr}.form-field.full{grid-column:auto}}</style></head><body data-page="seller"><div id="site-header"></div><main><div class="container"><div class="breadcrumb"><a href="index.html">Home</a><span class="sep">/</span><span class="cur">Seller Dashboard</span></div><div class="dash-layout"><aside class="dash-side" id="menu"></aside><div id="content"><p class="muted">Loading seller dashboard…</p></div></div></div></main><div id="site-footer"></div><div class="modal" id="productModal"><div class="modal-card"><h3 id="modalTitle">Add Product</h3><form id="productForm"><input type="hidden" id="productId"><div class="form-grid"><div class="form-field full"><label>Product Name *</label><input id="pName" required></div><div class="form-field"><label>Brand</label><input id="pBrand"></div><div class="form-field"><label>Category *</label><select id="pCategory" required></select></div><div class="form-field"><label>Price (₹) *</label><input id="pPrice" type="number" min="0" step="0.01" required></div><div class="form-field"><label>MRP (₹)</label><input id="pMrp" type="number" min="0" step="0.01"></div><div class="form-field"><label>Stock *</label><input id="pStock" type="number" min="0" step="1" required></div><div class="form-field"><label>Badge</label><input id="pBadge" placeholder="New / Bestseller"></div><div class="form-field full"><label>Image URL *</label><input id="pImage" type="url" placeholder="https://…" required></div><div class="form-field full"><label>Description</label><textarea id="pDescription"></textarea></div><div class="form-field full"><label>Usage</label><textarea id="pUsage"></textarea></div></div><div class="seller-tools"><button class="btn btn-primary" type="submit">Save Product</button><button class="btn btn-ghost" type="button" onclick="closeProduct()">Cancel</button></div><p id="productMsg" class="muted"></p></form></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/data.js"></script><script src="assets/common.js"></script><script src="assets/supabase-client.js"></script><script src="assets/auth.js"></script><script>
let seller,profile,tab='dashboard',products=[],items=[],payments=[],statuses=[],categories=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');
async function initPage(){try{const auth=await AgriAuth.requireRole(['seller']);if(!auth)return;profile=auth.profile;const {data:s,error}=await agriSupabase.from('sellers').select('*').eq('user_id',auth.user.id).maybeSingle();if(error)throw error;seller=s;if(!seller||seller.status!=='approved'||seller.verified!==true){location.replace('seller-verification.html');return;}await load();render();}catch(e){document.getElementById('content').innerHTML='<div class="panel-card"><h3>Seller dashboard unavailable</h3><p class="muted">'+esc(e.message)+'</p></div>';}}
async function load(){const sid=seller.id;let r=await agriSupabase.from('categories').select('id,name').order('name');if(!r.error)categories=r.data||[];r=await agriSupabase.from('products').select('id,category_id,name,brand,description,usage,price,mrp,stock,image_url,badge,rating,review_count,is_active,created_at').eq('seller_id',sid).order('created_at',{ascending:false});if(r.error)throw r.error;products=r.data||[];r=await agriSupabase.from('order_items').select('id,order_id,product_id,product_name,unit_price,quantity,line_total,created_at').eq('seller_id',sid).order('created_at',{ascending:false});if(r.error)throw r.error;items=r.data||[];const ids=[...new Set(items.map(x=>x.order_id))];payments=[];if(ids.length){r=await agriSupabase.from('payments').select('id,order_id,amount,status,method,provider,razorpay_payment_id,created_at,paid_at').in('order_id',ids);if(!r.error)payments=r.data||[];r=await agriSupabase.from('seller_order_status').select('order_id,status,note,updated_at').eq('seller_id',sid).in('order_id',ids);if(!r.error)statuses=r.data||[];}}
function nav(){return ['Dashboard','Products','Orders','Payments','Profile'].map(x=>`<a href="#" class="${tab===x.toLowerCase()?'active':''}" onclick="tab='${x.toLowerCase()}';render();return false">${x}</a>`).join('')}
function render(){document.getElementById('menu').innerHTML=nav();const c=document.getElementById('content');if(tab==='products')return c.innerHTML=productsView();if(tab==='orders')return c.innerHTML=ordersView();if(tab==='payments')return c.innerHTML=paymentsView();if(tab==='profile')return c.innerHTML=profileView();c.innerHTML=dashboardView();}
function dashboardView(){const sales=items.reduce((a,x)=>a+Number(x.line_total||0),0),orders=new Set(items.map(x=>x.order_id)).size;return `<div class="stat-grid"><div class="stat-card"><div class="val">${products.length}</div><div class="lbl">My Products</div></div><div class="stat-card"><div class="val">${orders}</div><div class="lbl">Orders</div></div><div class="stat-card"><div class="val">${money(sales)}</div><div class="lbl">Gross Sales</div></div><div class="stat-card"><div class="val">${products.filter(x=>Number(x.stock)<=10).length}</div><div class="lbl">Low Stock</div></div></div><div class="panel-card mt24"><h3>${esc(seller.business_name)}</h3><p class="muted">${esc(seller.location||'')} · ✓ Verified & Approved</p><div class="seller-tools"><button class="btn btn-primary" onclick="tab='products';render();setTimeout(openAddProduct,0)">+ Add Product</button><button class="btn btn-outline" onclick="tab='orders';render()">Track Orders</button></div></div>`}
function productsView(){return `<div class="panel-card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div><h3>My Products</h3><span class="muted">${products.length} products</span></div><button class="btn btn-primary" onclick="openAddProduct()">+ Add Product</button></div><div style="overflow:auto"><table class="data-table"><tr><th>Image</th><th>Product</th><th>Price/MRP</th><th>Stock</th><th>Status</th><th>Actions</th></tr>${products.length?products.map(p=>`<tr><td><img src="${esc(p.image_url)}" alt=""></td><td><b>${esc(p.name)}</b><br><span class="muted">${esc(p.brand||'')}</span></td><td>${money(p.price)}<br><del class="muted">${money(p.mrp)}</del></td><td>${p.stock}</td><td>${p.is_active?'Active':'Inactive'}</td><td><button class="btn btn-outline" onclick="editProduct('${p.id}')">Edit</button> <button class="btn btn-ghost" onclick="toggleProduct('${p.id}',${!p.is_active})">${p.is_active?'Hide':'Publish'}</button> <button class="btn btn-ghost" onclick="deleteProduct('${p.id}')">Delete</button></td></tr>`).join(''):'<tr><td colspan="6">No products yet. Add your first product.</td></tr>'}</table></div></div>`}
function ordersView(){const grouped={};items.forEach(x=>{(grouped[x.order_id]??=[]).push(x)});const rows=Object.entries(grouped);return `<div class="panel-card"><div style="display:flex;justify-content:space-between;align-items:center"><h3>Order Tracking</h3><span class="muted">${rows.length} orders</span></div><div style="overflow:auto"><table class="data-table"><tr><th>Order</th><th>Items</th><th>Amount</th><th>Payment</th><th>Seller Status</th><th>Update</th></tr>${rows.length?rows.map(([id,arr])=>{const total=arr.reduce((a,x)=>a+Number(x.line_total||0),0),pay=payments.find(p=>p.order_id===id),st=statuses.find(x=>x.order_id===id);return `<tr><td><b>${esc(id.slice(0,8))}…</b></td><td>${arr.map(x=>esc(x.product_name)+' × '+x.quantity).join('<br>')}</td><td>${money(total)}</td><td>${esc(pay?.status||'Not recorded')}</td><td><b>${esc(st?.status||'pending')}</b>${st?.note?'<br><span class="muted">'+esc(st.note)+'</span>':''}</td><td><select class="status-select" onchange="updateOrderStatus('${id}',this.value)"><option value="pending">Pending</option><option value="confirmed">Confirmed</option><option value="processing">Processing</option><option value="shipped">Shipped</option><option value="delivered">Delivered</option><option value="cancelled">Cancelled</option></select></td></tr>`}).join(''):'<tr><td colspan="6">No orders for your products.</td></tr>'}</table></div></div>`}
function paymentsView(){return `<div class="panel-card"><h3>Payments</h3><div style="overflow:auto"><table class="data-table"><tr><th>Order</th><th>Amount</th><th>Status</th><th>Method</th><th>Payment ID</th></tr>${payments.length?payments.map(p=>`<tr><td>${esc(p.order_id)}</td><td>${money(p.amount)}</td><td>${esc(p.status)}</td><td>${esc(p.method||p.provider||'—')}</td><td>${esc(p.razorpay_payment_id||'—')}</td></tr>`).join(''):'<tr><td colspan="5">No payments recorded.</td></tr>'}</table></div></div>`}
function profileView(){return `<div class="panel-card"><h3>Seller Profile</h3><div class="form-grid"><div class="form-field"><label>Business Name</label><input value="${esc(seller.business_name)}" disabled></div><div class="form-field"><label>Location</label><input value="${esc(seller.location||'')}" disabled></div><div class="form-field"><label>Verification</label><input value="Approved / Verified" disabled></div><div class="form-field"><label>Seller ID</label><input value="${esc(seller.id)}" disabled></div></div><p class="muted">Business verification details are controlled through the seller application process.</p></div>`}
function openAddProduct(){document.getElementById('modalTitle').textContent='Add Product';document.getElementById('productId').value='';['pName','pBrand','pPrice','pMrp','pStock','pImage','pBadge','pDescription','pUsage'].forEach(id=>document.getElementById(id).value='');fillCategories();document.getElementById('productModal').classList.add('open')}
function fillCategories(selected=''){document.getElementById('pCategory').innerHTML='<option value="">Select category</option>'+categories.map(c=>`<option value="${c.id}" ${c.id===selected?'selected':''}>${esc(c.name)}</option>`).join('')}
function closeProduct(){document.getElementById('productModal').classList.remove('open')}
function editProduct(id){const p=products.find(x=>x.id===id);if(!p)return;document.getElementById('modalTitle').textContent='Edit Product';document.getElementById('productId').value=p.id;document.getElementById('pName').value=p.name||'';document.getElementById('pBrand').value=p.brand||'';document.getElementById('pPrice').value=p.price??'';document.getElementById('pMrp').value=p.mrp??'';document.getElementById('pStock').value=p.stock??0;document.getElementById('pImage').value=p.image_url||'';document.getElementById('pBadge').value=p.badge||'';document.getElementById('pDescription').value=p.description||'';document.getElementById('pUsage').value=p.usage||'';fillCategories(p.category_id||'');document.getElementById('productModal').classList.add('open')}
async function saveProduct(e){e.preventDefault();const id=document.getElementById('productId').value;const row={seller_id:seller.id,category_id:document.getElementById('pCategory').value,name:document.getElementById('pName').value.trim(),brand:document.getElementById('pBrand').value.trim()||null,description:document.getElementById('pDescription').value.trim()||null,usage:document.getElementById('pUsage').value.trim()||null,price:Number(document.getElementById('pPrice').value),mrp:Number(document.getElementById('pMrp').value)||null,stock:Number(document.getElementById('pStock').value),image_url:document.getElementById('pImage').value.trim(),badge:document.getElementById('pBadge').value.trim()||null};const msg=document.getElementById('productMsg');msg.textContent='Saving…';let r=id?await agriSupabase.from('products').update(row).eq('id',id).eq('seller_id',seller.id):await agriSupabase.from('products').insert({...row,is_active:true});if(r.error){msg.textContent=r.error.message;return}closeProduct();await load();render()}
async function deleteProduct(id){if(!confirm('Delete this product?'))return;const r=await agriSupabase.from('products').delete().eq('id',id).eq('seller_id',seller.id);if(r.error)alert(r.error.message);else{await load();render()}}
async function toggleProduct(id,active){const r=await agriSupabase.from('products').update({is_active:active}).eq('id',id).eq('seller_id',seller.id);if(r.error)alert(r.error.message);else{await load();render()}}
async function updateOrderStatus(orderId,status){const old=statuses.find(x=>x.order_id===orderId);const payload={order_id:orderId,seller_id:seller.id,status,note:null,updated_at:new Date().toISOString()};const r=old?await agriSupabase.from('seller_order_status').update(payload).eq('order_id',orderId).eq('seller_id',seller.id):await agriSupabase.from('seller_order_status').insert(payload);if(r.error)alert(r.error.message);else{await load();render()}}
document.getElementById('productForm').addEventListener('submit',saveProduct);
</script></body></html>
