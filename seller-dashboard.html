<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller Control Center — AgriMart</title><style>
:root{--g:#173b2b;--g2:#2c6a47;--bg:#f4f7f1;--card:#fff;--line:#dfe6dc;--muted:#667267;--gold:#c89b3c;--red:#b3392f}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#182018}a{text-decoration:none;color:inherit}.top{background:var(--g);color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-size:22px;font-weight:700}.wrap{max-width:1280px;margin:auto;padding:24px}.layout{display:grid;grid-template-columns:230px 1fr;gap:22px}.side{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;height:max-content;position:sticky;top:18px}.side button{width:100%;border:0;background:none;text-align:left;padding:13px;border-radius:10px;font-weight:700;cursor:pointer;color:var(--muted)}.side button.active,.side button:hover{background:var(--g);color:#fff}.hero{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;border-radius:18px;padding:24px;margin-bottom:18px}.hero h1{margin:0 0 6px;font-size:30px}.hero p{margin:0;color:#dbe9df}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 4px 18px #173b2b0d}.stat .n{font-size:27px;font-weight:800;color:var(--g)}.stat .l{font-size:13px;color:var(--muted);margin-top:4px}.card h2{margin:0 0 16px;color:var(--g);font-size:21px}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:15px}.btn{border:0;border-radius:10px;padding:10px 15px;font-weight:700;cursor:pointer}.primary{background:var(--g);color:#fff}.outline{background:#fff;color:var(--g);border:1px solid var(--g)}.danger{background:#fff;color:var(--red);border:1px solid #e2bdb8}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}th{font-size:12px;text-transform:uppercase;color:var(--muted)}td{font-size:14px}.thumb{width:58px;height:58px;border-radius:10px;object-fit:cover;background:#edf2eb}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eaf2e9;color:var(--g);font-size:12px;font-weight:700}.low{color:var(--red);font-weight:800}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:99;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.modalbox{background:#fff;width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:18px;padding:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field.full{grid-column:1/-1}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;font:inherit}.field textarea{min-height:90px}.preview{width:120px;height:120px;object-fit:cover;border-radius:12px;margin-top:8px;display:none}.msg{font-size:13px;color:var(--muted);margin-top:10px}@media(max-width:850px){.layout{grid-template-columns:1fr}.side{position:static;display:flex;overflow:auto;gap:6px}.side button{min-width:max-content}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style></head><body><header class="top"><div class="brand">🌿 AgriMart Seller Control Center</div><button class="btn outline" onclick="location.href='/seller'">Seller Login</button></header><main class="wrap"><div id="app"><div class="card">Loading seller dashboard…</div></div></main><div class="modal" id="modal"><div class="modalbox"><div class="toolbar"><h2 id="mtitle">Add Product</h2><button class="btn outline" onclick="closeModal()">Close</button></div><form id="form"><input type="hidden" id="pid"><div class="grid"><div class="field full"><label>Product Name *</label><input id="name" required></div><div class="field"><label>Brand</label><input id="brand"></div><div class="field"><label>Category *</label><select id="category" required></select></div><div class="field"><label>Selling Price (₹) *</label><input id="price" type="number" min="0" step="0.01" required></div><div class="field"><label>MRP (₹)</label><input id="mrp" type="number" min="0" step="0.01"></div><div class="field"><label>Stock *</label><input id="stock" type="number" min="0" required></div><div class="field"><label>Badge</label><input id="badge" placeholder="New / Best Seller"></div><div class="field full"><label>Product Image *</label><input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><img id="preview" class="preview"><div class="msg">Maximum 5 MB. Uploads to Supabase Storage.</div></div><div class="field full"><label>Description</label><textarea id="desc"></textarea></div><div class="field full"><label>Usage / Instructions</label><textarea id="usage"></textarea></div></div><div class="toolbar" style="margin-top:18px"><span class="msg" id="formmsg"></span><button class="btn primary" id="save" type="submit">Save Product</button></div></form></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/assets/supabase-client.js"></script><script src="/assets/auth.js"></script><script>
let me, seller, products=[], items=[], payments=[], statuses=[], categories=[], tab='dashboard';const BUCKET='product-images';const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>'₹'+Number(v||0).toLocaleString('en-IN');
async function boot(){try{if(!window.AgriAuth)throw Error('Authentication module failed to load.');const a=await AgriAuth.requireRole(['seller']);if(!a)return;me=a.user;const r=await agriSupabase.from('sellers').select('*').eq('user_id',me.id).maybeSingle();if(r.error)throw r.error;seller=r.data;if(!seller||seller.status!=='approved'||seller.verified!==true){location.replace('/seller');return}await load();draw()}catch(e){$('app').innerHTML='<div class="card"><h2>Seller dashboard unavailable</h2><p>'+esc(e.message)+'</p></div>'}}
async function load(){let r=await agriSupabase.from('categories').select('id,name').eq('is_active',true).order('name');categories=r.data||[];r=await agriSupabase.from('products').select('id,category_id,name,brand,price,mrp,stock,image_url,badge,description,usage,is_active,created_at').eq('seller_id',seller.id).order('created_at',{ascending:false});if(r.error)throw r.error;products=r.data||[];r=await agriSupabase.from('order_items').select('id,order_id,product_id,product_name,unit_price,quantity,line_total,created_at').eq('seller_id',seller.id).order('created_at',{ascending:false});if(r.error)throw r.error;items=r.data||[];const ids=[...new Set(items.map(x=>x.order_id))];payments=[];statuses=[];if(ids.length){r=await agriSupabase.from('payments').select('order_id,amount,status,method,provider,razorpay_payment_id,paid_at,created_at').in('order_id',ids);if(!r.error)payments=r.data||[];r=await agriSupabase.from('seller_order_status').select('order_id,status,note,updated_at').eq('seller_id',seller.id).in('order_id',ids);if(!r.error)statuses=r.data||[]}}
function draw(){const nav=['dashboard','products','orders','payments','profile'];$('app').innerHTML='<div class="hero"><h1>'+esc(seller.business_name||'Seller')+'</h1><p>'+esc(seller.location||'')+' · ✓ Verified & Approved</p></div><div class="layout"><aside class="side">'+nav.map(x=>'<button class="'+(tab===x?'active':'')+'" onclick="tab=\''+x+'\';draw()">'+x[0].toUpperCase()+x.slice(1)+'</button>').join('')+'</aside><section>'+view()+'</section></div>'}
function view(){if(tab==='products')return productsView();if(tab==='orders')return ordersView();if(tab==='payments')return paymentsView();if(tab==='profile')return profileView();const sales=items.reduce((a,x)=>a+Number(x.line_total||0),0),orders=new Set(items.map(x=>x.order_id)).size,pending=items.filter(x=>!statuses.find(s=>s.order_id===x.order_id)||statuses.find(s=>s.order_id===x.order_id)?.status==='pending').length,low=products.filter(p=>Number(p.stock)<=10&&p.is_active).length;return '<div class="stats"><div class="stat"><div class="n">'+products.length+'</div><div class="l">My Products</div></div><div class="stat"><div class="n">'+orders+'</div><div class="l">Orders</div></div><div class="stat"><div class="n">'+money(sales)+'</div><div class="l">Gross Sales</div></div><div class="stat"><div class="n">'+low+'</div><div class="l">Low Stock</div></div></div><div class="card"><div class="toolbar"><div><h2>Seller Overview</h2><p style="color:var(--muted)">Manage products, price, images, stock, orders and payments.</p></div><button class="btn primary" onclick="tab=\'products\';draw();setTimeout(openAdd,0)">+ Add Product</button></div></div>'}
function productsView(){return '<div class="card"><div class="toolbar"><h2>Product Management</h2><button class="btn primary" onclick="openAdd()">+ Add Product</button></div><div class="tablewrap"><table><tr><th>Image</th><th>Product</th><th>Price / MRP</th><th>Stock</th><th>Status</th><th>Action</th></tr>'+products.map(p=>'<tr><td><img class="thumb" src="'+esc(p.image_url||'')+'"></td><td><b>'+esc(p.name)+'</b><br><small>'+esc(p.brand||'')+'</small></td><td><b>'+money(p.price)+'</b><br><del>'+money(p.mrp)+'</del></td><td class="'+(Number(p.stock)<=10?'low':'')+'">'+p.stock+'</td><td><span class="pill">'+(p.is_active?'Active':'Hidden')+'</span></td><td><button class="btn outline" onclick="editProduct(\''+p.id+'\')">Edit</button> <button class="btn outline" onclick="toggleProduct(\''+p.id+'\','+(!p.is_active)+')">'+(p.is_active?'Hide':'Publish')+'</button> <button class="btn danger" onclick="deleteProduct(\''+p.id+'\')">Delete</button></td></tr>').join('')+'</table></div></div>'}
function ordersView(){const g={};items.forEach(x=>(g[x.order_id]??=[]).push(x));const rows=Object.entries(g);return '<div class="card"><div class="toolbar"><h2>Order Tracking</h2><span class="pill">'+rows.length+' orders</span></div><div class="tablewrap"><table><tr><th>Order</th><th>Items</th><th>Amount</th><th>Payment</th><th>Status</th><th>Update</th></tr>'+rows.map(([id,a])=>{const st=statuses.find(s=>s.order_id===id),pay=payments.find(p=>p.order_id===id);return '<tr><td><b>'+esc(id.slice(0,8))+'…</b></td><td>'+a.map(x=>esc(x.product_name)+' × '+x.quantity).join('<br>')+'</td><td>'+money(a.reduce((z,x)=>z+Number(x.line_total||0),0))+'</td><td>'+esc(pay?.status||'Not recorded')+'</td><td><span class="pill">'+esc(st?.status||'pending')+'</span></td><td><select onchange="setStatus(\''+id+'\',this.value)"><option>pending</option><option>confirmed</option><option>processing</option><option>shipped</option><option>delivered</option><option>cancelled</option></select></td></tr>'}).join('')+'</table></div></div>'}
function paymentsView(){return '<div class="card"><h2>Payments & Transactions</h2><div class="tablewrap"><table><tr><th>Order</th><th>Amount</th><th>Status</th><th>Method</th><th>Payment ID</th></tr>'+payments.map(p=>'<tr><td>'+esc(p.order_id)+'</td><td>'+money(p.amount)+'</td><td><span class="pill">'+esc(p.status)+'</span></td><td>'+esc(p.method||p.provider||'—')+'</td><td>'+esc(p.razorpay_payment_id||'—')+'</td></tr>').join('')+'</table></div></div>'}
function profileView(){return '<div class="card"><h2>Seller Profile</h2><div class="grid"><div class="field"><label>Business Name</label><input value="'+esc(seller.business_name)+'" disabled></div><div class="field"><label>Location</label><input value="'+esc(seller.location||'')+'" disabled></div><div class="field"><label>Status</label><input value="Approved / Verified" disabled></div><div class="field"><label>Seller ID</label><input value="'+esc(seller.id)+'" disabled></div></div></div>'}
function fillCats(selected){$('category').innerHTML='<option value="">Select category</option>'+categories.map(c=>'<option value="'+c.id+'" '+(c.id===selected?'selected':'')+'>'+esc(c.name)+'</option>').join('')}
function openAdd(){resetForm();$('mtitle').textContent='Add Product';fillCats('');$('modal').classList.add('open')}
function editProduct(id){const p=products.find(x=>x.id===id);if(!p)return;resetForm();$('mtitle').textContent='Edit Product';$('pid').value=p.id;$('name').value=p.name||'';$('brand').value=p.brand||'';$('price').value=p.price??'';$('mrp').value=p.mrp??'';$('stock').value=p.stock??0;$('badge').value=p.badge||'';$('desc').value=p.description||'';$('usage').value=p.usage||'';fillCats(p.category_id||'');if(p.image_url){$('preview').src=p.image_url;$('preview').style.display='block'}$('modal').classList.add('open')}
function resetForm(){['pid','name','brand','price','mrp','stock','badge','desc','usage'].forEach(x=>$(x).value='');$('imageFile').value='';$('preview').style.display='none';$('preview').src='';$('formmsg').textContent=''}function closeModal(){$('modal').classList.remove('open')}
$('imageFile').addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;if(f.size>5*1024*1024){e.target.value='';return alert('Image must be 5 MB or smaller.')}const r=new FileReader();r.onload=()=>{$('preview').src=r.result;$('preview').style.display='block'};r.readAsDataURL(f)})
async function uploadImage(file){const u=(await agriSupabase.auth.getUser()).data.user;if(!u)throw Error('Session expired. Please sign in again.');const ext=(file.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,'').toLowerCase()||'jpg';const path=u.id+'/'+crypto.randomUUID()+'.'+ext;const r=await agriSupabase.storage.from(BUCKET).upload(path,file,{contentType:file.type,upsert:false,cacheControl:'31536000'});if(r.error)throw r.error;return agriSupabase.storage.from(BUCKET).getPublicUrl(path).data.publicUrl}
$('form').addEventListener('submit',async e=>{e.preventDefault();const btn=$('save');btn.disabled=true;$('formmsg').textContent='Saving…';try{let image=$('preview').src||'';const file=$('imageFile').files?.[0];if(file)image=await uploadImage(file);if(!image||image.startsWith('data:'))throw Error('Please upload a product image.');const row={seller_id:seller.id,category_id:$('category').value,name:$('name').value.trim(),brand:$('brand').value.trim()||null,price:Number($('price').value),mrp:Number($('mrp').value)||null,stock:Number($('stock').value),badge:$('badge').value.trim()||null,image_url:image,description:$('desc').value.trim()||null,usage:$('usage').value.trim()||null};const id=$('pid').value;const r=id?await agriSupabase.from('products').update(row).eq('id',id).eq('seller_id',seller.id):await agriSupabase.from('products').insert({...row,is_active:true});if(r.error)throw r.error;closeModal();await load();draw()}catch(err){$('formmsg').textContent=err.message}finally{btn.disabled=false}})
async function toggleProduct(id,active){const r=await agriSupabase.from('products').update({is_active:active}).eq('id',id).eq('seller_id',seller.id);if(r.error)alert(r.error.message);else{await load();draw()}}
async function deleteProduct(id){if(!confirm('Delete this product?'))return;const r=await agriSupabase.from('products').delete().eq('id',id).eq('seller_id',seller.id);if(r.error)alert(r.error.message);else{await load();draw()}}
async function setStatus(orderId,status){const old=statuses.find(x=>x.order_id===orderId);const row={order_id:orderId,seller_id:seller.id,status,note:null,updated_at:new Date().toISOString()};const r=old?await agriSupabase.from('seller_order_status').update(row).eq('order_id',orderId).eq('seller_id',seller.id):await agriSupabase.from('seller_order_status').insert(row);if(r.error)alert(r.error.message);else{await load();draw()}}
boot();</script></body></html>
