<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Wishlist — AgriMart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="wishlist">

<div id="site-header"></div>

<main>
  <div class="container">
    <div class="breadcrumb"><a href="index.html">Home</a><span class="sep">/</span><span class="cur">Wishlist</span></div>
    <h2 style="font-size:26px;margin-bottom:20px;" id="wishHeading">My Wishlist</h2>
    <div id="wishRoot"></div>
  </div>
</main>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/data.js"></script>
<script src="assets/supabase-client.js"></script>
<script src="assets/catalog-v2.js"></script>
<script src="assets/common.js"></script>
<script>
async function initPage(){
  try{
    // Load the same live Supabase catalog used by Home/Shop/Product pages.
    // Without this, seller-added products have DB IDs that are not present in
    // the legacy static PRODUCTS array and therefore disappear from Wishlist.
    if(window.AgriCatalog?.ready) await window.AgriCatalog.ready;
  }catch(e){
    console.error('Wishlist catalog load failed:', e);
  }
  renderWishlist();
}

function onWishlistChanged(){ renderWishlist(); }

function renderWishlist(){
  const saved = state.wishlistArr;
  const products = saved.map(id=>byId(id)).filter(Boolean);
  document.getElementById('wishHeading').textContent = 'My Wishlist' + (products.length?` (${products.length})`:'');
  const root = document.getElementById('wishRoot');
  root.innerHTML = products.length===0 ? `
    <div class="empty-state"><div class="ic">♡</div><h3>Your wishlist is empty</h3><p>Save products you love for later.</p><a href="shop.html" class="btn btn-primary" style="margin-top:16px;">Browse Products</a></div>
  ` : `<div class="product-grid">${products.map(productCard).join('')}</div>`;
  if(typeof updateBadges==='function') updateBadges();
}
</script>
</body>
</html>
