<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>My Profile — AgriMart</title><link rel="stylesheet" href="assets/style.css"></head><body data-page="account"><div id="site-header"></div><main><div class="container" style="max-width:760px"><div class="breadcrumb"><a href="index.html">Home</a><span class="sep">/</span><span class="cur">Profile</span></div><div id="profileRoot"></div></div></main><div id="site-footer"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/data.js"></script><script src="assets/common.js"></script><script src="assets/supabase-client.js"></script><script src="assets/auth.js"></script><script src="assets/orders.js"></script><script>async function initPage(){const root=document.getElementById('profileRoot');try{const user=await AgriAuth.getCurrentUser();if(!user){root.innerHTML='<div class="empty-state"><div class="ic">👤</div><h3>Please sign in</h3><a class="btn btn-primary" href="login.html?next=profile.html">Sign In</a></div>';return;}let p=await AgriAuth.getProfile(user.id);if(!p){const full=user.user_metadata?.full_name||'';const phone=user.user_metadata?.phone||'';const r=await window.agriSupabase.from('profiles').upsert({id:user.id,full_name:full,phone:phone}).select().single();if(r.error)throw r.error;p=r.data;}const orders=await AgriOrders.getOrders();const tx=await AgriOrders.getTransactions();root.innerHTML='<div class="panel-card"><div style="display:flex;align-items:center;gap:16px"><div class="ic-circle">👤</div><div><h2>'+esc(p.full_name||'Customer')+'</h2><p class="muted">'+esc(user.email||'')+'</p></div></div><hr><div class="summary-row"><span>Full Name</span><b>'+esc(p.full_name||'—')+'</b></div><div class="summary-row"><span>Phone</span><b>'+esc(p.phone||'—')+'</b></div><div class="summary-row"><span>Account Role</span><b>'+esc(p.role||'customer')+'</b></div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px"><a class="btn btn-primary" href="orders.html">My Orders ('+orders.length+')</a><a class="btn btn-outline" href="transactions.html">Transactions ('+tx.length+')</a><button class="btn btn-ghost" onclick="AgriAuth.signOut()">Sign Out</button></div></div>'; }catch(e){console.error(e);root.innerHTML='<div class="empty-state"><h3>Could not load profile</h3><p>'+esc(e.message)+'</p></div>';}}function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]));}</script></body></html>
