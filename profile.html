<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>My Profile — AgriMart</title>
<link rel="stylesheet" href="assets/style.css?v=20260902-profile1">
<style>
:root{--green:#17643a;--soft:#eef7f0;--border:#e5e7eb}
.profile-wrap{max-width:1050px;margin:0 auto}.profile-layout{display:grid;grid-template-columns:250px 1fr;gap:20px}.profile-side,.profile-card{background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:0 4px 18px rgba(0,0,0,.05)}
.profile-side{padding:10px;height:max-content;position:sticky;top:16px}.profile-user{padding:16px 12px;border-bottom:1px solid var(--border);margin-bottom:8px}.profile-avatar{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--green);font-size:26px;font-weight:800;overflow:hidden}.profile-avatar img{width:100%;height:100%;object-fit:cover}.profile-side button{width:100%;border:0;background:transparent;text-align:left;padding:12px;border-radius:10px;font:inherit;font-weight:700;color:#374151;cursor:pointer}.profile-side button:hover,.profile-side button.active{background:var(--soft);color:var(--green)}.profile-side .logout{color:#b91c1c;margin-top:8px}
.profile-card{padding:22px;margin-bottom:16px}.profile-head{display:flex;justify-content:space-between;align-items:center;gap:15px}.profile-head-main{display:flex;align-items:center;gap:15px}.profile-head h2{margin:0 0 4px}.muted{color:#6b7280}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:13px;font-weight:700;color:#6b7280}.field input,.field textarea,.field select{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #d1d5db;border-radius:10px;background:#fff}.field input:disabled{background:#f8fafc;color:#6b7280}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{border:1px solid var(--border);border-radius:12px;padding:15px}.stat b{display:block;font-size:23px;margin-top:4px}.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.quick{display:block;text-decoration:none;color:inherit;border:1px solid var(--border);border-radius:12px;padding:15px}.quick:hover{border-color:#b7d5c0;background:#fbfefb}.address{border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:10px;display:flex;justify-content:space-between;gap:12px}.badge{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;background:var(--soft);color:var(--green);font-size:12px;font-weight:800}.notice{display:none;padding:10px 12px;border-radius:10px;margin-bottom:14px}.notice.ok{display:block;background:#ecfdf3;color:#166534}.notice.err{display:block;background:#fef2f2;color:#991b1b}.empty{text-align:center;padding:35px}.hidden{display:none!important}
@media(max-width:800px){.profile-layout{grid-template-columns:1fr}.profile-side{position:static}.profile-side nav{display:grid;grid-template-columns:1fr 1fr}.profile-user{display:none}.stats{grid-template-columns:1fr 1fr}.quick-grid{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.profile-head{align-items:flex-start}.address{flex-direction:column}}
</style>
</head>
<body data-page="account">
<div id="site-header"></div>
<main><div class="container profile-wrap">
<div class="breadcrumb"><a href="index.html">Home</a><span class="sep">/</span><span class="cur">My Profile</span></div>
<div id="profileRoot"><div class="empty"><p>Loading profile…</p></div></div>
</div></main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/data.js?v=20260902-profile1"></script>
<script src="assets/common.js?v=20260902-profile1"></script>
<script src="assets/supabase-client.js?v=20260902-profile1"></script>
<script src="assets/auth.js?v=20260902-profile1"></script>
<script src="assets/orders.js?v=20260902-profile1"></script>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]));
let USER=null,PROFILE=null,ORDERS=[],ADDRESSES=[];
const root=()=>document.getElementById('profileRoot');
function initials(name){const s=(name||'Customer').trim().split(/\s+/);return ((s[0]?.[0]||'C')+(s[1]?.[0]||'')).toUpperCase()}
function money(v){return '₹'+Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:2})}
async function initPage(){
 try{
  USER=await AgriAuth.getCurrentUser();
  if(!USER){root().innerHTML='<div class="profile-card empty"><div class="profile-avatar" style="margin:auto">👤</div><h2>Sign in to your profile</h2><p class="muted">Manage your personal details, addresses, orders and payments from one place.</p><a class="btn btn-primary" href="login.html?next='+encodeURIComponent('profile.html')+'">Sign In</a></div>';return;}
  PROFILE=await AgriAuth.getProfile(USER.id);
  if(!PROFILE){const r=await window.agriSupabase.from('profiles').upsert({id:USER.id,full_name:USER.user_metadata?.full_name||'',phone:USER.user_metadata?.phone||''}).select('id,full_name,phone,role,avatar_url').single();if(r.error)throw r.error;PROFILE=r.data;}
  await Promise.all([loadOrders(),loadAddresses()]);renderShell();showSection('overview');
 }catch(e){console.error(e);root().innerHTML='<div class="profile-card empty"><h3>Profile could not be loaded</h3><p class="muted">'+esc(e.message||'Please try again.')+'</p><button class="btn btn-primary" onclick="location.reload()">Retry</button></div>';}
}
async function loadOrders(){try{ORDERS=await AgriOrders.getOrders();}catch(e){ORDERS=[];console.warn(e)}}
async function loadAddresses(){const r=await window.agriSupabase.from('addresses').select('*').eq('user_id',USER.id).order('is_default',{ascending:false}).order('created_at',{ascending:false});if(r.error)throw r.error;ADDRESSES=r.data||[]}
function renderShell(){
 const delivered=ORDERS.filter(o=>o.status==='delivered').length,total=ORDERS.reduce((s,o)=>s+Number(o.total||0),0);
 root().innerHTML=`<div class="profile-layout"><aside class="profile-side"><div class="profile-user"><div class="profile-avatar">${PROFILE.avatar_url?'<img src="'+esc(PROFILE.avatar_url)+'" alt="">':initials(PROFILE.full_name)}</div><div style="margin-top:10px"><b>${esc(PROFILE.full_name||'Customer')}</b><div class="muted" style="font-size:12px">${esc(USER.email||'')}</div></div></div><nav><button class="active" data-section="overview" onclick="showSection('overview')">👤 Overview</button><button data-section="personal" onclick="showSection('personal')">✏️ Personal Details</button><button data-section="addresses" onclick="showSection('addresses')">📍 Addresses</button><button data-section="orders" onclick="showSection('orders')">📦 My Orders</button><button data-section="wishlist" onclick="showSection('wishlist')">❤️ Wishlist</button><button data-section="payments" onclick="showSection('payments')">💳 Payments</button><button data-section="returns" onclick="showSection('returns')">↩️ Returns</button><button data-section="support" onclick="showSection('support')">❓ Help & Support</button><button class="logout" onclick="logout()">🚪 Logout</button></nav></aside><section>
 <div id="sec-overview" class="profile-section"><div class="profile-card"><div class="profile-head"><div class="profile-head-main"><div class="profile-avatar">${PROFILE.avatar_url?'<img src="'+esc(PROFILE.avatar_url)+'" alt="">':initials(PROFILE.full_name)}</div><div><h2>${esc(PROFILE.full_name||'Customer')}</h2><div class="muted">${esc(USER.email||'')} · Customer</div></div></div><span class="badge">✓ Customer Account</span></div></div><div class="stats"><div class="stat"><span class="muted">Orders</span><b>${ORDERS.length}</b></div><div class="stat"><span class="muted">Delivered</span><b>${delivered}</b></div><div class="stat"><span class="muted">Saved Addresses</span><b>${ADDRESSES.length}</b></div><div class="stat"><span class="muted">Total Spent</span><b>${money(total)}</b></div></div><div class="profile-card"><h3>Quick Access</h3><div class="quick-grid"><a class="quick" href="orders.html"><b>📦 My Orders</b><div class="muted">View and track your orders</div></a><a class="quick" href="wishlist.html"><b>❤️ My Wishlist</b><div class="muted">Saved products</div></a><a class="quick" href="cart.html"><b>🛒 My Cart</b><div class="muted">Review items before checkout</div></a><a class="quick" href="#" onclick="showSection('personal');return false"><b>✏️ Edit Profile</b><div class="muted">Update name and phone</div></a><a class="quick" href="#" onclick="showSection('addresses');return false"><b>📍 Addresses</b><div class="muted">Manage delivery addresses</div></a><a class="quick" href="transactions.html"><b>💳 Payments</b><div class="muted">View transactions</div></a></div></div></div>
 <div id="sec-personal" class="profile-section hidden"><div class="profile-card"><h3>Personal Details</h3><div id="personalMsg" class="notice"></div><form onsubmit="savePersonal(event)"><div class="grid2"><div class="field"><label>Full Name</label><input id="fullName" value="${esc(PROFILE.full_name)}" maxlength="100" required></div><div class="field"><label>Mobile Number</label><input id="phone" value="${esc(PROFILE.phone)}" maxlength="20" inputmode="tel"></div><div class="field"><label>Email</label><input value="${esc(USER.email||'')}" disabled></div><div class="field"><label>Account Type</label><input value="Customer" disabled></div></div><button class="btn btn-primary" style="margin-top:16px">Save Changes</button></form></div></div>
 <div id="sec-addresses" class="profile-section hidden"><div class="profile-card"><div class="profile-head"><div><h3 style="margin:0">Delivery Addresses</h3><p class="muted">Use these addresses during checkout.</p></div><button class="btn btn-outline" onclick="toggleAddressForm()">+ Add Address</button></div><div id="addressForm" class="hidden" style="margin-top:16px"><form onsubmit="addAddress(event)"><div class="grid2"><div class="field"><label>Name</label><input id="aname" required></div><div class="field"><label>Phone</label><input id="aphone" required inputmode="tel"></div><div class="field"><label>Address</label><input id="aline" required></div><div class="field"><label>Village</label><input id="avillage"></div><div class="field"><label>City/Town</label><input id="acity" required></div><div class="field"><label>District</label><input id="adistrict"></div><div class="field"><label>State</label><input id="astate" value="Jharkhand" required></div><div class="field"><label>PIN Code</label><input id="apin" required pattern="[0-9]{6}" inputmode="numeric"></div></div><label style="display:block;margin:13px 0"><input type="checkbox" id="adefault"> Set as default address</label><button class="btn btn-primary">Save Address</button></form></div><div id="addressList"></div></div></div>
 <div id="sec-orders" class="profile-section hidden"><div class="profile-card"><div class="profile-head"><div><h3 style="margin:0">My Orders</h3><p class="muted">Track your recent purchases.</p></div><a class="btn btn-outline" href="orders.html">View All</a></div><div style="margin-top:12px">${ORDERS.slice(0,5).map(o=>`<div class="address"><div><b>${esc(o.order_number||o.id)}</b><div class="muted">${esc(o.status||'pending')} · ${money(o.total)}</div></div><a class="btn btn-ghost" href="order.html?id=${encodeURIComponent(o.order_number||o.id)}">View Order</a></div>`).join('')||'<div class="empty"><p class="muted">No orders yet.</p><a class="btn btn-primary" href="shop.html">Start Shopping</a></div>'}</div></div></div>
 <div id="sec-wishlist" class="profile-section hidden"><div class="profile-card"><h3>My Wishlist</h3><p class="muted">Your saved products are kept here.</p><a class="btn btn-primary" href="wishlist.html">Open Wishlist</a></div></div>
 <div id="sec-payments" class="profile-section hidden"><div class="profile-card"><h3>Payments</h3><p class="muted">View Razorpay and Cash on Delivery payment records.</p><a class="btn btn-primary" href="transactions.html">Open Transactions</a></div></div>
 <div id="sec-returns" class="profile-section hidden"><div class="profile-card"><h3>Returns & Refunds</h3><p class="muted">Manage eligible returns and refund requests.</p><a class="btn btn-primary" href="returns.html">Open Returns</a></div></div>
 <div id="sec-support" class="profile-section hidden"><div class="profile-card"><h3>Help & Support</h3><p class="muted">Need help with an order, payment or account?</p><a class="btn btn-primary" href="contact.html">Contact Support</a></div></div>
 </section></div>`;
 renderAddresses();
}
function showSection(name){document.querySelectorAll('.profile-section').forEach(x=>x.classList.add('hidden'));const s=document.getElementById('sec-'+name);if(s)s.classList.remove('hidden');document.querySelectorAll('.profile-side button[data-section]').forEach(b=>b.classList.toggle('active',b.dataset.section===name));if(name==='addresses')renderAddresses();window.scrollTo({top:0,behavior:'smooth'});}
async function savePersonal(e){e.preventDefault();const name=document.getElementById('fullName').value.trim(),phone=document.getElementById('phone').value.trim();const r=await window.agriSupabase.from('profiles').update({full_name:name,phone,updated_at:new Date().toISOString()}).eq('id',USER.id);const m=document.getElementById('personalMsg');m.className='notice '+(r.error?'err':'ok');m.textContent=r.error?r.error.message:'Profile updated successfully.';if(!r.error){PROFILE.full_name=name;PROFILE.phone=phone;renderShell();showSection('personal');}}
function toggleAddressForm(){document.getElementById('addressForm').classList.toggle('hidden')}
function renderAddresses(){const el=document.getElementById('addressList');if(!el)return;el.innerHTML=ADDRESSES.length?ADDRESSES.map(a=>`<div class="address"><div><b>${esc(a.name)} ${a.is_default?'<span class="badge">Default</span>':''}</b><div>${esc(a.phone)}</div><div class="muted">${esc(a.line)}, ${esc(a.village||'')}, ${esc(a.city)}, ${esc(a.district||'')}, ${esc(a.state)} - ${esc(a.pin)}</div></div><button class="btn btn-ghost" onclick="deleteAddress('${a.id}')">Delete</button></div>`).join(''):'<div class="empty"><p class="muted">No saved addresses yet.</p></div>'}
async function addAddress(e){e.preventDefault();const data={user_id:USER.id,name:aname.value.trim(),phone:aphone.value.trim(),line:aline.value.trim(),village:avillage.value.trim()||null,city:acity.value.trim(),district:adistrict.value.trim()||null,state:astate.value.trim(),pin:apin.value.trim(),is_default:adefault.checked};if(data.is_default){const x=await window.agriSupabase.from('addresses').update({is_default:false}).eq('user_id',USER.id);if(x.error){alert(x.error.message);return}}const r=await window.agriSupabase.from('addresses').insert(data);if(r.error){alert(r.error.message);return}e.target.reset();document.getElementById('astate').value='Jharkhand';document.getElementById('addressForm').classList.add('hidden');await loadAddresses();renderShell();showSection('addresses')}
async function deleteAddress(id){if(!confirm('Delete this address?'))return;const r=await window.agriSupabase.from('addresses').delete().eq('id',id).eq('user_id',USER.id);if(r.error)alert(r.error.message);else{await loadAddresses();renderAddresses()}}
async function logout(){if(!confirm('Are you sure you want to log out?'))return;try{await AgriAuth.signOut()}catch(e){alert(e.message||'Unable to log out.')}}
</script>
</body></html>
