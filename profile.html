<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account — AgriMart</title><link rel="stylesheet" href="assets/style.css?v=20260903-profileflow"><style>body{background:#f7f5f0}.wrap{max-width:1100px;margin:auto;padding:22px 14px}.layout{display:grid;grid-template-columns:230px 1fr;gap:18px}.side,.card,.stat{background:#fff;border:1px solid #e7e2d6;border-radius:15px;box-shadow:0 3px 14px #00000008}.side{background:#16213e;color:#fff;padding:10px;height:max-content}.user{padding:14px 10px;border-bottom:1px solid #ffffff22;margin-bottom:7px}.avatar{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:#e0932a;color:#16213e;font-weight:800;font-size:21px}.side button{width:100%;border:0;background:transparent;color:#d7ddec;text-align:left;padding:10px 11px;border-radius:8px;font-weight:700;cursor:pointer}.side button.active,.side button:hover{background:#e0932a;color:#16213e}.logout{margin-top:7px;border-top:1px solid #ffffff22!important}.hero{background:#16213e;color:#fff;border-radius:15px;padding:22px;display:flex;justify-content:space-between;align-items:center}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.stat{padding:14px}.stat b{display:block;font-size:21px;margin-top:4px}.card{padding:18px;margin-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}.field label{font-weight:700;font-size:13px;color:#79715f}.field input,.field select{padding:10px;border:1px solid #d6d0c4;border-radius:8px;font-size:15px}.btn{border:0;border-radius:8px;padding:9px 13px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:#16213e;color:#fff}.amber{background:#e0932a;color:#16213e}.outline{background:#fff;color:#16213e;border:1px solid #d8d1c3}.msg{display:none;padding:10px 12px;border-radius:8px;margin:10px 0}.msg.ok{display:block;background:#e5f3ea;color:#166534}.msg.err{display:block;background:#fef2f2;color:#991b1b}.empty{text-align:center;padding:30px}.row,.address,.pay,.event{border:1px solid #e7e2d6;border-radius:11px;padding:13px;margin-top:9px}.row{display:flex;gap:12px;align-items:center;justify-content:space-between}.actions{display:flex;gap:7px;flex-wrap:wrap}.muted{color:#79715f;font-size:13px}.hidden{display:none!important}.tag{padding:4px 8px;border-radius:99px;background:#f7eae0;font-size:12px;font-weight:800}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}.event{border-left:4px solid #e0932a}.event b{display:block}@media(max-width:800px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}@media(max-width:520px){.stats{grid-template-columns:1fr}.row{align-items:flex-start;flex-direction:column}.hero .avatar{display:none}}</style></head><body><div id="site-header"></div><main class="wrap"><div id="root"><div class="card empty">Loading profile…</div></div></main><div id="site-footer"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/data.js?v=20260903-profileflow"></script><script src="assets/common.js?v=20260903-profileflow"></script><script src="assets/supabase-client.js?v=20260903-profileflow"></script><script>(async()=>{const root=document.getElementById('root');let sb,user,p,addresses=[],orders=[],payments=[],events={};const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=v=>'₹'+Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:2}),initials=n=>(String(n||'Customer').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('')||'C').toUpperCase(),cap=s=>String(s||'pending').replace(/_/g,' ').replace(/\b\w/g,x=>x.toUpperCase());function msg(t,ok){let e=$('msg');if(e){e.className='msg '+(ok?'ok':'err');e.textContent=t}}async function profile(){let r=await sb.from('profiles').select('id,full_name,phone,role,avatar_url').eq('id',user.id).maybeSingle();if(r.error)throw r.error;if(r.data)return r.data;r=await sb.from('profiles').insert({id:user.id,full_name:user.user_metadata?.full_name||user.user_metadata?.name||'',phone:user.user_metadata?.phone||''}).select('id,full_name,phone,role,avatar_url').single();if(r.error)throw r.error;return r.data}async function load(){p=await profile();let a=await sb.from('addresses').select('*').eq('user_id',user.id).order('is_default',{ascending:false}).order('created_at',{ascending:false});if(a.error)throw a.error;addresses=a.data||[];let o=await sb.from('orders').select('id,order_number,status,total,created_at,updated_at,address_id').eq('user_id',user.id).order('created_at',{ascending:false});if(o.error)throw o.error;orders=o.data||[];let q=await sb.from('payments').select('id,order_id,provider,method,amount,status,paid_at,created_at').eq('user_id',user.id).order('created_at',{ascending:false});if(q.error)throw q.error;payments=q.data||[];let ids=orders.map(x=>x.id);events={};if(ids.length){let t=await sb.from('order_tracking_events').select('id,order_id,status,title,description,location,created_at').in('order_id',ids).order('created_at',{ascending:false});if(!t.error)(t.data||[]).forEach(x=>(events[x.order_id]??=[]).push(x))}render()}function orderRow(o){let n=o.order_number||o.id;let ev=events[o.id]?.[0];return `<div class="row"><div><b>${esc(n)}</b><div>${esc(ev?.title||'Order '+cap(o.status))}</div><div class="muted">${o.created_at?new Date(o.created_at).toLocaleDateString('en-IN'):''} · ${money(o.total)}${ev?.location?' · '+esc(ev.location):''}</div></div><div class="actions"><span class="tag">${esc(cap(o.status))}</span><a class="btn outline" href="order.html?id=${encodeURIComponent(n)}">View Order</a><a class="btn primary" href="order.html?id=${encodeURIComponent(n)}">Track Order</a></div></div>`}function payRow(x){let o=orders.find(z=>z.id===x.order_id),n=o?.order_number||x.order_id;return `<div class="pay"><div class="topline"><b>${esc(n)}</b><span class="tag">${esc(cap(x.status))}</span></div><div>${esc((x.method||x.provider||'Payment').toUpperCase())} · ${money(x.amount)}</div><div class="muted">${x.paid_at?'Paid '+new Date(x.paid_at).toLocaleDateString('en-IN'):new Date(x.created_at).toLocaleDateString('en-IN')}</div></div>`}function addr(a){return `<div class="address"><div class="topline"><b>${esc(a.name)}</b>${a.is_default?'<span class="tag">Default</span>':''}</div><div>${esc(a.line||'')}${a.village?', '+esc(a.village):''}, ${esc(a.city||'')}${a.district?', '+esc(a.district):''}, ${esc(a.state||'')} — ${esc(a.pin||'')}</div><div class="muted">${esc(a.phone||'')}</div><div class="actions" style="margin-top:7px"><button class="btn outline" data-edit="${a.id}">Edit</button><button class="btn outline" data-del="${a.id}">Delete</button></div></div>`}function track(o){let n=o.order_number||o.id,ev=events[o.id]||[];return `<div class="card"><div class="topline"><div><h3>Tracking · ${esc(n)}</h3><div class="muted">Customer view — status changes are controlled by Seller/Admin.</div></div><a class="btn outline" href="order.html?id=${encodeURIComponent(n)}">Open Order</a></div>${ev.length?ev.map(x=>`<div class="event"><b>${esc(x.title||cap(x.status))}</b><div>${esc(x.description||'')}</div><div class="muted">${esc(x.location||'')} · ${new Date(x.created_at).toLocaleString('en-IN')}</div></div>`).join(''):'<div class="empty muted">No tracking events yet. The current order status is '+esc(cap(o.status))+'.</div>'}</div>`}function render(){let delivered=orders.filter(o=>o.status==='delivered').length,pending=orders.filter(o=>!['delivered','cancelled'].includes(o.status)).length,spent=orders.filter(o=>o.status!=='cancelled').reduce((s,o)=>s+Number(o.total||0),0),first=(p.full_name||'Customer').split(/\s+/)[0];root.innerHTML=`<div class="layout"><aside class="side"><div class="user"><div class="avatar">${esc(initials(p.full_name))}</div><div style="margin-top:8px"><b>${esc(p.full_name||'Customer')}</b><div class="muted" style="color:#b9c2d6">${esc(user.email||'')}</div></div></div><button data-s="overview">👤 Overview</button><button data-s="personal">✏️ Personal Details</button><button data-s="orders">📦 My Orders</button><button data-s="tracking">🚚 Tracking</button><button data-s="addresses">📍 Addresses</button><button data-s="payments">💳 Payments</button><button data-s="wishlist">❤️ Wishlist</button><button data-s="returns">↩️ Returns & Refunds</button><button data-s="support">❓ Help & Support</button><button id="logout" class="logout">🚪 Logout</button></aside><section><div id="msg" class="msg"></div><div id="sec-overview"><div class="hero"><div><div style="color:#b9c2d6">Namaste,</div><h2 style="margin:4px 0">${esc(first)}</h2><div style="color:#b9c2d6">Customer account · ${esc(user.email||'')}</div></div><div class="avatar">${esc(initials(p.full_name))}</div></div><div class="stats"><div class="stat"><span class="muted">Total Orders</span><b>${orders.length}</b></div><div class="stat"><span class="muted">Active</span><b>${pending}</b></div><div class="stat"><span class="muted">Delivered</span><b>${delivered}</b></div><div class="stat"><span class="muted">Spent</span><b>${money(spent)}</b></div></div><div class="card"><div class="topline"><div><h3>Recent Orders</h3><div class="muted">One consistent order → tracking flow.</div></div><button class="btn outline" data-s="orders">See All</button></div>${orders.slice(0,5).map(orderRow).join('')||'<div class="empty muted">No orders yet.</div>'}</div></div><div id="sec-personal" class="card hidden"><h3>Personal Details</h3><form id="personalForm"><div class="grid"><div class="field"><label>Full Name</label><input id="name" required value="${esc(p.full_name||'')}"></div><div class="field"><label>Mobile</label><input id="phone" inputmode="tel" value="${esc(p.phone||'')}"></div><div class="field"><label>Email</label><input disabled value="${esc(user.email||'')}"></div><div class="field"><label>Role</label><input disabled value="${esc(p.role||'customer')}"></div></div><button class="btn amber">Save Profile</button></form></div><div id="sec-orders" class="card hidden"><div class="topline"><div><h3>My Orders</h3><p class="muted">Filter and open any order.</p></div><select id="orderFilter"><option value="all">All Orders</option><option>pending</option><option>confirmed</option><option>processing</option><option>shipped</option><option>out_for_delivery</option><option>delivered</option><option>cancelled</option></select></div><div id="orderList">${orders.map(orderRow).join('')||'<div class="empty muted">No orders found.</div>'}</div></div><div id="sec-tracking" class="hidden">${orders.length?orders.map(track).join(''):'<div class="card empty muted">No orders to track.</div>'}</div><div id="sec-addresses" class="card hidden"><div class="topline"><div><h3>Delivery Addresses</h3><p class="muted">Checkout uses your selected default address.</p></div><button class="btn amber" id="addAddress">+ Add</button></div><div id="addressForm" class="hidden"><form id="addrForm"><div class="grid"><div class="field"><label>Name</label><input id="aname" required></div><div class="field"><label>Phone</label><input id="aphone" required></div><div class="field"><label>Address</label><input id="aline" required></div><div class="field"><label>Village</label><input id="avillage"></div><div class="field"><label>City</label><input id="acity" required></div><div class="field"><label>District</label><input id="adistrict"></div><div class="field"><label>State</label><input id="astate" required></div><div class="field"><label>PIN</label><input id="apin" required inputmode="numeric"></div></div><label><input id="adefault" type="checkbox"> Set as default</label><div class="actions" style="margin-top:10px"><button class="btn amber">Save</button><button type="button" class="btn outline" id="cancelAddr">Cancel</button></div></form></div><div id="addressList">${addresses.map(addr).join('')||'<div class="empty muted">No saved addresses.</div>'}</div></div><div id="sec-payments" class="card hidden"><div class="topline"><div><h3>Payments & Transactions</h3><p class="muted">COD and online payments linked to your orders.</p></div><a class="btn outline" href="transactions.html">All Transactions</a></div>${payments.map(payRow).join('')||'<div class="empty muted">No payment records yet.</div>'}</div>${simple('wishlist','❤️ Wishlist','Open your saved products.','wishlist.html','View Wishlist')}${simple('returns','↩️ Returns & Refunds','Manage return requests from your orders.','orders.html','View Orders')}${simple('support','❓ Help & Support','Need help with an order or account?','contact.html','Contact Support')}</section></div>`;bind()}function simple(id,t,d,h,l){return `<div id="sec-${id}" class="card hidden"><h3>${t}</h3><p class="muted">${d}</p><a class="btn primary" href="${h}">${l}</a></div>`}function show(s){root.querySelectorAll('[id^="sec-"]').forEach(x=>x.classList.add('hidden'));let e=$('sec-'+s);if(e)e.classList.remove('hidden');root.querySelectorAll('[data-s]').forEach(b=>b.classList.toggle('active',b.dataset.s===s))}function bind(){root.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>show(b.dataset.s));$('logout').onclick=async()=>{await sb.auth.signOut();location.href='index.html'};$('personalForm').onsubmit=async e=>{e.preventDefault();let r=await sb.from('profiles').update({full_name:$('name').value.trim(),phone:$('phone').value.trim(),updated_at:new Date().toISOString()}).eq('id',user.id);if(r.error)return msg(r.error.message,false);await load();show('personal');msg('Profile updated successfully.',true)};$('orderFilter').onchange=e=>{let v=e.target.value;$('orderList').innerHTML=orders.filter(o=>v==='all'||o.status===v).map(orderRow).join('')||'<div class="empty muted">No matching orders.</div>'};$('addAddress').onclick=()=>{$('addressForm').classList.remove('hidden');$('addrForm').onsubmit=saveAddress};$('cancelAddr').onclick=()=>$('addressForm').classList.add('hidden');root.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this address?'))return;let r=await sb.from('addresses').delete().eq('id',b.dataset.del).eq('user_id',user.id);if(r.error)return msg(r.error.message,false);await load();show('addresses');msg('Address deleted.',true)});root.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editAddress(b.dataset.edit))}async function saveAddress(e){e.preventDefault();let d={user_id:user.id,name:$('aname').value.trim(),phone:$('aphone').value.trim(),line:$('aline').value.trim(),village:$('avillage').value.trim(),city:$('acity').value.trim(),district:$('adistrict').value.trim(),state:$('astate').value.trim(),pin:$('apin').value.trim(),is_default:$('adefault').checked};if(d.is_default){let r=await sb.from('addresses').update({is_default:false}).eq('user_id',user.id);if(r.error)return msg(r.error.message,false)}let r=await sb.from('addresses').insert(d);if(r.error)return msg(r.error.message,false);await load();show('addresses');msg('Address saved successfully.',true)}function editAddress(id){let a=addresses.find(x=>x.id===id);if(!a)return;$('addressForm').classList.remove('hidden');$('aname').value=a.name||'';$('aphone').value=a.phone||'';$('aline').value=a.line||'';$('avillage').value=a.village||'';$('acity').value=a.city||'';$('adistrict').value=a.district||'';$('astate').value=a.state||'';$('apin').value=a.pin||'';$('adefault').checked=!!a.is_default;$('addrForm').onsubmit=async e=>{e.preventDefault();let d={name:$('aname').value.trim(),phone:$('aphone').value.trim(),line:$('aline').value.trim(),village:$('avillage').value.trim(),city:$('acity').value.trim(),district:$('adistrict').value.trim(),state:$('astate').value.trim(),pin:$('apin').value.trim(),is_default:$('adefault').checked};if(d.is_default){let r=await sb.from('addresses').update({is_default:false}).eq('user_id',user.id);if(r.error)return msg(r.error.message,false)}let r=await sb.from('addresses').update(d).eq('id',id).eq('user_id',user.id);if(r.error)return msg(r.error.message,false);await load();show('addresses');msg('Address updated successfully.',true)}}try{sb=window.agriSupabase;if(!sb)throw Error('Supabase client failed to load.');let s=await sb.auth.getSession();user=s.data?.session?.user;if(!user){location.href='login.html?next='+encodeURIComponent('profile.html');return}await load()}catch(e){console.error(e);root.innerHTML='<div class="card empty"><h3>Profile could not be loaded</h3><p class="muted">'+esc(e.message||'Please try again.')+'</p><button class="btn primary" onclick="location.reload()">Retry</button></div>'}})();</script></body></html>
