<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account — AgriMart</title><link rel="stylesheet" href="assets/style.css"><style>.account-grid{display:grid;grid-template-columns:220px 1fr;gap:20px}.account-nav,.account-card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;box-shadow:0 4px 18px rgba(0,0,0,.05)}.account-nav{padding:10px;height:max-content;position:sticky;top:16px}.account-nav a{display:flex;gap:10px;padding:12px;border-radius:10px;color:#374151;text-decoration:none;font-weight:600}.account-nav a:hover,.account-nav a.active{background:#eef7f0;color:#17643a}.account-card{padding:22px;margin-bottom:16px}.account-head{display:flex;justify-content:space-between;align-items:center;gap:16px}.avatar{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:#eaf5ed;font-size:32px;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:16px;border:1px solid #e5e7eb;border-radius:12px}.stat b{font-size:24px;display:block}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:13px;font-weight:700;color:#6b7280}.field input{padding:11px;border:1px solid #d1d5db;border-radius:9px}.address{border:1px solid #e5e7eb;padding:14px;border-radius:12px;display:flex;justify-content:space-between;gap:12px;margin-top:10px}.muted{color:#6b7280}.success{padding:10px 12px;border-radius:9px;background:#ecfdf3;color:#166534;display:none;margin-bottom:12px}.danger{color:#b91c1c}@media(max-width:760px){.account-grid{grid-template-columns:1fr}.account-nav{position:static;display:grid;grid-template-columns:1fr 1fr}.stat-grid{grid-template-columns:1fr 1fr}.field-grid{grid-template-columns:1fr}.account-head{align-items:flex-start}.address{flex-direction:column}}</style></head><body data-page="account"><div id="site-header"></div><main><div class="container"><div class="breadcrumb"><a href="index.html">Home</a><span class="sep">/</span><span class="cur">My Account</span></div><div id="accountRoot"></div></div></main><div id="site-footer"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/data.js"></script><script src="assets/common.js"></script><script src="assets/supabase-client.js"></script><script src="assets/auth.js"></script><script src="assets/orders.js"></script><script>const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]));let USER,PROFILE,ORDERS=[];async function initPage(){const root=document.getElementById('accountRoot');try{USER=await AgriAuth.getCurrentUser();if(!USER){root.innerHTML='<div class="empty-state"><div class="ic">👤</div><h3>Please sign in</h3><p>Sign in to manage your AgriMart account, orders and addresses.</p><a class="btn btn-primary" href="login.html?next=profile.html">Sign In</a></div>';return}PROFILE=await AgriAuth.getProfile(USER.id);if(!PROFILE){const r=await window.agriSupabase.from('profiles').upsert({id:USER.id,full_name:USER.user_metadata?.full_name||'',phone:USER.user_metadata?.phone||''}).select().single();if(r.error)throw r.error;PROFILE=r.data}ORDERS=await AgriOrders.getOrders();renderAccount();}catch(e){console.error(e);root.innerHTML='<div class="empty-state"><h3>Unable to load account</h3><p>'+esc(e.message)+'</p></div>'}}function renderAccount(){const root=document.getElementById('accountRoot');const delivered=ORDERS.filter(o=>o.status==='delivered').length;root.innerHTML=`<div class="account-grid"><aside class="account-nav"><a class="active" href="#profile">👤 Profile</a><a href="orders.html">📦 Orders</a><a href="wishlist.html">❤️ Wishlist</a><a href="#addresses">📍 Addresses</a><a href="transactions.html">💳 Payments</a><a href="returns.html">🔄 Returns</a><a href="contact.html">❓ Help & Support</a><a href="#" onclick="AgriAuth.signOut();return false">🚪 Logout</a></aside><section><div class="account-card" id="profile"><div class="account-head"><div style="display:flex;gap:14px;align-items:center"><div class="avatar">${PROFILE.avatar_url?'<img src="'+esc(PROFILE.avatar_url)+'" alt="">':'👤'}</div><div><h2 style="margin:0">${esc(PROFILE.full_name||'Customer')}</h2><div class="muted">${esc(USER.email||'')} · Customer Account</div></div></div><span class="badge">Verified account</span></div></div><div class="stat-grid"><div class="stat"><span class="muted">Orders</span><b>${ORDERS.length}</b></div><div class="stat"><span class="muted">Delivered</span><b>${delivered}</b></div><div class="stat"><span class="muted">Wishlist</span><b id="wishCount">—</b></div><div class="stat"><span class="muted">Spent</span><b>₹${ORDERS.reduce((s,o)=>s+Number(o.total||0),0).toFixed(0)}</b></div></div><div class="account-card"><h3>Edit Profile</h3><div id="profileMsg" class="success"></div><form onsubmit="saveProfile(event)"><div class="field-grid"><div class="field"><label>Full Name</label><input id="fullName" value="${esc(PROFILE.full_name)}" required maxlength="100"></div><div class="field"><label>Mobile Number</label><input id="phone" value="${esc(PROFILE.phone)}" maxlength="20"></div><div class="field"><label>Email</label><input value="${esc(USER.email||'')}" disabled></div><div class="field"><label>Role</label><input value="Customer" disabled></div></div><button class="btn btn-primary" style="margin-top:16px">Save Changes</button></form></div><div class="account-card" id="addresses"><div class="account-head"><div><h3 style="margin:0">My Addresses</h3><p class="muted">Manage delivery addresses for faster checkout.</p></div><button class="btn btn-outline" onclick="toggleAddress()">+ Add Address</button></div><div id="addressForm" style="display:none;margin-top:14px"><form onsubmit="addAddress(event)"><div class="field-grid"><div class="field"><label>Name</label><input id="aname" required></div><div class="field"><label>Phone</label><input id="aphone" required></div><div class="field"><label>Address</label><input id="aline" required></div><div class="field"><label>Village</label><input id="avillage"></div><div class="field"><label>City/Town</label><input id="acity" required></div><div class="field"><label>District</label><input id="adistrict"></div><div class="field"><label>State</label><input id="astate" value="Jharkhand" required></div><div class="field"><label>PIN Code</label><input id="apin" required pattern="[0-9]{6}"></div></div><label style="display:block;margin:12px 0"><input type="checkbox" id="adefault"> Set as default</label><button class="btn btn-primary">Save Address</button></form></div><div id="addressList"><p class="muted">Loading addresses…</p></div></div></section></div>`;loadAddresses();loadWishlistCount()}async function loadWishlistCount(){try{const r=await window.agriSupabase.from('wishlists').select('id',{count:'exact',head:true}).eq('user_id',USER.id);document.getElementById('wishCount').textContent=r.count??0}catch(e){document.getElementById('wishCount').textContent='—'}}async function loadAddresses(){const root=document.getElementById('addressList');const r=await window.agriSupabase.from('addresses').select('*').eq('user_id',USER.id).order('is_default',{ascending:false}).order('created_at',{ascending:false});if(r.error){root.innerHTML='<p class="danger">'+esc(r.error.message)+'</p>';return}root.innerHTML=(r.data||[]).length?(r.data||[]).map(a=>`<div class="address"><div><b>${esc(a.name)} ${a.is_default?'· Default':''}</b><div>${esc(a.phone)}</div><div class="muted">${esc(a.line)}, ${esc(a.village||'')}, ${esc(a.city)}, ${esc(a.district||'')}, ${esc(a.state)} - ${esc(a.pin)}</div></div><div><button class="btn btn-ghost" onclick="deleteAddress('${a.id}')">Delete</button></div></div>`).join(''):'<p class="muted">No saved addresses yet.</p>'}async function saveProfile(e){e.preventDefault();const r=await window.agriSupabase.from('profiles').update({full_name:document.getElementById('fullName').value.trim(),phone:document.getElementById('phone').value.trim(),updated_at:new Date().toISOString()}).eq('id',USER.id);const m=document.getElementById('profileMsg');m.style.display='block';m.textContent=r.error?r.error.message:'Profile updated successfully.';if(!r.error){PROFILE.full_name=document.getElementById('fullName').value.trim();PROFILE.phone=document.getElementById('phone').value.trim()}}function toggleAddress(){const x=document.getElementById('addressForm');x.style.display=x.style.display==='none'?'block':'none'}async function addAddress(e){e.preventDefault();const data={user_id:USER.id,name:aname.value.trim(),phone:aphone.value.trim(),line:aline.value.trim(),village:avillage.value.trim()||null,city:acity.value.trim(),district:adistrict.value.trim()||null,state:astate.value.trim(),pin:apin.value.trim(),is_default:adefault.checked};if(data.is_default)await window.agriSupabase.from('addresses').update({is_default:false}).eq('user_id',USER.id);const r=await window.agriSupabase.from('addresses').insert(data);if(r.error){alert(r.error.message);return}e.target.reset();toggleAddress();loadAddresses()}async function deleteAddress(id){if(!confirm('Delete this address?'))return;const r=await window.agriSupabase.from('addresses').delete().eq('id',id).eq('user_id',USER.id);if(r.error)alert(r.error.message);else loadAddresses()}</script></body></html>
