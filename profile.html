<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>My Account — AgriMart</title>
<link rel="stylesheet" href="assets/style.css?v=20260902-profile2">
<style>
:root{--navy:#16213e;--navy2:#213158;--amber:#e0932a;--amber2:#b8701a;--bg:#f7f5f0;--surface:#fff;--line:#e7e2d6;--ink:#201f1c;--muted:#79715f;--good:#2e7d4f;--goodbg:#e5f3ea;--info:#34618f;--infobg:#e7eff6;--warn:#b0501c;--warnbg:#f7eae0}
.profile-wrap{max-width:1180px;margin:0 auto}.profile-layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px}.profile-side,.profile-card,.stat,.quick,.order-row,.address-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 18px rgba(0,0,0,.04)}
.profile-side{background:var(--navy);padding:12px;height:max-content;position:sticky;top:76px;color:#fff}.profile-user{padding:15px 10px 18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:8px}.profile-avatar{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--amber);color:var(--navy);font-size:22px;font-weight:800;overflow:hidden}.profile-avatar img{width:100%;height:100%;object-fit:cover}.profile-side nav{display:flex;flex-direction:column;gap:3px}.profile-side button{width:100%;border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:10px;font:inherit;font-weight:700;color:#c7cee0;cursor:pointer}.profile-side button:hover,.profile-side button.active{background:var(--amber);color:var(--navy)}.profile-side .logout{color:#f3b1b1;margin-top:8px;border-top:1px solid rgba(255,255,255,.12);border-radius:0}
.profile-card{padding:22px;margin-bottom:16px}.profile-hero{background:var(--navy);color:#fff;border-radius:18px;padding:25px;display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px}.profile-head{display:flex;align-items:center;justify-content:space-between;gap:15px}.profile-head-main{display:flex;align-items:center;gap:15px}.profile-head h2{margin:0 0 4px}.muted{color:var(--muted)}.profile-card h3{margin:0 0 5px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat{padding:17px}.stat b{display:block;font-size:23px;margin-top:5px;color:var(--ink)}.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.quick{display:block;text-decoration:none;color:inherit;padding:16px;transition:.15s}.quick:hover{border-color:var(--amber);transform:translateY(-1px)}.quick-icon{font-size:20px;color:var(--amber2)}.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;background:#fbefdb;color:var(--amber2);font-size:12px;font-weight:800}.status{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}.status.delivered{color:var(--good);background:var(--goodbg)}.status.out{color:var(--info);background:var(--infobg)}.status.processing,.status.pending,.status.confirmed{color:var(--warn);background:var(--warnbg)}.order-list{display:grid;gap:10px}.order-row{padding:16px;display:flex;align-items:center;gap:15px}.order-main{flex:1;min-width:0}.order-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.thumb{width:58px;height:58px;border-radius:11px;background:#e5dccb;flex:0 0 auto}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:13px;font-weight:800;color:var(--muted)}.field input,.field textarea,.field select{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #d6d0c4;border-radius:10px;background:#fff;color:var(--ink)}.field input:disabled{background:#f8f7f3;color:var(--muted)}.address-list{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}.address-card{padding:16px}.address-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.notice{display:none;padding:10px 12px;border-radius:10px;margin:0 0 14px}.notice.ok{display:block;background:var(--goodbg);color:#166534}.notice.err{display:block;background:#fef2f2;color:#991b1b}.empty{text-align:center;padding:35px}.hidden{display:none!important}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.sub{font-size:13px;color:var(--muted);margin-top:3px}.payment-box{padding:16px;border-radius:13px;background:var(--navy);color:#fff}.payment-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mini{font-size:12px;color:#b9c2d6}.money{font-weight:800;color:var(--ink)}
.btnx{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:9px;padding:10px 14px;font-weight:800;text-decoration:none;cursor:pointer;font-size:13px}.btnx.primary{background:var(--navy);color:#fff}.btnx.amber{background:var(--amber);color:var(--navy)}.btnx.outline{background:#fff;color:var(--navy);border:1px solid var(--line)}.btnx.ghost{background:#f5f2eb;color:var(--amber2)}
@media(max-width:850px){.profile-layout{grid-template-columns:1fr}.profile-side{position:static}.profile-side nav{display:grid;grid-template-columns:1fr 1fr}.profile-user{display:none}.stats{grid-template-columns:1fr 1fr}.quick-grid{grid-template-columns:1fr 1fr}.address-list{grid-template-columns:1fr}}
@media(max-width:560px){.quick-grid,.grid2,.payment-grid{grid-template-columns:1fr}.profile-hero{padding:20px}.profile-hero .profile-avatar{display:none}.order-row{align-items:flex-start;flex-wrap:wrap}.order-actions{width:100%}}
</style>
</head>
<body data-page="account">
<div id="site-header"></div>
<main><div class="container profile-wrap">
<div class="breadcrumb"><a href="index.html">Home</a><span class="sep">/</span><span class="cur">My Account</span></div>
<div id="profileRoot"><div class="empty"><p>Loading profile…</p></div></div>
</div></main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/data.js?v=20260902-profile2"></script>
<script src="assets/common.js?v=20260902-profile2"></script>
<script src="assets/supabase-client.js?v=20260902-profile2"></script>
<script src="assets/auth.js?v=20260902-profile2"></script>
<script src="assets/orders.js?v=20260902-profile2"></script>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>'₹'+Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:2});
let USER=null,PROFILE=null,ORDERS=[],ADDRESSES=[];
const root=()=>document.getElementById('profileRoot');
const initials=name=>{const s=(name||'Customer').trim().split(/\s+/);return((s[0]?.[0]||'C')+(s[1]?.[0]||'')).toUpperCase()};
const statusClass=s=>{s=String(s||'pending').toLowerCase();return s==='out for delivery'||s==='shipped'?'out':s};
const statusLabel=s=>String(s||'pending').replace(/\b\w/g,m=>m.toUpperCase());
async function initPage(){
 try{
  USER=await AgriAuth.getCurrentUser();
  if(!USER){root().innerHTML='<div class="profile-card empty"><div class="profile-avatar" style="margin:auto">👤</div><h2>Sign in to your account</h2><p class="muted">Manage your profile, orders, addresses, wishlist and payments from one place.</p><a class="btnx primary" href="login.html?next='+encodeURIComponent('profile.html')+'">Sign In</a></div>';return;}
  PROFILE=await AgriAuth.getProfile(USER.id);
  if(!PROFILE){const r=await window.agriSupabase.from('profiles').upsert({id:USER.id,full_name:USER.user_metadata?.full_name||'',phone:USER.user_metadata?.phone||''}).select('id,full_name,phone,role,avatar_url').single();if(r.error)throw r.error;PROFILE=r.data;}
  await Promise.all([loadOrders(),loadAddresses()]);
  renderShell();showSection('overview');
 }catch(e){console.error(e);root().innerHTML='<div class="profile-card empty"><h3>Account could not be loaded</h3><p class="muted">'+esc(e.message||'Please try again.')+'</p><button class="btnx primary" onclick="location.reload()">Retry</button></div>';}
}
async function loadOrders(){try{ORDERS=await AgriOrders.getOrders();}catch(e){ORDERS=[];console.warn(e)}}
async function loadAddresses(){const r=await window.agriSupabase.from('addresses').select('*').eq('user_id',USER.id).order('is_default',{ascending:false}).order('created_at',{ascending:false});if(r.error)throw r.error;ADDRESSES=r.data||[]}
function orderUrl(o){return 'order.html?id='+encodeURIComponent(o.order_number||o.id)}
function orderRow(o){const sc=statusClass(o.status);return '<div class="order-row"><div class="thumb"></div><div class="order-main"><b>'+esc(o.order_number||o.id)+'</b><div style="font-size:14px;margin-top:4px">'+esc((o.order_items||[])[0]?.product_name||'Order items')+'</div><div class="sub">'+esc(o.created_at?new Date(o.created_at).toLocaleDateString('en-IN'):'')+' · '+money(o.total)+'</div></div><span class="status '+sc+'">'+esc(statusLabel(o.status))+'</span><div class="order-actions"><a class="btnx outline" href="'+orderUrl(o)+'">View Order</a><a class="btnx primary" href="'+orderUrl(o)+'">Track Order</a></div></div>'}
function renderShell(){
 const delivered=ORDERS.filter(o=>String(o.status).toLowerCase()==='delivered').length,total=ORDERS.reduce((s,o)=>s+Number(o.total||0),0),first=(PROFILE.full_name||'Customer').split(/\s+/)[0];
 root().innerHTML='<div class="profile-layout"><aside class="profile-side"><div class="profile-user"><div class="profile-avatar">'+(PROFILE.avatar_url?'<img src="'+esc(PROFILE.avatar_url)+'" alt="">':initials(PROFILE.full_name))+'</div><div style="margin-top:10px"><b>'+esc(PROFILE.full_name||'Customer')+'</b><div style="font-size:12px;color:#b9c2d6;margin-top:3px">'+esc(USER.email||'')+'</div></div></div><nav><button class="active" data-section="overview" onclick="showSection(\'overview\')">👤 Overview</button><button data-section="personal" onclick="showSection(\'personal\')">✏️ Personal Details</button><button data-section="orders" onclick="showSection(\'orders\')">📦 My Orders</button><button data-section="addresses" onclick="showSection(\'addresses\')">📍 Addresses</button><button data-section="wishlist" onclick="showSection(\'wishlist\')">❤️ Wishlist</button><button data-section="payments" onclick="showSection(\'payments\')">💳 Payments</button><button data-section="returns" onclick="showSection(\'returns\')">↩️ Returns & Refunds</button><button data-section="support" onclick="showSection(\'support\')">❓ Help & Support</button><button class="logout" onclick="logout()">🚪 Logout</button></nav></aside><section>
 <div id="sec-overview" class="profile-section"><div class="profile-hero"><div><div style="font-size:13px;color:#b9c2d6">Namaste,</div><h2 style="margin:3px 0;color:#fff;font-size:30px">'+esc(first)+'</h2><div style="font-size:13px;color:#b9c2d6">Customer account · '+esc(USER.email||'')+'</div></div><div class="profile-avatar">'+(PROFILE.avatar_url?'<img src="'+esc(PROFILE.avatar_url)+'" alt="">':initials(PROFILE.full_name))+'</div></div><div class="stats"><div class="stat"><span class="muted">Orders</span><b>'+ORDERS.length+'</b></div><div class="stat"><span class="muted">Delivered</span><b>'+delivered+'</b></div><div class="stat"><span class="muted">Saved Addresses</span><b>'+ADDRESSES.length+'</b></div><div class="stat"><span class="muted">Total Spent</span><b>'+money(total)+'</b></div></div><div class="profile-card"><div class="toolbar"><div><h3>Recent Orders</h3><div class="sub">View order details and customer-visible delivery tracking.</div></div><button class="btnx outline" onclick="showSection(\'orders\')">See All</button></div><div class="order-list" style="margin-top:14px">'+(ORDERS.slice(0,3).map(orderRow).join('')||'<div class="empty"><p class="muted">No orders yet.</p><a class="btnx primary" href="shop.html">Start Shopping</a></div>')+'</div></div><div class="profile-card"><h3>Quick Access</h3><div class="quick-grid"><a class="quick" href="orders.html"><div class="quick-icon">📦</div><b>My Orders</b><div class="sub">View, view details and track orders</div></a><a class="quick" href="wishlist.html"><div class="quick-icon">❤️</div><b>My Wishlist</b><div class="sub">Saved products</div></a><a class="quick" href="cart.html"><div class="quick-icon">🛒</div><b>My Cart</b><div class="sub">Review items before checkout</div></a><a class="quick" href="#" onclick="showSection(\'personal\');return false"><div class="quick-icon">✏️</div><b>Edit Profile</b><div class="sub">Update name and mobile number</div></a><a class="quick" href="#" onclick="showSection(\'addresses\');return false"><div class="quick-icon">📍</div><b>Addresses</b><div class="sub">Manage delivery addresses</div></a><a class="quick" href="transactions.html"><div class="quick-icon">💳</div><b>Payments</b><div class="sub">Payment and transaction records</div></a></div></div></div>
 <div id="sec-personal" class="profile-section hidden"><div class="profile-card"><h3>Personal Details</h3><p class="sub">Keep your customer information up to date.</p><div id="personalMsg" class="notice"></div><form onsubmit="savePersonal(event)" style="margin-top:16px"><div class="grid2"><div class="field"><label>Full Name</label><input id="fullName" value="'+esc(PROFILE.full_name||'')+'" maxlength="100" required></div><div class="field"><label>Mobile Number</label><input id="phone" value="'+esc(PROFILE.phone||'')+'" maxlength="20" inputmode="tel"></div><div class="field"><label>Email Address</label><input value="'+esc(USER.email||'')+'" disabled></div><div class="field"><label>Account Type</label><input value="Customer" disabled></div></div><button class="btnx primary" style="margin-top:16px">Save Changes</button></form></div></div>
 <div id="sec-orders" class="profile-section hidden"><div class="profile-card"><div class="toolbar"><div><h3>My Orders</h3><div class="sub">Track your purchases and open full order details.</div></div><a class="btnx outline" href="orders.html">View All Orders</a></div><div class="order-list" style="margin-top:15px">'+(ORDERS.map(orderRow).join('')||'<div class="empty"><p class="muted">No orders yet.</p><a class="btnx primary" href="shop.html">Start Shopping</a></div>')+'</div></div></div>
 <div id="sec-addresses" class="profile-section hidden"><div class="profile-card"><div class="toolbar"><div><h3>Delivery Addresses</h3><div class="sub">The address used for delivery and shown in your order details.</div></div><button class="btnx amber" onclick="toggleAddressForm()">+ Add Address</button></div><div id="addressForm" class="hidden" style="margin-top:16px"><form onsubmit="addAddress(event)"><div class="grid2"><div class="field"><label>Name</label><input id="aname" required></div><div class="field"><label>Phone</label><input id="aphone" required inputmode="tel"></div><div class="field"><label>Address</label><input id="aline" required></div><div class="field"><label>Village / Locality</label><input id="avillage"></div><div class="field"><label>City / Town</label><input id="acity" required></div><div class="field"><label>District</label><input id="adistrict"></div><div class="field"><label>State</label><input id="astate" value="Jharkhand" required></div><div class="field"><label>PIN Code</label><input id="apin" required pattern="[0-9]{6}" inputmode="numeric"></div></div><label style="display:block;margin:13px 0"><input type="checkbox" id="adefault"> Set as default address</label><button class="btnx primary">Save Address</button></form></div><div id="addressList" class="address-list"></div></div></div>
 <div id="sec-wishlist" class="profile-section hidden"><div class="profile-card"><h3>My Wishlist</h3><p class="sub">Saved products are managed from the customer wishlist page.</p><a class="btnx primary" href="wishlist.html" style="margin-top:15px">Open Wishlist</a></div></div>
 <div id="sec-payments" class="profile-section hidden"><div class="profile-card"><h3>Payments</h3><p class="sub">Payment records can include Razorpay payments and Cash on Delivery, as reflected in your order.</p><div class="payment-grid" style="margin-top:15px"><div class="payment-box"><div class="mini">Payment records</div><div style="font-weight:800;font-size:18px;margin-top:5px">Transactions</div><a class="btnx amber" href="transactions.html" style="margin-top:14px">View Transactions</a></div><div class="payment-box"><div class="mini">Order payment</div><div style="font-weight:800;font-size:18px;margin-top:5px">Payment details</div><div class="mini" style="margin-top:8px">Open any order to see amount, payment status and transaction/method.</div></div></div></div></div>
 <div id="sec-returns" class="profile-section hidden"><div class="profile-card"><h3>Returns & Refunds</h3><p class="sub">For delivered orders, open the order and use the return/refund flow where eligible.</p><a class="btnx primary" href="returns.html" style="margin-top:15px">Open Returns</a></div></div>
 <div id="sec-support" class="profile-section hidden"><div class="profile-card"><h3>Help & Support</h3><p class="sub">Need help with an order, payment, delivery or account?</p><a class="btnx primary" href="contact.html" style="margin-top:15px">Contact Support</a></div></div>
 </section></div>';
 renderAddresses();
}
function showSection(name){document.querySelectorAll('.profile-section').forEach(x=>x.classList.add('hidden'));const s=document.getElementById('sec-'+name);if(s)s.classList.remove('hidden');document.querySelectorAll('.profile-side button[data-section]').forEach(b=>b.classList.toggle('active',b.dataset.section===name));if(name==='addresses')renderAddresses();window.scrollTo({top:0,behavior:'smooth'})}
async function savePersonal(e){e.preventDefault();const name=document.getElementById('fullName').value.trim(),phone=document.getElementById('phone').value.trim();const r=await window.agriSupabase.from('profiles').update({full_name:name,phone,updated_at:new Date().toISOString()}).eq('id',USER.id);const m=document.getElementById('personalMsg');m.className='notice '+(r.error?'err':'ok');m.textContent=r.error?r.error.message:'Profile updated successfully.';if(!r.error){PROFILE.full_name=name;PROFILE.phone=phone;renderShell();showSection('personal')}}
function toggleAddressForm(){document.getElementById('addressForm').classList.toggle('hidden')}
function renderAddresses(){const el=document.getElementById('addressList');if(!el)return;el.innerHTML=ADDRESSES.length?ADDRESSES.map(a=>'<div class="address-card"><div class="address-top"><b>'+esc(a.name)+'</b>'+(a.is_default?'<span class="badge">✓ Default</span>':'')+'</div><div style="font-size:13px;margin-top:8px">'+esc(a.phone)+'</div><div class="sub" style="margin-top:6px">'+esc(a.line||'')+(a.village?', '+esc(a.village):'')+', '+esc(a.city||'')+(a.district?', '+esc(a.district):'')+', '+esc(a.state||'')+' — '+esc(a.pin||'')+'</div><button class="btnx ghost" style="margin-top:12px" onclick="deleteAddress(\''+esc(a.id)+'\')">Delete</button></div>').join(''):'<div class="empty" style="grid-column:1/-1"><p class="muted">No saved addresses yet.</p></div>'}
async function addAddress(e){e.preventDefault();const data={user_id:USER.id,name:aname.value.trim(),phone:aphone.value.trim(),line:aline.value.trim(),village:avillage.value.trim()||null,city:acity.value.trim(),district:adistrict.value.trim()||null,state:astate.value.trim(),pin:apin.value.trim(),is_default:adefault.checked};if(data.is_default){const x=await window.agriSupabase.from('addresses').update({is_default:false}).eq('user_id',USER.id);if(x.error){alert(x.error.message);return}}const r=await window.agriSupabase.from('addresses').insert(data);if(r.error){alert(r.error.message);return}e.target.reset();document.getElementById('astate').value='Jharkhand';document.getElementById('addressForm').classList.add('hidden');await loadAddresses();renderAddresses()}
async function deleteAddress(id){if(!confirm('Delete this address?'))return;const r=await window.agriSupabase.from('addresses').delete().eq('id',id).eq('user_id',USER.id);if(r.error)alert(r.error.message);else{await loadAddresses();renderAddresses()}}
async function logout(){if(!confirm('Are you sure you want to log out?'))return;try{await AgriAuth.signOut()}catch(e){alert(e.message||'Unable to log out.')}}
</script>
</body></html>
