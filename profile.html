<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Account — AgriMart</title>
<link rel="stylesheet" href="assets/style.css?v=20260903-profilefix">
<style>
body{background:#f7f5f0}.wrap{max-width:1100px;margin:auto;padding:24px 16px}.layout{display:grid;grid-template-columns:240px 1fr;gap:20px}.side,.card{background:#fff;border:1px solid #e7e2d6;border-radius:16px;box-shadow:0 4px 18px rgba(0,0,0,.05)}.side{background:#16213e;color:#fff;padding:12px;height:max-content}.user{padding:14px 10px 18px;border-bottom:1px solid #ffffff22;margin-bottom:8px}.avatar{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#e0932a;color:#16213e;font-weight:800;font-size:22px}.side button{width:100%;border:0;background:transparent;color:#d5dbea;text-align:left;padding:11px 12px;border-radius:9px;font-weight:700;cursor:pointer}.side button.active,.side button:hover{background:#e0932a;color:#16213e}.logout{margin-top:8px;border-top:1px solid #ffffff22!important}.hero{background:#16213e;color:#fff;border-radius:16px;padding:24px;display:flex;justify-content:space-between;align-items:center}.card{padding:20px;margin-top:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}.stat{background:#fff;border:1px solid #e7e2d6;border-radius:14px;padding:16px}.stat b{display:block;font-size:22px;margin-top:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field label{font-weight:700;font-size:13px;color:#79715f}.field input{padding:11px;border:1px solid #d6d0c4;border-radius:9px;font-size:15px}.btn{border:0;border-radius:9px;padding:10px 15px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:#16213e;color:#fff}.amber{background:#e0932a;color:#16213e}.outline{background:#fff;color:#16213e;border:1px solid #d8d1c3}.msg{display:none;padding:10px 12px;border-radius:9px;margin:12px 0}.msg.ok{display:block;background:#e5f3ea;color:#166534}.msg.err{display:block;background:#fef2f2;color:#991b1b}.empty{text-align:center;padding:35px}.row,.address{border:1px solid #e7e2d6;border-radius:12px;padding:14px;margin-top:10px;display:flex;gap:12px;align-items:center;justify-content:space-between}.address{display:block}.muted{color:#79715f;font-size:13px}.hidden{display:none!important}.tag{padding:5px 9px;border-radius:99px;background:#f7eae0;font-size:12px;font-weight:800}.actions{display:flex;gap:8px;flex-wrap:wrap}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}@media(max-width:800px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}@media(max-width:520px){.stats{grid-template-columns:1fr}.hero{padding:18px}.hero .avatar{display:none}.row{align-items:flex-start;flex-direction:column}}
</style></head>
<body><div id="site-header"></div><main class="wrap"><div id="root"><div class="card empty">Loading profile…</div></div></main><div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/data.js?v=20260903-profilefix"></script><script src="assets/common.js?v=20260903-profilefix"></script><script src="assets/supabase-client.js?v=20260903-profilefix"></script>
<script>
(function(){'use strict';const root=document.getElementById('root');let sb,user,profile,addresses=[],orders=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>'₹'+Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:2});const initials=n=>(String(n||'Customer').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('')||'C').toUpperCase();function showMsg(t,ok){let x=document.getElementById('msg');if(x){x.className='msg '+(ok?'ok':'err');x.textContent=t}}
async function getProfile(){let r=await sb.from('profiles').select('id,full_name,phone,role,avatar_url').eq('id',user.id).maybeSingle();if(r.error)throw r.error;if(r.data)return r.data;r=await sb.from('profiles').insert({id:user.id,full_name:user.user_metadata?.full_name||user.user_metadata?.name||'',phone:user.user_metadata?.phone||''}).select('id,full_name,phone,role,avatar_url').single();if(r.error)throw r.error;return r.data}
async function load(){profile=await getProfile();let a=await sb.from('addresses').select('*').eq('user_id',user.id).order('is_default',{ascending:false}).order('created_at',{ascending:false});if(a.error)throw a.error;addresses=a.data||[];let o=await sb.from('orders').select('id,order_number,status,total,created_at,order_items(product_name,quantity)').eq('user_id',user.id).order('created_at',{ascending:false});if(o.error)throw o.error;orders=o.data||[];render()}
function orderRow(o){let n=o.order_number||o.id;return `<div class="row"><div><b>${esc(n)}</b><div>${esc(o.order_items?.[0]?.product_name||'Order items')}</div><div class="muted">${esc(o.created_at?new Date(o.created_at).toLocaleDateString('en-IN'):'')} · ${money(o.total)}</div></div><div class="actions"><span class="tag">${esc(String(o.status||'pending').replace(/\b\w/g,x=>x.toUpperCase()))}</span><a class="btn outline" href="order.html?id=${encodeURIComponent(n)}">View Order</a><a class="btn primary" href="order.html?id=${encodeURIComponent(n)}">Track Order</a></div></div>`}
function render(){let first=(profile.full_name||'Customer').split(/\s+/)[0],del=orders.filter(o=>o.status==='delivered').length,spent=orders.reduce((s,o)=>s+Number(o.total||0),0);root.innerHTML=`<div class="layout"><aside class="side"><div class="user"><div class="avatar">${esc(initials(profile.full_name))}</div><div style="margin-top:9px"><b>${esc(profile.full_name||'Customer')}</b><div class="muted" style="color:#b9c2d6">${esc(user.email||'')}</div></div></div><button data-s="overview">👤 Overview</button><button data-s="personal">✏️ Personal Details</button><button data-s="orders">📦 My Orders</button><button data-s="addresses">📍 Addresses</button><button data-s="wishlist">❤️ Wishlist</button><button data-s="payments">💳 Payments</button><button data-s="returns">↩️ Returns & Refunds</button><button data-s="support">❓ Help & Support</button><button id="logout" class="logout">🚪 Logout</button></aside><section><div id="msg" class="msg"></div><div id="sec-overview"><div class="hero"><div><div style="color:#b9c2d6">Namaste,</div><h2 style="margin:4px 0">${esc(first)}</h2><div style="color:#b9c2d6">Customer account · ${esc(user.email||'')}</div></div><div class="avatar">${esc(initials(profile.full_name))}</div></div><div class="stats"><div class="stat"><span class="muted">Orders</span><b>${orders.length}</b></div><div class="stat"><span class="muted">Delivered</span><b>${del}</b></div><div class="stat"><span class="muted">Addresses</span><b>${addresses.length}</b></div><div class="stat"><span class="muted">Total Spent</span><b>${money(spent)}</b></div></div><div class="card"><div class="topline"><div><h3>Recent Orders</h3><div class="muted">View or track your orders.</div></div><button class="btn outline" data-jump="orders">See All</button></div>${orders.slice(0,5).map(orderRow).join('')||'<div class="empty muted">No orders yet.</div>'}</div></div><div id="sec-personal" class="card hidden"><h3>Personal Details</h3><p class="muted">Update your customer information.</p><form id="personalForm"><div class="grid"><div class="field"><label>Full Name</label><input id="name" required value="${esc(profile.full_name||'')}"></div><div class="field"><label>Mobile Number</label><input id="phone" value="${esc(profile.phone||'')}" inputmode="tel"></div><div class="field"><label>Email</label><input disabled value="${esc(user.email||'')}"></div><div class="field"><label>Account Role</label><input disabled value="${esc(profile.role||'customer')}"></div></div><button class="btn amber">Save Profile</button></form></div><div id="sec-orders" class="card hidden"><div class="topline"><div><h3>My Orders</h3><p class="muted">Your orders and customer-visible tracking.</p></div><a class="btn outline" href="shop.html">Shop</a></div>${orders.map(orderRow).join('')||'<div class="empty muted">No orders found.</div>'}</div><div id="sec-addresses" class="card hidden"><div class="topline"><div><h3>Addresses</h3><p class="muted">Manage your delivery addresses.</p></div><button class="btn amber" id="addAddress">+ Add Address</button></div><div id="addressForm" class="hidden" style="margin-top:15px"><form id="addrForm"><div class="grid"><div class="field"><label>Name</label><input id="aname" required></div><div class="field"><label>Phone</label><input id="aphone" required></div><div class="field"><label>Address</label><input id="aline" required></div><div class="field"><label>Village</label><input id="avillage"></div><div class="field"><label>City</label><input id="acity" required></div><div class="field"><label>District</label><input id="adistrict"></div><div class="field"><label>State</label><input id="astate" required></div><div class="field"><label>PIN</label><input id="apin" required inputmode="numeric"></div></div><label><input id="adefault" type="checkbox"> Set as default</label><div class="actions" style="margin-top:12px"><button class="btn amber">Save Address</button><button type="button" class="btn outline" id="cancelAddr">Cancel</button></div></form></div><div id="addressList">${addresses.map(addressRow).join('')||'<div class="empty muted">No saved addresses.</div>'}</div></div>${simple('wishlist','❤️ Wishlist','Open your saved products.','wishlist.html','View Wishlist')}${simple('payments','💳 Payments','View payment and transaction records.','transactions.html','View Transactions')}${simple('returns','↩️ Returns & Refunds','Your return and refund requests are managed from your orders.','orders.html','View Orders')}${simple('support','❓ Help & Support','Need help with an order or account?','contact.html','Contact Support')}</section></div>`;root.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>show(b.dataset.s));root.querySelector('#logout').onclick=logout;root.querySelector('#personalForm').onsubmit=saveProfile;root.querySelector('#addAddress').onclick=()=>{root.querySelector('#addressForm').classList.remove('hidden');root.querySelector('#addrForm').onsubmit=saveAddress};root.querySelector('#cancelAddr').onclick=()=>root.querySelector('#addressForm').classList.add('hidden');root.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>show(b.dataset.jump));show('overview')}
function addressRow(a){return `<div class="address"><div class="topline"><b>${esc(a.name)}</b>${a.is_default?'<span class="tag">Default</span>':''}</div><div>${esc(a.line)}${a.village?', '+esc(a.village):''}, ${esc(a.city)}${a.district?', '+esc(a.district):''}, ${esc(a.state)} — ${esc(a.pin)}</div><div class="muted">${esc(a.phone||'')}</div><div class="actions" style="margin-top:8px"><button class="btn outline" onclick="window.editAddress('${a.id}')">Edit</button><button class="btn outline" onclick="window.deleteAddress('${a.id}')">Delete</button></div></div>`}
function simple(id,t,d,h,l){return `<div id="sec-${id}" class="card hidden"><h3>${t}</h3><p class="muted">${d}</p><a class="btn primary" href="${h}">${l}</a></div>`}function show(s){root.querySelectorAll('[id^="sec-"]').forEach(x=>x.classList.add('hidden'));let e=root.querySelector('#sec-'+s);if(e)e.classList.remove('hidden');root.querySelectorAll('[data-s]').forEach(b=>b.classList.toggle('active',b.dataset.s===s))}
async function saveProfile(e){e.preventDefault();let name=root.querySelector('#name').value.trim(),phone=root.querySelector('#phone').value.trim();let r=await sb.from('profiles').update({full_name:name,phone,updated_at:new Date().toISOString()}).eq('id',user.id);if(r.error){showMsg(r.error.message,false);return}profile.full_name=name;profile.phone=phone;render();show('personal');showMsg('Profile updated successfully.',true)}
async function saveAddress(e){e.preventDefault();let d={user_id:user.id,name:aname.value.trim(),phone:aphone.value.trim(),line:aline.value.trim(),village:avillage.value.trim(),city:acity.value.trim(),district:adistrict.value.trim(),state:astate.value.trim(),pin:apin.value.trim(),is_default:adefault.checked};if(d.is_default){let x=await sb.from('addresses').update({is_default:false}).eq('user_id',user.id);if(x.error){showMsg(x.error.message,false);return}}let r=await sb.from('addresses').insert(d);if(r.error){showMsg(r.error.message,false);return}await load();show('addresses');showMsg('Address saved successfully.',true)}
window.deleteAddress=async id=>{if(!confirm('Delete this address?'))return;let r=await sb.from('addresses').delete().eq('id',id).eq('user_id',user.id);if(r.error){showMsg(r.error.message,false);return}await load();show('addresses');showMsg('Address deleted.',true)};
window.editAddress=async id=>{let a=addresses.find(x=>x.id===id);if(!a)return;root.querySelector('#addressForm').classList.remove('hidden');aname.value=a.name||'';aphone.value=a.phone||'';aline.value=a.line||'';avillage.value=a.village||'';acity.value=a.city||'';adistrict.value=a.district||'';astate.value=a.state||'';apin.value=a.pin||'';adefault.checked=!!a.is_default;root.querySelector('#addrForm').onsubmit=async e=>{e.preventDefault();let d={name:aname.value.trim(),phone:aphone.value.trim(),line:aline.value.trim(),village:avillage.value.trim(),city:acity.value.trim(),district:adistrict.value.trim(),state:astate.value.trim(),pin:apin.value.trim(),is_default:adefault.checked};if(d.is_default){let x=await sb.from('addresses').update({is_default:false}).eq('user_id',user.id);if(x.error){showMsg(x.error.message,false);return}}let r=await sb.from('addresses').update(d).eq('id',id).eq('user_id',user.id);if(r.error){showMsg(r.error.message,false);return}await load();show('addresses');showMsg('Address updated successfully.',true)}};
async function logout(){await sb.auth.signOut();location.href='index.html'}async function boot(){try{sb=window.agriSupabase;if(!sb)throw Error('Supabase client failed to load.');let s=await sb.auth.getSession();user=s.data?.session?.user||null;if(!user){location.href='login.html?next='+encodeURIComponent('profile.html');return}await load()}catch(e){console.error(e);root.innerHTML='<div class="card empty"><h3>Profile could not be loaded</h3><p class="muted">'+esc(e.message||'Please try again.')+'</p><button class="btn primary" onclick="location.reload()">Retry</button></div>'}}boot();})();
</script></body></html>
