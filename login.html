<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — AgriMart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="account">

<div id="site-header"></div>

<main>
  <div class="container">
    <div class="auth-wrap">
      <h2 style="text-align:center;margin-bottom:6px;">Welcome to AgriMart</h2>
      <p class="muted center" style="font-size:13px;margin-bottom:22px;">Sign in to manage orders, wishlist and more.</p>
      <div class="role-switch" id="roleSwitch"></div>
      <div class="form-field full" style="margin-bottom:12px;"><label>Email or Mobile Number</label><input id="loginEmail" placeholder="you@example.com" value="demo@agrimart.in"></div>
      <div class="form-field full" style="margin-bottom:18px;"><label>Password</label><input id="loginPass" type="password" placeholder="••••••••" value="demo1234"></div>
      <button class="btn btn-primary btn-block" id="signInBtn" onclick="doLogin()">Sign In</button>
      <p class="muted center" style="font-size:12px;margin-top:16px;">Demo mode — any credentials will work. This selects a role to preview that experience.</p>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="assets/data.js"></script>
<script src="assets/common.js"></script>
<script>
function initPage(){ renderRoleSwitch(); }
function renderRoleSwitch(){
  const r = state.role;
  document.getElementById('roleSwitch').innerHTML = ['customer','seller','admin'].map(x=>
    `<button class="${r===x?'active':''}" onclick="setRole('${x}')">${x.charAt(0).toUpperCase()+x.slice(1)}</button>`).join('');
  document.getElementById('signInBtn').textContent = 'Sign In as ' + r.charAt(0).toUpperCase()+r.slice(1);
}
function setRole(r){ state.role = r; renderRoleSwitch(); }
function doLogin(){
  const r = state.role;
  toast('Signed in successfully as ' + r);
  if(r==='admin') window.location.href = 'admin.html';
  else if(r==='seller') window.location.href = 'seller.html';
  else window.location.href = 'index.html';
}
</script>
</body>
</html>
