<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign In — AgriMart</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="account">
<div id="site-header"></div><main><div class="container"><div class="auth-wrap">
<h2 style="text-align:center;margin-bottom:6px;">Welcome to AgriMart</h2><p class="muted center" style="font-size:13px;margin-bottom:22px;">Sign in to manage orders, wishlist and more.</p>
<div class="form-field full" style="margin-bottom:12px;"><label>Email</label><input id="loginEmail" type="email" autocomplete="email" placeholder="you@example.com" required></div>
<div class="form-field full" style="margin-bottom:18px;"><label>Password</label><input id="loginPass" type="password" autocomplete="current-password" placeholder="Your password" required></div>
<button class="btn btn-primary btn-block" id="signInBtn" onclick="doLogin()">Sign In</button><p id="loginMessage" class="muted center" style="font-size:12px;margin-top:14px;"></p>
<p class="center" style="font-size:13px;margin-top:18px;">New customer? <a href="signup.html">Create an account</a></p>
</div></div></main><div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/data.js"></script><script src="assets/common.js"></script><script src="assets/supabase-client.js"></script><script src="assets/auth.js"></script>
<script>
const nextPage=new URLSearchParams(window.location.search).get('next');
function safeNext(){const allowed=['checkout.html','cart.html','wishlist.html','orders.html','profile.html'];if(!nextPage)return null;const clean=nextPage.split('?')[0];return allowed.includes(clean)?nextPage:null;}
async function initPage(){try{const user=await AgriAuth.getCurrentUser();if(user){const profile=await AgriAuth.getProfile(user.id);redirectAfterLogin(profile&&profile.role);}}catch(e){console.warn('Session check:',e.message);}}
function redirectAfterLogin(role){const target=safeNext();if(target&&role!=='admin'&&role!=='seller'){window.location.replace(target);return;}if(role==='admin')window.location.replace('admin.html');else if(role==='seller')window.location.replace('seller.html');else window.location.replace('index.html');}
async function doLogin(){const email=document.getElementById('loginEmail').value.trim(),password=document.getElementById('loginPass').value,msg=document.getElementById('loginMessage'),btn=document.getElementById('signInBtn');if(!email||!password){msg.textContent='Please enter email and password.';return;}btn.disabled=true;btn.textContent='Signing in…';msg.textContent='';try{const result=await AgriAuth.signIn(email,password);if(!result?.session)throw new Error('Login succeeded but no active session was created. Please try again.');const profile=await AgriAuth.getProfile(result.user.id);toast('Signed in successfully');redirectAfterLogin(profile&&profile.role);}catch(e){console.error(e);msg.textContent=e.message||'Unable to sign in.';}finally{btn.disabled=false;btn.textContent='Sign In';}}
</script></body></html>
