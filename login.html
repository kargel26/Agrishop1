<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Customer Sign In — AgriMart</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/style.css"><style>.customer-auth{background:#fbfaf6}.customer-auth .auth-wrap{max-width:440px;margin:64px auto;padding:34px;border-radius:20px;background:#fffdf8;border:1px solid #e8e1d3;box-shadow:0 16px 45px rgba(80,60,30,.08)}.customer-mark{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;margin:0 auto 16px;background:#f1eadb;color:#6b4d2e;font:700 22px 'Fraunces',serif}.customer-auth h2{font-family:'Fraunces',serif;font-size:30px;text-align:center;margin-bottom:6px}.customer-auth input{background:#fff;border-color:#ddd5c5}.customer-auth .btn-primary{background:#5d7b3f;border-color:#5d7b3f}</style></head><body class="customer-auth" data-page="account"><div id="site-header"></div><main><div class="container"><div class="auth-wrap"><div class="customer-mark">C</div><h2>Welcome to AgriMart</h2><p class="muted center" style="font-size:13px;margin-bottom:22px">Sign in to shop, manage orders, wishlist and your profile.</p><div class="form-field full" style="margin-bottom:12px"><label>Email</label><input id="loginEmail" type="email" autocomplete="email" placeholder="you@example.com" required></div><div class="form-field full" style="margin-bottom:18px"><label>Password</label><input id="loginPass" type="password" autocomplete="current-password" placeholder="Your password" required></div><button class="btn btn-primary btn-block" id="signInBtn" onclick="doLogin()">Customer Sign In</button><p id="loginMessage" class="muted center" style="font-size:12px;margin-top:14px"></p><p class="center" style="font-size:13px;margin-top:18px">New customer? <a href="signup.html">Create an account</a></p></div></div></main><div id="site-footer"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/data.js"></script><script src="assets/common.js"></script><script src="assets/supabase-client.js"></script><script src="assets/auth.js"></script><script>const nextPage=new URLSearchParams(window.location.search).get('next');function safeNext(){const allowed=['checkout.html','cart.html','wishlist.html','orders.html','profile.html'];if(!nextPage)return null;const clean=nextPage.split('?')[0];return allowed.includes(clean)?nextPage:null}async function initPage(){try{const user=await AgriAuth.getCurrentUser();if(user){const profile=await AgriAuth.getProfile(user.id);redirectAfterLogin(profile&&profile.role)}}catch(e){console.warn('Session check:',e.message)}}function redirectAfterLogin(role){const target=safeNext();if(target&&role!=='admin'&&role!=='seller'){location.replace(target);return}if(role==='admin')location.replace('admin.html');else if(role==='seller')location.replace('seller.html');else location.replace('index.html')}async function doLogin(){const email=document.getElementById('loginEmail').value.trim(),password=document.getElementById('loginPass').value,msg=document.getElementById('loginMessage'),btn=document.getElementById('signInBtn');if(!email||!password){msg.textContent='Please enter email and password.';return}btn.disabled=true;btn.textContent='Signing in…';msg.textContent='';try{const result=await AgriAuth.signIn(email,password);if(!result?.session)throw new Error('Login succeeded but no active session was created. Please try again.');const profile=await AgriAuth.getProfile(result.user.id);if(profile?.role==='admin'||profile?.role==='seller'){await AgriAuth.signOut();throw new Error('Please use the dedicated portal for this account.')}toast('Customer signed in successfully');redirectAfterLogin(profile?.role)}catch(e){console.error(e);msg.textContent=e.message||'Unable to sign in.'}finally{btn.disabled=false;btn.textContent='Customer Sign In'}}</script></body></html>
