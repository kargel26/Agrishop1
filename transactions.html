<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Transactions — AgriMart</title><link rel="stylesheet" href="assets/style.css"></head><body data-page="account"><div id="site-header"></div><main><div class="container" style="max-width:900px"><div class="breadcrumb"><a href="index.html">Home</a><span class="sep">/</span><a href="profile.html">Profile</a><span class="sep">/</span><span class="cur">Transactions</span></div><h2 style="font-size:26px;margin-bottom:20px">Transactions</h2><div id="txRoot"></div></div></main><div id="site-footer"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/data.js"></script><script src="assets/common.js"></script><script src="assets/supabase-client.js"></script><script src="assets/auth.js"></script><script src="assets/orders.js"></script><script>async function initPage(){const root=document.getElementById('txRoot');try{const user=await AgriAuth.getCurrentUser();if(!user){root.innerHTML='<div class="empty-state"><h3>Please sign in</h3><a class="btn btn-primary" href="login.html?next=transactions.html">Sign In</a></div>';return;}const rows=await AgriOrders.getTransactions();if(!rows.length){root.innerHTML='<div class="empty-state"><div class="ic">💳</div><h3>No transactions yet</h3><p>Your Razorpay payment history will appear here.</p></div>';return;}root.innerHTML=rows.map(x=>'<div class="panel-card"><div class="flex-between" style="flex-wrap:wrap;gap:10px"><div><b>Order #'+esc(x.orders?.order_number||'—')+'</b><div class="muted" style="font-size:12px">'+new Date(x.created_at).toLocaleString()+'</div></div><span class="status-chip">'+esc(x.status)+'</span></div><div class="summary-row" style="margin-top:12px"><span>Amount</span><b>'+fmt(x.amount)+'</b></div><div class="summary-row"><span>Provider</span><span>'+esc(x.provider||'razorpay')+'</span></div><div class="summary-row"><span>Payment ID</span><span style="font-size:12px">'+esc(x.razorpay_payment_id||'Pending')+'</span></div><a class="btn btn-outline btn-sm" style="margin-top:12px" href="order.html?id='+encodeURIComponent(x.orders?.order_number||'')+'">View Order</a></div>').join('');}catch(e){console.error(e);root.innerHTML='<div class="empty-state"><h3>Could not load transactions</h3><p>'+esc(e.message)+'</p></div>';}}function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]));}</script></body></html>
