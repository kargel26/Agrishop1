<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Sign In — AgriMart</title><link rel="stylesheet" href="assets/style.css">
<style>
body.admin-auth{background:#0f172a;color:#e5e7eb;font-family:Inter,system-ui,sans-serif}.admin-auth #site-header,.admin-auth #site-footer{display:none}
.admin-auth main{min-height:100vh;display:grid;place-items:center;padding:24px}.admin-auth .auth-wrap{width:min(430px,100%);padding:38px;border-radius:16px;background:#111827;border:1px solid #263244;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.admin-brand{display:flex;align-items:center;gap:12px;margin-bottom:25px}.admin-logo{width:46px;height:46px;border-radius:10px;display:grid;place-items:center;background:#e5e7eb;color:#111827;font-weight:800}.admin-label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#94a3b8;font-weight:700}.admin-auth h2{margin:5px 0 7px;font-size:28px}.admin-auth .sub{color:#94a3b8;font-size:13px;margin-bottom:25px}.admin-auth .form-field label{color:#cbd5e1}.admin-auth input{background:#0b1220;color:#fff;border-color:#334155}.admin-auth .btn-primary{background:#e5e7eb;border-color:#e5e7eb;color:#111827}.admin-auth .btn-primary:hover{background:#fff}.admin-auth .muted{color:#94a3b8}.admin-links{margin-top:20px;text-align:center;font-size:12px}.admin-links a{color:#cbd5e1;text-decoration:none}.security-note{margin-top:22px;padding:11px 12px;border:1px solid #263244;border-radius:10px;color:#94a3b8;font-size:11px;line-height:1.5}
</style></head>
<body class="admin-auth" data-page="account"><div id="site-header"></div><main><div class="auth-wrap">
<div class="admin-brand"><div class="admin-logo">A</div><div><div class="admin-label">AgriMart</div><strong>Administration</strong></div></div>
<h2>Admin Sign In</h2><p class="sub">Restricted access to the AgriMart management console.</p>
<div class="form-field full" style="margin-bottom:13px"><label>Email</label><input id="adminEmail" type="email" autocomplete="username" placeholder="admin@example.com"></div>
<div class="form-field full" style="margin-bottom:18px"><label>Password</label><input id="adminPass" type="password" autocomplete="current-password" placeholder="Admin password"></div>
<button class="btn btn-primary btn-block" id="adminBtn" onclick="adminLogin()">Secure Sign In</button><p id="adminMessage" class="muted center" style="font-size:12px;margin-top:14px"></p>
<div class="security-note">Admin access is verified against the authenticated Supabase profile role. Customer and seller accounts cannot enter this portal.</div>
<div class="admin-links"><a href="login.html">Customer Sign In</a> &nbsp;·&nbsp; <a href="seller-login.html">Seller Sign In</a></div>
</div></main><div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/data.js"></script><script src="assets/common.js"></script><script src="assets/supabase-client.js"></script><script src="assets/auth.js"></script>
<script>async function initPage(){const u=await AgriAuth.getCurrentUser();if(u){const p=await AgriAuth.getProfile(u.id);if(p?.role==='admin')location.replace('admin.html');}}async function adminLogin(){const email=document.getElementById('adminEmail').value.trim(),pass=document.getElementById('adminPass').value,msg=document.getElementById('adminMessage'),btn=document.getElementById('adminBtn');if(!email||!pass){msg.textContent='Please enter admin email and password.';return;}btn.disabled=true;btn.textContent='Authenticating…';msg.textContent='';try{const r=await AgriAuth.signIn(email,pass);const p=await AgriAuth.getProfile(r.user.id);if(!p||p.role!=='admin'){await AgriAuth.signOut();throw new Error('This account does not have administrator access.');}toast('Admin signed in successfully');location.replace('admin.html');}catch(e){msg.textContent=e.message||'Admin sign in failed.';}finally{btn.disabled=false;btn.textContent='Secure Sign In';}}</script></body></html>
